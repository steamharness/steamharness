# 发布 npm 包。
#
# 触发：在 GitHub 上创建 Release，tag 以 steamharness/v 开头（例如
# steamharness/v0.1.0）。版本号取自各 package.json —— 先在普通提交里改版本号，
# 再打 Release，workflow 只负责把清单里已有的版本发出去。
# 也可以从 dev 分支手动触发，将 dev 预发布版本发布到 npm 的 dev 标签。
#
# 凭证：npm Trusted Publishing（OIDC）。workflow 里的 id-token 权限让 npm CLI 用
# 这一次运行的 OIDC 令牌换出短期发布凭证，GitHub 里不存放任何 npm token。
# 前置条件：在 npm 组织里把 steamharness/steamharness 与本文件登记为 Trusted
# Publisher，否则 npm 会拒绝发布。
#
# 只发两个公开包：harness（SDK）与 cli。其余包都是 private: true，递归发布不会
# 带上它们。
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

# 发布不可并发：两个发布同时改 dist-tag 会互相覆盖。
concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # 正式发布来自 steamharness/v* Release；手动 dev 发布只接受 dev 分支。
    if: startsWith(github.event.release.tag_name, 'steamharness/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      NPM_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # harness 的 engines 下限是 22.19.0
          node-version: 22
          cache: pnpm

      # trusted publishing 需要较新的 npm CLI 才能走 OIDC 换证
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      - name: 确认要发布的版本
        run: |
          node -e '
            const { createRequire } = require("node:module");
            const versions = [];
            for (const dir of ["harness", "cli"]) {
              const pkg = createRequire(`${process.cwd()}/${dir}/package.json`)("./package.json");
              versions.push(pkg.version);
              console.log(`  ${pkg.name}@${pkg.version}`);
            }
            if (versions[0] !== versions[1]) throw new Error("Core and CLI versions must match.");
            if (process.env.NPM_DIST_TAG === "dev" && !/^\d+\.\d+\.\d+-dev\./.test(versions[0])) {
              throw new Error("Dev publication requires a dev prerelease version.");
            }
            console.log(`  npm tag: ${process.env.NPM_DIST_TAG}`);
          '

      # pnpm pack 执行 prepack 构建并应用 publishConfig、workspace 版本替换。
      # CLI 的构建依赖 harness 的 dist，顺序不能反；两个包均成功打包后才发布。
      - name: 打包 steamharness（SDK）
        working-directory: harness
        run: pnpm pack --out "$RUNNER_TEMP/steamharness-core.tgz"

      - name: 打包 @steamharness/cli
        working-directory: cli
        run: pnpm pack --out "$RUNNER_TEMP/steamharness-cli.tgz"

      - name: 发布 steamharness（SDK）
        working-directory: harness
        run: npm publish "$RUNNER_TEMP/steamharness-core.tgz" --provenance --access public --tag "$NPM_DIST_TAG"

      - name: 发布 @steamharness/cli
        working-directory: cli
        run: npm publish "$RUNNER_TEMP/steamharness-cli.tgz" --provenance --access public --tag "$NPM_DIST_TAG"
