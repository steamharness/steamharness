interface:
  display_name: "SteamHarness 项目生成器"
  short_description: "生成 Workflow、Conversation 或静态产物 Kanban 项目"
  default_prompt: "使用 $project-generator 在指定目录中生成或修改 steamharness 项目。新项目默认使用简体中文且不加入国际化结构；只有用户明确要求多语言支持并说明目标语言时才进行 i18n 适配。包括带产物目录、HTML 入口、.steamharnessignore、项目级 KV 与知识库 Bridge 的 Kanban；修改框架源码后按项目现有脚本更新静态产物。"
