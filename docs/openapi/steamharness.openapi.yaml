        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "413":
          $ref: "#/components/responses/HarnessError"
        "415":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/project-card:
    put:
