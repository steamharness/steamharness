          type: boolean
    ConfigurationProfilePolicy:
      type: object
      description: Source-owned role policy. Client labels, role claims and personal metadata never grant authority.
        Projects without this policy keep their existing behavior.
      properties:
        version:
          type: integer
          enum:
            - 1
        defaultProfileKey:
