  /api/projects/{projectId}/publish:
    post:
      tags:
        - Admin Projects
      summary: 发布项目版本
      description: 以 draft 的 package 版本发布不可变源码快照并更新 latest。重复版本返回 409，不安装、构建或加载项目代码。
      operationId: publishProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: 初始发布
                expectedVersion:
                  type: string
                  description: 可选的预期草稿版本；不匹配时返回 409，防止发布其他操作替换的草稿。
                  pattern: '^\d+\.\d+\.\d+$'
                expectedSourceHash:
                  type: string
                  description: 上传处理结果 sourceHash；使用发布配置草稿时必填。源码变化时返回 409，不创建版本。
                  pattern: '^[a-f0-9]{64}$'
                expectedConfigurationRevision:
                  type: integer
                  minimum: 0
                  description: 发布配置草稿存在时必填。必须匹配草稿版本；草稿所引用的个人配置版本也必须保持不变。
      responses:
        "200":
          description: 发布结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
