    ProjectConfigurationAction:
      type: object
      description: At most 1 MiB. Revision is mandatory for every mutation. Profile mutations require id; create
        takes optional name. Save merges typed values and removes overrides named in unset. Field edits use
        field and optional old key. Import takes a complete document. Export optionally filters by id and
        always applies the current role. Fixed values and base names cannot be changed. Unauthorized batches
        are rejected atomically.
      properties:
        action:
          type: string
          enum:
            - get
            - export
            - create
            - duplicate
            - rename
            - save
            - select
            - delete
            - field.save
            - field.delete
            - import
            - publication.save
            - publication.preview
        revision:
          type: integer
          minimum: 0
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        profileKey:
          type: string
          description: Base policy inherited by a newly created personal configuration.
        values:
          type: object
          additionalProperties: true
        unset:
          type: array
          items:
            type: string
        field:
          $ref: "#/components/schemas/ProjectConfigurationField"
        key:
          type: string
        document:
          $ref: "#/components/schemas/ProjectConfigurationExport"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
      required:
        - action
    ProjectConfigurationResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/ProjectConfigurationState"
