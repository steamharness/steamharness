                $ref: "#/components/schemas/KnowledgeDocumentLinesResponse"
        "400":
          description: 行号参数无效或超过单次范围限制。
        "404":
          description: 指定 documentId 不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
