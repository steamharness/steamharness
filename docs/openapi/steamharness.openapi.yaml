      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"schema": {"type": "string", "minLength": 1, "maxLength": 1048576}, "migrations": {"type": "array", "maxItems": 1000, "items": {"$ref": "#/components/schemas/DatabaseMigration"}}}, "required": ["schema", "migrations"]}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/DatabaseMigrationPlan"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/migrations/deploy:
    post:
      tags: [Relational Databases]
      summary: "重放影子库历史并事务部署待执行迁移"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: databaseId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"migrations": {"type": "array", "maxItems": 1000, "items": {"$ref": "#/components/schemas/DatabaseMigration"}}, "schemaHash": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "acceptDataLoss": {"type": "boolean", "default": false}}, "required": ["migrations", "schemaHash"]}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/DatabaseMigrationState"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces:
    post:
      tags:
        - Runtime Storage
      summary: "登记或查找账号私有 Agent 工作区"
      description: "需要账号 Bearer token 或会话 Cookie，仅有系统管理密钥不够。项目工作区要求当前项目读取权限和已注册入口；本地/小助手工作区支持未发布项目，但不会授予已注册项目数据权限。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeWorkspaceInput"
      responses:
        "200":
          description: "返回已有或新登记的账号私有工作区。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/resolve:
    post:
      tags: [Runtime Storage]
      summary: "解析已注册项目或私有本地工作区"
      description: "已存在的项目要求当前读取权限和已注册入口。只有项目不存在时才解析为私有本地工作区；拒权不会回退。小助手身份单独管理。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeWorkspaceInput"
      responses:
        "200":
          description: "返回解析后的账号私有工作区。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}:
    get:
      tags:
        - Runtime Storage
      summary: "读取账号拥有的 Agent 工作区"
      description: "其他账号收到 404，系统管理员也不例外。每次重新检查项目权限和入口注册。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "返回当前账号的工作区。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/sessions/open:
    post:
      tags:
        - Runtime Storage
      summary: "取得 Agent 独占执行租约"
      description: "工作区和 sessionKey 定位历史。相同活动 ownerToken 返回原租约，其他活动 owner 收到 409。过期接管提升 fence；owner token 只保存哈希。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sessionKey
                - ownerToken
              properties:
                sessionKey:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: "不含 NUL 的稳定宿主身份。"
                ownerToken:
                  type: string
                  minLength: 32
                  maxLength: 128
                  writeOnly: true
      responses:
        "200":
          description: "会话租约，默认有效期 30 秒。"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuntimeStorageLease"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/history/{kind}:
    get:
      tags: [Runtime Storage]
      summary: "读取已提交的运行历史"
      description: "返回当前账号的有序消息、队列、事件和值，重新检查项目权限和入口注册。读取不会取得执行所有权。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RuntimeHistoryKind"
      responses:
        "200":
          description: "当前账号已提交的数据。"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RuntimeHistoryRecord"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/agent-sessions:
    get:
      tags: [Runtime Storage]
      summary: "列出已存储的 Agent 会话身份"
      description: "返回账号工作区中未删除且匹配字面前缀的 sessionKey。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: "当前账号已提交的数据。"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/snapshot:
    get:
      tags: [Runtime Storage]
      summary: "读取带版本的 Agent 会话快照"
      description: "使用一致性数据库快照，不接管或恢复源执行。活动 owner 可以继续运行；已删除会话返回 404。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionKey
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: "当前账号已提交的数据。"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuntimeAgentSessionSnapshot"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/sessions/{sessionId}/operations:
    post:
      tags:
        - Runtime Storage
      summary: "在当前租约下执行 Agent 存储操作"
      description: "每次检查账号所有权、项目权限、owner token、租约有效期和 fence，请求体最多 16 MiB。写操作在同一事务保存 requestId 与结果；submissionByRequest 等读取不作为写回执缓存。\n\n同一 ID 重试相同内容返回原结果，不同内容返回 409。拒绝 SQL 和可执行代码。错误在 data.code 中返回租约丢失、所有权、修订号或幂等冲突等 RUNTIME_STORAGE_* 代码。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ownerToken
                - fence
                - operation
              properties:
                ownerToken:
                  type: string
                  minLength: 32
                  maxLength: 128
                  writeOnly: true
                fence:
                  $ref: "#/components/schemas/RuntimeStorageId"
                operation:
                  $ref: "#/components/schemas/RuntimeStorageOperation"
      responses:
        "200":
          description: "返回记录、分页结果、提交序号、ID、续期租约或 null。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStorageResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /health:
    get:
      tags:
        - Health
      summary: "检查服务健康"
      security: []
      parameters:
        - in: header
          name: X-SteamHarness-Locale
          required: false
          description: "响应语言支持 zh-CN 和 en；未指定时保留 Server 的英文默认值。"
          schema:
            type: string
            enum:
              - zh-CN
              - en
            default: en
        - in: query
          name: locale
          required: false
          description: "供无法设置请求头的调用方或 WebSocket 使用的语言参数。X-SteamHarness-Locale 请求头优先。"
          schema:
            type: string
            enum:
              - zh-CN
              - en
      responses:
        "200":
          description: Server 正常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 0
                  errMessage:
                    type: string
                    const: ""
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      runtime:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - development
                              - production
                            example: production
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-29T09:55:00Z
                        required:
                          - mode
                          - startedAt
                      versions:
                        type: object
                        properties:
                          serverVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.3
                          coreVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.1
                        required:
                          - serverVersion
                          - coreVersion
                      currentRelease:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              summary:
                                type: string
                              body:
                                type: string
                                description: "所选语言的完整 Markdown 发布说明；旧元数据回退到 releaseNotes.body。"
                              docsUrl:
                                type: string
                                format: uri
                                description: "当前 Server 版本对应语言的独立发布日志地址。"
                                example: https://docs.steamharness.yuhe.space/en/guides/releases/server/v0.1.3
                            required:
                              - summary
                              - body
                              - docsUrl
                    required:
                      - status
                      - runtime
                      - versions
                      - currentRelease
                required:
                  - errCode
                  - errMessage
                  - data
  /api/auth/browser-session:
    post:
      tags: [Auth & Accounts]
      summary: "在 Server Web 复用原生客户端登录"
      operationId: createBrowserSession
      description: "使用账号 API Key 签发单次使用、60 秒有效的跳转码，目标必须是站内绝对路径。不会创建新账号会话或 API Key，权限沿用原账号与密钥；响应不缓存，每个密钥每分钟最多 20 次。"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnTo]
              properties:
                returnTo: {type: string, maxLength: 2048, example: /databases}
      responses:
        "200":
          description: "返回短期网页跳转码，不返回原 token。"
          content:
            application/json:
              schema:
                type: object
                required: [errCode, errMessage, data]
                properties:
                  errCode: {type: integer, const: 0}
                  errMessage: {type: string}
                  data:
                    type: object
                    required: [code, expiresAt]
                    properties:
                      code: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                      expiresAt: {type: string, format: date-time}
        default:
          $ref: "#/components/responses/HarnessError"
    get:
      tags: [Auth & Accounts]
      summary: "消费跳转码并打开目标页面"
      operationId: consumeBrowserSession
      description: "单次消费跳转码，复查原 API Key，设置签名 HttpOnly、SameSite=Lax Cookie 后重定向。每次请求仍检查原密钥的撤销、过期及账号停用状态。\n\n过期或重复使用返回 401，响应使用 no-store 和 no-referrer。"
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
      responses:
        "303":
          description: "已建立使用原客户端账号与密钥权限的浏览器登录态。"
          headers:
            Location:
              description: "签发跳转码时指定的站内目标。"
              schema: {type: string}
            Set-Cookie:
              description: "签名 HttpOnly Cookie；HTTPS 请求同时设置 Secure。"
              schema: {type: string}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/auth/session:
    get:
      tags:
        - Auth & Accounts
      summary: "读取当前登录状态"
      operationId: getAuthSession
      security: []
      responses:
        "200":
          description: "未登录返回 authenticated: false；已登录返回当前身份摘要。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
  /api/auth/admin-key/health:
    get:
      tags:
        - Auth & Accounts
      summary: "检查是否配置管理员密钥"
      operationId: getAdminKeyHealth
      security: []
      responses:
        "200":
          description: "返回当前 Server 是否配置 STEAMHARNESS_SERVER_ADMIN_KEY。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyConfiguredResponse"
  /api/auth/admin-key/session:
    post:
      tags:
        - Auth & Accounts
      summary: "用管理员密钥建立恢复会话"
      description: "用于首次管理员恢复、没有账号时的恢复登录或权限恢复。已配置账号系统时，优先把当前管理密钥映射到 builtin_admin 浏览器会话。"
      operationId: createAdminKeySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKeySessionRequest"
      responses:
        "200":
          description: "登录成功并写入 HttpOnly Cookie。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/login:
    post:
      tags:
        - Auth & Accounts
      summary: "使用邮箱和密码登录"
      description: "普通用户与管理员共用此入口。仅账号表为空时，匹配初始化邮箱和密码才会创建 builtin_admin；之后按数据库中的当前密码和账号状态验证，不用环境值覆盖。\n\n显示名称沿用已保存资料。账号、密码哈希、会话和邀请保存在配置的 PostgreSQL 中；密码采用带随机盐的 scrypt，浏览器只保存签名刷新 token，数据库只保存 token 哈希。"
      operationId: createPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: "登录成功并写入 HttpOnly Cookie。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/logout:
    post:
      tags:
        - Auth & Accounts
      summary: "退出当前浏览器会话"
      operationId: logoutAuthSession
      security: []
      responses:
        "200":
          description: "无论当前是否有会话，都尝试清理 Cookie。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /api/auth/invitations/{token}:
    get:
      tags:
        - Auth & Accounts
      summary: 读取账号邀请信息
      description: "返回邀请邮箱、显示名称、24 小时有效期及可选接受时间，不暴露 token 哈希。重新生成邀请立即使旧链接失效。"
      operationId: getAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "返回设置初始密码所需的邀请信息。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Auth & Accounts
      summary: 接受账号邀请并设置初始密码
      description: "接受单次邀请、设置密码并撤销该账号已有的浏览器会话。"
      operationId: acceptAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAccountInvitationRequest"
      responses:
        "200":
          description: "激活账号并设置 30 天有效的 HttpOnly 会话 Cookie。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/start:
    post:
      tags:
        - Auth & Accounts
      summary: 创建设备登录请求
      description: "客户端先获取 device code、user code 和浏览器批准地址，再由已登录浏览器访问 /login/device 完成批准。"
      operationId: startDeviceFlow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowStartRequest"
      responses:
        "200":
          description: "返回设备码、用户验证码和轮询间隔。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/token:
    post:
      tags:
        - Auth & Accounts
      summary: "轮询设备授权并换取 API Key"
      description: "authorization_pending 时按 intervalSeconds 继续轮询。slow_down 时读取 Retry-After 或 data.retryAfterSeconds 退避；expired_token 表示设备码已过期或已消费。"
      operationId: pollDeviceFlowToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowTokenRequest"
      responses:
        "200":
          description: "批准成功后只返回一次明文 API Key 及账号信息。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowTokenResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "428":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/approve:
    post:
      tags:
        - Auth & Accounts
      summary: "在浏览器批准设备登录"
      operationId: approveDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: "批准成功后，轮询客户端可以换取 API Key。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/deny:
    post:
      tags:
        - Auth & Accounts
      summary: "拒绝设备登录"
      operationId: denyDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: "拒绝请求，轮询客户端收到 access_denied。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/me:
    get:
      tags:
        - Auth & Accounts
      summary: 读取当前账号资料
      operationId: getCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: "返回当前身份与资料，管理员密钥登录的 profile 为 null。Studio API Key 验证成功后，principal.expiresAt 包含滑动续期后的有效期。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
    patch:
      tags:
        - Auth & Accounts
      summary: 更新当前账号资料
      description: "显示名称同时更新认证账号与用户资料，后续登录和续期保留该名称。单独修改头像、邮箱或密码不会覆盖名称。"
      operationId: updateCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: "更新后的用户资料。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys:
    get:
      tags:
        - Auth & Accounts
      summary: "列出可管理的 API Key"
      operationId: listAccountApiKeys
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: "普通用户查看自己的密钥；系统管理员或具有 api_keys.manage_all 能力的身份可查看全部。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: "创建 API Key"
      operationId: createAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: "返回密钥记录和仅展示一次的明文 token。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys/{apiKeyId}:
    delete:
      tags:
        - Auth & Accounts
      summary: "撤销 API Key"
      operationId: revokeAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: 撤销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users:
    get:
      tags:
        - Auth & Accounts
      summary: "列出账号及权限摘要"
      operationId: listAccountUsers
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: "按邮箱、显示名称或角色搜索。"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - disabled
              - invited
          description: "按账号状态筛选。"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitations:
    post:
      tags:
        - Auth & Accounts
      summary: "邀请新用户"
      operationId: inviteAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: "默认返回用户资料及 Server 生成的完整邀请地址；兼容请求可能仍返回临时密码信息。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitation-link/{userId}:
    get:
      tags:
        - Auth & Accounts
      summary: "重新生成待接受的账号邀请"
      operationId: regenerateAccountInvitationLink
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: "返回有效期 24 小时的新邀请地址。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationLinkResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}:
    patch:
      tags:
        - Auth & Accounts
      summary: "更新用户邮箱、名称、密码或启停状态"
      operationId: updateAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: "更新后的用户资料。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects:
    get:
      tags:
        - Admin Projects
      summary: 列出项目
      operationId: listProjects
      responses:
        "200":
          description: "项目摘要列表。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryListResponse"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema: &a1
            type: string
        - name: groupId
          in: query
          required: false
          schema: *a1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - published
              - draft
        - name: minRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectRole"
      description: "先按登录账号权限筛选，再执行搜索与分页。groupId 为空字符串时查询个人项目；省略时查询所有可访问项目。公开项目对登录账号提供隐式访客权限。"
    post:
      tags:
        - Admin Projects
      summary: "创建由 Server 分配 UUID 的项目"
      description: "登录账号可创建个人项目，创建者成为所有者。groupId 指定归属组时需要该组开发者权限，创建者只保留原有继承角色。已有项目的开发者上传不会修改管理信息或归属。"
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: "@steamharness/hello-workflow"
              projectInfo:
                localizedNames: {}
                declarations: []
                platformSupport:
                  mode: agnostic
              visibility: private
              projectCard:
                icon: workflow
                iconColor: "#ffffff"
                iconBackgroundColor: "#2563eb"
              entries:
                - entryId: main
                  type: workflow
                  name: Main
                  root: .
                  entry: index.ts
                  databases: []
              defaultEntry: main
      responses:
        "201":
          description: "返回新项目 UUID、类型、完整声明和可见性。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/token-usage:
    get:
      tags:
        - Admin Projects
      summary: "读取系统 Token 用量"
      operationId: getSystemTokenUsage
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "返回项目总量汇总及分页的项目用量。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsagePageResponse"
        "501":
          description: "当前存储不支持此用量查询。"
  /api/audit-events:
    get:
      tags:
        - Admin Projects
      summary: "读取系统审计日志"
      operationId: listAuditEvents
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
          example: 2026-06-18T16:00:00.000Z::audit-1
        - name: from
          in: query
          description: "ISO 8601 开始时间，包含边界。"
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO 8601 结束时间，包含边界。
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
        - name: principalKind
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
