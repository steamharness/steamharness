        profiles:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              key:
                type: string
              name:
                type: string
              minimumRole:
                $ref: "#/components/schemas/ProjectRole"
              fixedValues:
                type: object
                additionalProperties: true
              description:
                type: string
              tags:
                type: array
                items:
                  type: string
            required:
              - key
              - name
              - minimumRole
              - fixedValues
      required:
        - version
        - defaultProfileKey
        - manageMinimumRole
        - profiles
    ConfigurationPublicationDraft:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        configurationRevision:
          type: integer
          minimum: 0
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        configurationAccountId:
          type: string
          readOnly: true
          description: Server-assigned source account for personal revision checks; client values do not grant authority.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigurationPublicationProfile"
        defaultConfigurationId:
          type: string
      required:
        - revision
        - configurationRevision
        - fields
        - configurations
        - defaultConfigurationId
    ProjectConfigurationTemplate:
      type: object
      description: Version 3 freezes role policies and is rejected by unsupported hosts. Immutable, filtered version
        data; defaultValue is omitted. Arrays are indivisible. Excluded names are represented only by opaque
        deny hashes. The authenticated download validates source and attachment hashes before caching outside
        project source.
      properties:
        version:
          type: integer
          enum:
            - 2
            - 3
        kind:
          type: string
          enum:
            - steamharness-configuration-template
        projectId:
          type: string
        projectVersion:
          type: string
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        draftRevision:
          type: integer
          minimum: 0
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigurationPublicationProfile"
        defaultConfigurationId:
          type: string
        reservedFields:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              path:
                type: string
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
            required:
              - id
              - path
              - sha256
      required:
        - version
        - kind
        - projectId
        - projectVersion
        - sourceHash
        - draftRevision
        - fields
        - configurations
        - defaultConfigurationId
    ProjectConfigurationCapability:
      type: object
      properties:
        editable:
          type: boolean
        reason:
          type: string
      required:
        - editable
    ProjectConfigurationField:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_.-]{0,199}$
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - json
            - file
        label:
          type: string
        description:
          type: string
        defaultValue:
          description: Native JSON default. Never store real secrets in source declarations.
        required:
          type: boolean
        secret:
          type: boolean
        multiple:
          type: boolean
          description: String arrays for string fields; up to 32 server file references for file fields.
        control:
          type: string
          enum:
            - text
            - textarea
            - select
            - radio
            - checkboxes
            - ai-models
          description: ai-models is reserved for the STEAMHARNESS_AGENT_MODELS JSON field. Entries contain id, name,
            model and source. System entries use credentialId; third-party entries use apiKind, baseUrl and
            apiKey. Values are private unless explicitly included in publication.
        allowThirdParty:
          type: boolean
          description: Only valid for ai-models. Set false in configuration.json to allow only system AI. Saves and
            imports cannot add third-party entries or relax the project's declared policy. Omitted or true
            allows both sources.
        accept:
          type: array
          description: File fields only. Accepted MIME types or extensions. Files upload through POST
            /api/projects/{projectId}/configurations/files and values contain server metadata, never file
            bytes.
          items:
            type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required:
              - value
        sharing:
          $ref: "#/components/schemas/ConfigurationSharingRule"
        paths:
          type: object
          description: JSON Pointer rules, inherited from the parent with more specific rules taking precedence.
            Excluding the whole field excludes every descendant.
          additionalProperties:
            $ref: "#/components/schemas/ConfigurationSharingRule"
        omittedPaths:
          description: Generated opaque deny hashes for omitted JSON paths, without private path names.
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
      required:
        - name
        - type
    ProjectConfigurationProfile:
      type: object
      properties:
        deletedPaths:
          description: Personal JSON deletion overlays; managed by the service and rechecked against each version's
            permissions.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        profileKey:
          type: string
        baseProfile:
          type: boolean
          readOnly: true
        templateId:
          type: string
        id:
          type: string
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - values
        - createdAt
        - updatedAt
    ProjectConfigurationState:
      type: object
      description: Role-filtered personal state. Guests receive only accessible base profiles and attachments.
      properties:
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
