            - file
        required:
          type: boolean
        label:
          type: string
        description:
          type: string
        defaultValue:
          type: string
        multiple:
          type: boolean
        control:
          type: string
          enum:
            - text
            - textarea
            - radio
            - select
            - checkboxes
            - date
            - time
            - datetime
            - date-range
          description: "表单控件提示。日期保持字符串：date 为 YYYY-MM-DD，time 为 HH:mm:ss，datetime 为本地 YYYY-MM-DDTHH:mm:ss，date-range 为闭区间 YYYY-MM-DD/YYYY-MM-DD；日期控件不用于 Quick。"
        panel:
          type: string
          enum:
            - main
            - auxiliary
            - quick
            - mode
        resolveOnInput:
          type: boolean
          description: "主输入变化是否触发操作或 Conversation resolver，默认 false。"
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              description:
                type: string
            required:
              - value
        accept:
          type: array
          items:
            type: string
        format:
          type: string
          enum:
            - json
      required:
        - name
        - type
      allOf:
        - if:
            properties:
              control:
                enum:
                  - date
                  - time
                  - datetime
                  - date-range
            required:
              - control
          then:
            properties:
              type:
                const: string
              panel:
                enum:
                  - main
                  - auxiliary
              multiple:
                const: false
            not:
              required:
                - options
