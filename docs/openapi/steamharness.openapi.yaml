              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 图片不存在。
  /storage/avatars/{userId}/{fileName}:
    get:
      tags:
        - Admin Account
