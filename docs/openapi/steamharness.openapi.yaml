          type: string
          format: uri
          description: |
            Optional legacy image URL retained for backward compatibility. Server Web and Studio
            render project avatars from icon, iconColor, and iconBackgroundColor instead.
        iconColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          description: Optional built-in icon foreground color. Defaults to white for older metadata.
        iconBackgroundColor:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      required:
