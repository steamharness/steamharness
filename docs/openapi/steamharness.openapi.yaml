      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
          example: 2026-06-18T16:00:00.000Z::audit-1
        - name: from
          in: query
          description: ISO 8601 起始时间，包含边界。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO 8601 结束时间，包含边界。
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
        - name: principalKind
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AuditOutcome"
      responses:
        "200":
          description: 审计事件分页，结构化上下文已脱敏。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPageResponse"
