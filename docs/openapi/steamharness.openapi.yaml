components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 使用 `STEAMHARNESS_SERVER_ADMIN_KEY` 或已创建的账号 API Key。
    SessionCookie:
      type: apiKey
      in: cookie
      name: steamharness_auth_session
      description: 通过密码登录或管理员密钥登录建立的 httpOnly 浏览器会话。
  parameters:
    ProjectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
      example: smoke
    TargetQuery:
      name: target
      in: query
      required: false
      schema:
        type: string
        default: draft
      example: latest
    KanbanConfigurationId:
      name: configurationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelatedProjectAlias:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,63}$
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
      example: api-key-001
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
