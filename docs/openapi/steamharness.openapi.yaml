          schema:
            type: string
            default: latest
      responses:
        "200":
          description: 可用于创建本地项目的源码文件列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadableSourceFilesResultResponse"
        "403":
          description: 当前身份没有项目源码下载权限。
        "409":
          description: 版本源码不可用。
  /project-card-images/{projectId}/{fileName}:
    get:
      tags:
        - Admin Projects
      summary: 读取公开项目卡片图片
      description: 读取按内容哈希保存的不可变 WebP；用于项目列表和 Desktop 展示。
      security: []
      operationId: getProjectCardImage
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.webp$
      responses:
        "200":
          description: 项目卡片 WebP 图片，响应可长期公开缓存。
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 图片不存在。
  /storage/avatars/{userId}/{fileName}:
    get:
