        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SourceFileInput"
              required:
                - files
            example:
