    ProjectCardMetadata:
      type: object
      properties:
        icon:
          type: string
          enum:
            - workflow
            - message-circle
            - bot
            - sparkles
            - code
            - git-branch
            - boxes
            - zap
            - database
            - file-text
            - cpu
            - brain
        iconUrl:
          type: string
          format: uri
