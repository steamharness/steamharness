      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/RelationalDatabaseGrant"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Relational Databases]
      summary: "授予或收窄数据库读写权限"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: databaseId
          in: path
