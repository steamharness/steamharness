        name:
          type: string
        prefix:
          type: string
        source:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
