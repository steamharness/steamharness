    post:
      tags:
        - Admin Workflows
      summary: 发布 workflow 版本
      description: 以 draft 的 package 版本发布不可变源码快照并更新 latest。重复版本返回 409，不安装、构建或加载项目代码。
      operationId: publishWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: 初始发布
                expectedVersion:
                  type: string
                  description: 可选的预期草稿版本；不匹配时返回 409，防止发布其他操作替换的草稿。
                  pattern: '^\d+\.\d+\.\d+$'
                expectedSourceHash:
                  type: string
                  description: 可选的上传处理结果 sourceHash；源码变化时返回 409，不创建版本。
                  pattern: '^[a-f0-9]{64}$'
