          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"userId": {"type": "string", "minLength": 1, "maxLength": 256}, "mode": {"type": "string", "enum": ["read", "write"]}}, "required": ["userId", "mode"]}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseGrant"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/grants/{userId}:
    delete:
      tags: [Relational Databases]
      summary: "撤销访问权并终止已签发连接"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: databaseId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
        - name: userId
          in: path
          required: true
          schema: {"type": "string"}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/migrations:
    get:
      tags: [Relational Databases]
      summary: "读取已应用的不可变迁移历史"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: databaseId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/DatabaseMigrationState"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/migrations/plan:
    post:
      tags: [Relational Databases]
      summary: "校验历史并根据当前模型生成迁移"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
