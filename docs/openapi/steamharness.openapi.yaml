  /api/projects/{projectId}/package:
    post:
      tags:
        - Admin Projects
      summary: 上传项目压缩包
      operationId: uploadProjectPackage
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: fileName
          in: query
