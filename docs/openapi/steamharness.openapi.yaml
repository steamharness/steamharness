                $ref: "#/components/schemas/DownloadableSourceFilesResultResponse"
        "403":
          description: "当前身份无权下载项目源码。"
        "409":
          description: "该发布版本的源码快照不可用。"
  /project-card-images/{projectId}/{fileName}:
    get:
      tags:
        - Admin Projects
      summary: 读取公开项目卡片图片
      description: "按内容哈希读取不可变 WebP，用于项目列表及 Studio 展示。"
