        - Admin Projects
      summary: 读取公开项目卡片图片
      description: 读取按内容哈希保存的不可变 WebP；用于项目列表和 Desktop 展示。
      security: []
      operationId: getProjectCardImage
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.webp$
      responses:
        "200":
          description: 项目卡片 WebP 图片，响应可长期公开缓存。
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: 图片不存在。
  /storage/avatars/{userId}/{fileName}:
    get:
      tags:
        - Admin Account
      summary: 读取本地对象存储中的公开头像
      description: 仅在 Server 以 STEAMHARNESS_STORAGE_DRIVER=local 运行时挂载。按内容哈希读取不可变头像； 该路由只服务头像，`storage/workflows/**` 始终不可达。
      security: []
