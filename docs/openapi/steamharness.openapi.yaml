    ProjectDependencyLock:
      type: object
      description: 由已确认关联项目生成的 Kanban 精确版本交付锁。
      properties:
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
        projectId:
          type: string
          format: uuid
        delivery:
          type: string
          enum:
            - included
            - external
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          description: included 依赖发布后固化的精确版本；external 不携带。
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: included 依赖发布后固化的源码哈希；external 不携带。
      required:
        - alias
        - projectId
        - delivery
