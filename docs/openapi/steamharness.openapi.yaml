openapi: 3.1.0
info:
  title: steamharness API
  version: 0.1.0
  description: SteamHarness Server 提供项目、不可变源码版本和项目数据存储。本地客户端负责执行项目。
servers:
  - url: http://localhost:7125
    description: Local SteamHarness Server (dev default)
  - url: http://localhost:7130
    description: Deployed SteamHarness Server (release default)
security:
  - BearerAuth: []
tags:
  - name: Health
    description: 健康检查。
  - name: Auth & Accounts
    description: 登录、会话、device flow、用户、角色与 API Key。
  - name: Admin Workflows
    description: 项目源码、版本与静态元数据管理。
  - name: Admin Files
    description: 项目文件上传、读取、下载与删除。
paths:
  /health:
    get:
      tags:
        - Health
      summary: 健康检查
      security: []
      parameters:
        - in: header
          name: X-Workflow-Locale
          required: false
          description: 返回内容语言。支持 `zh-CN` 和 `en`；未提供时保持 Server 既有英文默认。
          schema:
            type: string
            enum:
              - zh-CN
              - en
            default: en
        - in: query
          name: locale
          required: false
          description: WebSocket 或无法设置自定义请求头的调用方可使用的语言回退；`X-Workflow-Locale` 存在时以请求头为准。
          schema:
            type: string
            enum:
              - zh-CN
              - en
      responses:
        "200":
          description: Server 正常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 0
                  errMessage:
                    type: string
                    const: ""
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      runtime:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - development
                              - production
                            example: production
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-29T09:55:00Z
                        required:
                          - mode
                          - startedAt
                      versions:
                        type: object
                        properties:
                          serverVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.3
                          coreVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.1
                        required:
                          - serverVersion
                          - coreVersion
                      currentRelease:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              summary:
                                type: string
                              body:
                                type: string
                                description: 按请求语言返回的 Markdown 格式完整更新说明；旧 metadata 没有本地化字段时回退到
                                  `releaseNotes.body`。
                              docsUrl:
                                type: string
                                format: uri
                                description: 当前 Server 版本在同语言独立 Server 发布日志页面中的完整记录地址。
                                example: https://docs.steamharness.yuhe.space/en/guides/releases/server#server-v0-1-3
                            required:
                              - summary
                              - body
                              - docsUrl
                      deployment:
                        type: object
                        properties:
                          server:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                          serverWeb:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                        required:
                          - server
                          - serverWeb
                    required:
                      - status
                      - runtime
                      - versions
                      - currentRelease
                      - deployment
                required:
                  - errCode
                  - errMessage
                  - data
  /api/auth/session:
    get:
      tags:
        - Auth & Accounts
      summary: 读取当前浏览器或 Bearer 登录态
      operationId: getAuthSession
      security: []
      responses:
        "200":
          description: "未登录时返回 `authenticated: false`；已登录时带上 principal 摘要。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
  /api/auth/admin-key/health:
    get:
      tags:
        - Auth & Accounts
      summary: 检查管理员密钥是否已配置
      operationId: getAdminKeyHealth
      security: []
      responses:
        "200":
          description: 返回当前服务端是否配置了 `STEAMHARNESS_SERVER_ADMIN_KEY`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyConfiguredResponse"
  /api/auth/admin-key/session:
    post:
      tags:
        - Auth & Accounts
      summary: 通过管理员密钥建立恢复会话
      description: |
        用于首个管理员恢复、无账号时的恢复登录以及权限恢复。
        若同时配置了账号系统，服务端会优先尝试把当前管理员密钥映射为带 `builtin_admin` 的浏览器会话。
      operationId: createAdminKeySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKeySessionRequest"
      responses:
        "200":
          description: 登录成功并写入 httpOnly cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/login:
    post:
      tags:
        - Auth & Accounts
      summary: 通过邮箱密码建立账号会话
      description: |
        普通账号和管理员账号统一使用这一入口登录。
        如果请求中的邮箱和密码匹配 `STEAMHARNESS_BOOTSTRAP_ADMIN_EMAIL` / `STEAMHARNESS_BOOTSTRAP_ADMIN_PASSWORD`，
        服务端只会在账号表为空时创建该 `builtin_admin`；后续登录验证数据库中的当前密码，不会用环境变量覆盖改密或禁用状态。
        账号、密码哈希、会话与邀请都保存在 `STEAMHARNESS_DATABASE_URL` 指向的 PostgreSQL 中。
        密码使用 scrypt 加随机盐；浏览器 Cookie 只保存签名后的刷新 token，数据库只保存 token 哈希。
      operationId: createPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: 登录成功并写入 httpOnly cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/logout:
    post:
      tags:
        - Auth & Accounts
      summary: 清理当前浏览器会话
      operationId: logoutAuthSession
      security: []
      responses:
        "200":
          description: 无论当前是否存在会话，都会尝试清理 cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /api/auth/invitations/{token}:
    get:
      tags:
        - Auth & Accounts
      summary: 读取账号邀请信息
      description: 返回邀请邮箱、显示名称、24 小时有效期和可选接受时间，不返回数据库中的 token 哈希。管理员重新生成邀请后，旧链接立即失效。
      operationId: getAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回可用于设置初始密码的邀请信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Auth & Accounts
      summary: 接受账号邀请并设置初始密码
      description: 接受一次性邀请、设置密码并撤销该账号已有的浏览器会话。
      operationId: acceptAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAccountInvitationRequest"
      responses:
        "200":
          description: 接受邀请、激活账号并写入 30 天 httpOnly 会话 Cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/start:
    post:
      tags:
        - Auth & Accounts
      summary: 创建设备登录请求
      description: |
        CLI / Desktop / Web 先调用此接口获取 device code、user code 与浏览器批准地址，
        之后由已登录的浏览器会话访问 `/login/device` 批准。
      operationId: startDeviceFlow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowStartRequest"
      responses:
        "200":
          description: 返回本次 device flow 所需的设备码、验证码与轮询间隔。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/token:
    post:
      tags:
        - Auth & Accounts
      summary: 轮询 device flow 结果并换取 API Key
      description: |
        返回 `authorization_pending` 时继续按 `intervalSeconds` 轮询；
        返回 `slow_down` 时应读取 `Retry-After` 或 `data.retryAfterSeconds` 做退避；
        返回 `expired_token` 表示当前 device code 已过期或已被消费。
      operationId: pollDeviceFlowToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowTokenRequest"
      responses:
        "200":
          description: 批准成功后返回一次性明文 API Key 与账号信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowTokenResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "428":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/approve:
    post:
      tags:
        - Auth & Accounts
      summary: 在浏览器中批准一次 device 登录
      operationId: approveDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: 批准成功，轮询端随后可换取 API Key。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/deny:
    post:
      tags:
        - Auth & Accounts
      summary: 在浏览器中拒绝一次 device 登录
      operationId: denyDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: 请求被拒绝，轮询端会收到 `access_denied`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/me:
    get:
      tags:
        - Auth & Accounts
      summary: 读取当前账号资料
      operationId: getCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 返回当前 principal 以及用户资料；管理员密钥登录时 `profile` 为 `null`。Desktop API Key
            成功鉴权时，`principal.expiresAt` 返回滑动续期后的到期时间。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
    patch:
      tags:
        - Auth & Accounts
      summary: 更新当前账号资料
      operationId: updateCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 返回更新后的用户资料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys:
    get:
      tags:
        - Auth & Accounts
      summary: 列出当前可管理的 API Key
      operationId: listAccountApiKeys
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 普通用户默认查看自己的 API Key；管理员或带 `api_keys.manage_all` 的 principal 可查看全部。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: 创建新的 API Key
      operationId: createAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: 返回新的 API Key 记录和只显示一次的明文 token。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys/{apiKeyId}:
    delete:
      tags:
        - Auth & Accounts
      summary: 撤销一个 API Key
      operationId: revokeAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: 撤销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/permissions:
    get:
      tags:
        - Auth & Accounts
      summary: 列出权限分组与定义
      operationId: listAccountPermissionGroups
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 返回角色编辑器使用的权限注册表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroupListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/roles:
    get:
      tags:
        - Auth & Accounts
      summary: 列出所有全局角色
      operationId: listAccountRoles
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 内置角色和自定义角色统一返回。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: 创建自定义角色
      operationId: createAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: 创建成功并返回角色详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/roles/{roleId}:
    patch:
      tags:
        - Auth & Accounts
      summary: 更新角色名称、说明或权限
      operationId: updateAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: 返回更新后的角色。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Auth & Accounts
      summary: 删除一个自定义角色
      operationId: deleteAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: 删除成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users:
    get:
      tags:
        - Auth & Accounts
      summary: 列出账号和聚合权限摘要
      operationId: listAccountUsers
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: 按邮箱、显示名称或角色名称搜索。
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - disabled
              - invited
          description: 按 SteamHarness 账号状态筛选。
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitations:
    post:
      tags:
        - Auth & Accounts
      summary: 邀请一个新用户
      operationId: inviteAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: 默认返回用户资料和 Server 生成的 `/account/invite/:token` 完整邀请链接；兼容请求仍可返回临时密码信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitation-link/{userId}:
    get:
      tags:
        - Auth & Accounts
      summary: 为已有受邀用户重新生成邀请链接
      operationId: regenerateAccountInvitationLink
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 返回新的 24 小时邀请链接。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationLinkResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}:
    patch:
      tags:
        - Auth & Accounts
      summary: 更新用户邮箱、显示名称、临时密码或启停状态
      operationId: updateAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: 返回更新后的用户资料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}/roles:
    put:
      tags:
        - Auth & Accounts
      summary: 覆盖指定用户的角色集合
      operationId: replaceAccountUserRoles
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
