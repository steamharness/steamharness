        - defaultConfigurationId
    ProjectConfigurationTemplate:
      type: object
      description: "版本 3 固定角色策略，不支持的宿主应拒绝加载。返回不可变、已过滤的版本数据，不包含 defaultValue；数组作为整体。排除名称只保留不可读拒绝哈希。\n\n下载时验证源码和附件哈希，再缓存到项目源码之外。"
      properties:
        version:
          type: integer
          enum:
            - 2
            - 3
        kind:
          type: string
          enum:
            - steamharness-configuration-template
        projectId:
          type: string
        projectVersion:
          type: string
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        draftRevision:
          type: integer
          minimum: 0
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigurationPublicationProfile"
        defaultConfigurationId:
          type: string
        reservedFields:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              path:
                type: string
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
            required:
              - id
              - path
              - sha256
      required:
        - version
        - kind
        - projectId
        - projectVersion
        - sourceHash
        - draftRevision
        - fields
        - configurations
        - defaultConfigurationId
    ProjectConfigurationCapability:
      type: object
      properties:
        editable:
          type: boolean
        reason:
          type: string
      required:
        - editable
    ProjectConfigurationField:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_.-]{0,199}$
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - json
            - file
        label:
          type: string
        description:
          type: string
        defaultValue:
          description: "原生 JSON 默认值，源码中不得保存真实密钥。"
        required:
          type: boolean
        secret:
          type: boolean
        multiple:
          type: boolean
          description: "字符串字段为字符串数组；文件字段最多 32 个服务器文件引用。"
        control:
          type: string
          enum:
            - text
            - textarea
            - select
            - radio
            - checkboxes
            - ai-models
            - agent-model
          description: "ai-models 仅用于 STEAMHARNESS_AGENT_MODELS JSON 字段。条目含 id、name、model、source；系统条目用 credentialId，第三方条目用 apiKind、baseUrl、apiKey，除非显式发布否则值保持私有。\n\nagent-model 是无静态选项、非敏感的单字符串选择器；空值跟随主模型，非空值是模型列表中的稳定条目 ID。"
        allowThirdParty:
          type: boolean
          description: "仅用于 ai-models。configuration.json 中设 false 只允许系统 AI，保存和导入不能加入第三方或放宽策略；省略或 true 允许两种来源。"
        accept:
          type: array
          description: "仅用于文件字段，限定 MIME 类型或扩展名。通过配置文件接口上传后保存服务器元数据，不保存文件字节。"
          items:
            type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required:
              - value
        sharing:
          $ref: "#/components/schemas/ConfigurationSharingRule"
        paths:
          type: object
          description: "JSON Pointer 规则继承父路径，具体路径优先；排除整个字段会排除所有后代。"
          additionalProperties:
            $ref: "#/components/schemas/ConfigurationSharingRule"
        omittedPaths:
          description: "被省略 JSON 路径的不可读拒绝哈希，不包含私有路径名。"
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
      required:
        - name
        - type
    ProjectConfigurationProfile:
      type: object
      properties:
        deletedPaths:
          description: "个人 JSON 删除覆盖，由服务维护并按每个版本权限重新校验。"
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        profileKey:
          type: string
        baseProfile:
          type: boolean
          readOnly: true
        templateId:
          type: string
        id:
          type: string
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - values
        - createdAt
        - updatedAt
    ProjectConfigurationState:
      type: object
      description: "按角色过滤的个人状态；访客只收到可访问的基础配置与附件。"
      properties:
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
