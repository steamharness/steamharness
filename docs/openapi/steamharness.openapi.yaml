      description: |
        当前项目必须可管理。若调用方也能管理目标项目，`targetAlias` 必填，Server 在一个事务中更新双方；
        否则只保存当前项目声明并返回待确认。两个授权都表示“允许对方访问当前项目”，省略时使用
        `read: all`、`write: none`。
