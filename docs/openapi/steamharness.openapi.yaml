          description: Custom definitions temporarily hidden by same-name project declarations, retained for later
            restoration.
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        capabilities:
          type: object
          readOnly: true
          properties:
            manageConfigurations:
              type: boolean
            role:
              $ref: "#/components/schemas/ProjectRole"
            online:
              type: boolean
            subject:
              type: string
              description: Host-verified application account scope; not an authorization input.
            reason:
              type: string
        configurationCapabilities:
          type: object
          readOnly: true
          additionalProperties:
            type: object
            properties:
              use:
                type: boolean
              edit:
                type: boolean
              rename:
                type: boolean
              delete:
                type: boolean
              minimumRole:
                $ref: "#/components/schemas/ProjectRole"
              description:
                type: string
              tags:
                type: array
                items:
                  type: string
              reason:
                type: string
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectConfigurationProfile"
        activeConfigurationId:
          type: string
        template:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
        publicationPreview:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        canManagePublication:
          type: boolean
        sourceHash:
          type: string
          description: 当前所选源码的摘要；读取已发布版本不会要求草稿存在。 / Hash of the selected source; reading a published version does not
            require a draft.
        publicationRevision:
          type: integer
          description: 仅开发者及以上读取草稿时提供，用于发布并发校验。 / Provided to developers and above when reading the draft for
            publication concurrency checks.
        fieldCapabilities:
          type: object
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/ProjectConfigurationCapability"
              - type: object
                properties:
                  paths:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/ProjectConfigurationCapability"
        conflicts:
          type: array
          description: Preserved personal drafts whose field types changed on upgrade.
          items:
            type: object
            properties:
              configurationId:
                type: string
              key:
                type: string
              value: {}
              reason:
                type: string
        entryId: *a2
      required:
        - version
        - revision
        - fields
        - customFields
        - configurations
        - activeConfigurationId
    ProjectConfigurationExport:
      type: object
      properties:
        version:
          type: integer
          enum:
            - 1
        kind:
          type: string
          enum:
            - steamharness-project-configurations
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
