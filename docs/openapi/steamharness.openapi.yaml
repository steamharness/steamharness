  /api/projects/{projectId}/publish:
    post:
      tags:
        - Admin Projects
      summary: 发布项目版本
      description: "把准备完成的草稿发布为不可变快照并更新 latest。重复版本返回 409；不会安装、构建或加载项目代码。"
      operationId: publishProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: 初始发布
                expectedVersion:
                  type: string
                  description: "可选的预期草稿版本。不匹配返回 409，防止发布已被替换的草稿。"
                  pattern: ^\d+\.\d+\.\d+$
                expectedSourceHash:
                  type: string
                  description: "配置发布草稿要求提交准备时的源码哈希；源码变化返回 409，不创建版本。"
                  pattern: ^[a-f0-9]{64}$
                expectedConfigurationRevisions:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  example: { users: 0, board: 3 }
                  description: "按 entryId 提交发布草稿修订号，为非负 JSON 安全整数，初始值 0。每项及其引用的个人配置修订号必须仍匹配。"
      responses:
        "200":
          description: 发布结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/members:
