  /api/workflows:
    get:
      tags:
        - Admin Workflows
      summary: 列出 workflow
      operationId: listWorkflows
      responses:
        "200":
          description: workflow 摘要列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryListResponse"
    post:
      tags:
        - Admin Workflows
      summary: 使用指定 UUID 原子创建 server 项目
      description: |
        登录用户或管理员使用本地 `package.json.id` 中的 UUID 创建或恢复同 UUID server 项目。
        `workflowId`、`name`、`projectType` 和包含 `dataStorage.mode` 的完整 `projectInfo` 必填；
        `projectCard` 与 `visibility` 可选。Server 在一个请求中原子保存完整项目声明并把创建者记为
        owner，不先创建默认记录再二次同步，也不接收项目源码。已有且由同一账号管理的同 UUID、
        名称与类型请求会恢复绑定并刷新声明；其它冲突返回 `409`。

        An authenticated user or administrator creates or recovers a same-UUID server project from the
        UUID in local `package.json.id`. `workflowId`, `name`, `projectType`, and complete `projectInfo`
        containing `dataStorage.mode` are required. Server stores the complete declaration atomically;
        it does not create a default record first or accept project source.
      operationId: createWorkflowProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowProjectRequest"
            example:
              workflowId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
              name: "@steamharness/hello-workflow"
              projectType: workflow
              projectInfo:
                localizedNames: {}
                declarations: []
                platformSupport:
                  mode: agnostic
                dataStorage:
                  mode: both
              visibility: private
              projectCard:
                icon: workflow
                iconColor: "#ffffff"
                iconBackgroundColor: "#2563eb"
      responses:
        "201":
          description: 创建或恢复成功，返回指定 UUID、项目类型、完整声明和可见性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/project-storage:
    post:
      tags:
        - Admin Workflows
      summary: 访问当前项目或关联项目存储
      description: |
        `context.storage.server.kv` 与 `context.storage.server.persistentValue` 共用此 HTTP 入口，
        但通过 `storageKind` 写入强制隔离的存储域。scope 只允许 `project` 和 `conversation`。
        当前项目请求携带 `projectId`，且 `entry.projectId` 必须相同。关联项目请求只携带
        `consumerProjectId` 与 alias，`storageKind` 固定为 `kv`，不得在 entry 中指定目标 UUID；
        Server 从双方当前 `projectInfo` 解析目标并逐次检查授权。

        `get` 要求调用方可读取消费项目；`set`、`compare-and-set`、`delete` 要求消费项目的数据写权限。
        关联访问无需成为目标项目成员。`compare-and-set` 使用 get 返回的 revision；不匹配时
        返回 `{ applied: false }`。`delete` 删除一条已存在的条目并返回 `{ removed: boolean }`；
        条目不存在时返回 `{ removed: false }`，不是错误。`knowledge-mutation` 只允许当前项目的
        `persistent_value`，要求项目数据写权限，并在一个 PostgreSQL 事务中更新知识库索引与正文。
      operationId: accessProjectStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStorageRequest"
            examples:
              getCurrentProjectKV:
                summary: 读取当前项目 KV
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: kv
                  operation: get
                  entry:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    key: state
              setConversationPersistentValue:
                summary: 写入当前会话 PersistentValue
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: set
                  entry:
                    scope: conversation
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    conversationId: thread-1
                    key: memory
                  value:
                    saved: true
                  source:
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    runId: run-1
                    conversationId: thread-1
              compareAndSetRelatedKV:
                summary: 通过 alias 原子更新关联项目 KV
                value:
                  consumerProjectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  alias: inventory
                  storageKind: kv
                  operation: compare-and-set
                  entry:
                    scope: project
                    key: counter
                  expectedRevision: "42"
                  value: 2
              createKnowledgeDocument:
                summary: 事务性新建知识库文档
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: knowledge-mutation
                  namespace:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  mutation:
                    type: create
                    input:
                      id: runbook
                      title: Runbook
                      markdown: "# Runbook"
      responses:
        "200":
          description: "get 返回 `{ exists, value?, revision? }`；set 返回 `{ ok: true
            }`；compare-and-set 返回 `{ applied, revision? }`；knowledge-mutation
            返回文档或删除结果。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorageResponse"
        "400":
          description: 地址、storageKind、scope、projectId
            绑定、conversationId、key、value、expectedRevision 或 knowledge-mutation
            输入无效。
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          description: 调用者无权读取消费项目或写入其数据、关联授权不足，或项目声明不允许服务器存储。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "404":
          description: 关联项目不可用、待确认，或 knowledge-mutation 指定的编辑文档不存在。
        "409":
          description: knowledge-mutation 新建的文档 id 已存在。
        "501":
          description: server 未启用 PostgreSQL storage。
