        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                    required:
                      - data
  /api/projects/{projectId}/kanban:
    get:
      tags:
        - Admin Projects
      summary: 读取 Kanban 工作区
      description: |
        读取固定 target 的静态产物目录、HTML 入口、清单、当前用户隔离的命名配置和短期预览 capability。
        参数化项目第一次读取时会原子创建“默认配置”；无参数项目返回空配置列表。
      operationId: getKanbanWorkspace
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: Kanban 工作区和短期预览地址。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/bridge:
    post:
      tags:
        - Admin Projects
      summary: 调用 Kanban 项目数据 Bridge
      description: |
        当前项目可读用户可以执行读取操作，写入需要项目数据写权限。服务端先校验 target 对应 Kanban
        项目，再把当前项目操作固定到路径中的 projectName 和 project scope。关联项目操作
        只接受 alias 和 key，服务端按固定版本解析目标 UUID，并读取双方当前声明校验目标对
        Kanban 的授权。请求不能指定项目 UUID、scope、数据库路径或发布版本。
        files 操作使用路径固定项目的服务器文件存储，不要求已经上传预览产物，也不受版本 target 影响。
        files.createFile 输入为 name、可选 mimeType、base64，单文件不超过 50 MiB；readFile/deleteFile
        只接受 fileId，拒绝其它项目或带 conversation 作用域的文件。readFile 返回 file 与 base64。
        target=draft 的数据访问只需登记项目及项目信息，无需上传源码或配置模板；指定发布版本仍使用对应不可变声明。
      operationId: invokeKanbanBridge
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanStudioBridgeRequest"
      responses:
        "200":
          description: Bridge 操作结果；不存在的 KV 可以省略 data，不存在的知识文档返回 null。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBridgeResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "500":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/related-project-revisions:
    get:
      tags:
        - Admin Projects
      summary: 订阅 Server Web Kanban 关联项目 revision
      description: |
        以 Server-Sent Events 返回当前直接关联项目的完整 revision 快照和后续变化。Server 按
        请求 target 解析精确看板版本，并读取双方当前声明校验关系和 read 授权。授权撤销或
        关系失效时发送 `unavailable` 后关闭；revision 是不透明字符串，不包含目标项目 ID、
        KV key、scope 或数据库路径。
        draft 订阅使用登记项目的当前关联声明，无需上传源码；指定发布版本保留版本绑定。
      operationId: streamKanbanRelatedProjectRevisions
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: SSE 流；连接和重连先发送 snapshot，之后发送 revision 和 heartbeat。
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: snapshot
                data: {"resolvedTarget":"0.3.0","revisions":[{"alias":"stocks","revision":"42"}]}

                event: revision
                data: {"alias":"stocks","revision":"43"}

                event: heartbeat
                data: {"timestamp":"2026-08-04T02:00:00.000Z"}
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/previews/{capability}/{nonce}/{target}/{assetPath}:
    get:
      tags:
        - Admin Projects
      summary: 读取 capability 保护的 Kanban 静态资源
      description: >-
        使用工作区接口签发的短期 capability 读取固定版本资源。`assetPath` 可以表示

        配置的 HTML 入口或产物目录内的多段相对路径；目录穿越、符号链接、敏感文件和目录外文件均被拒绝。

        HTML 入口响应会注入带 nonce 的配置与项目数据 Bridge，并返回只允许产物同源资源、data 与 blob 的离线 CSP。

        capability 本身是限定项目、用户、固定目标与有效期的临时凭据，因此 sandbox iframe 加载 ES module、WASM

        和项目内数据文件时不需要登录 Cookie 或 API Key；其它项目 API 仍要求登录鉴权。


        预览凭据不替代账号权限；每次请求重新校验账号状态、当前成员关系及目标版本权限。 / Preview credentials never replace authorization; each request checks
        current account and membership state.
      security: []
      operationId: getKanbanPreviewAsset
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: capability
          in: path
          required: true
          schema:
            type: string
        - name: nonce
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML、CSS、JavaScript、图片、字体或其它允许的项目内静态资源。
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            text/html: {}
            text/css: {}
            application/javascript: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/template:
    get:
      tags: [ Admin Projects ]
      summary: Read an immutable published configuration template
      operationId: getProjectConfigurationTemplate
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: Version template with filtered fields, values, rules and attachment hashes. Requires project read or
            source-download permission. Missing templates return null data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectConfigurationTemplate"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files:
    post:
      tags: [ Admin Projects ]
      summary: Upload a personal configuration attachment after checking field permissions
      operationId: uploadProjectConfigurationFile
      description: Set target to the installed published version to check its field permissions. Omitting target uses the
        author's draft or the recipient's latest published template.
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: query
          name: key
          required: true
          schema: { type: string }
        - in: query
          name: fileName
          required: true
          schema: { type: string }
        - in: query
          name: mimeType
          required: true
          schema: { type: string }
        - in: query
          name: field
          description: Optional JSON descriptor for a local custom file field; never overrides an author field. At most 8192
            characters.
          schema: { type: string, maxLength: 8192 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: One server file reference. Uploads are account isolated and limited to 50 MiB; save the returned reference
            in a separate configuration mutation.
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files/{fileId}:
    get:
      tags: [ Admin Projects ]
      summary: Read an allowed personal or immutable version attachment
      operationId: readProjectConfigurationFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: path
          name: fileId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes. Source-download access grants only the template attachments; personal uploads are restricted to
            their uploading account.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations:
    get:
      tags: [ Admin Projects ]
      summary: Read account-scoped configurations for any project type
      description: Requires project read or source-download access and an account identity. Values are isolated by project and
        account. Download access only exposes the version template and permitted personal values. Official drafts
        require an actual maintainer, owner or system administrator. For v2 projects, non-managers use the latest published template
        for default or draft targets even with source-draft read access. Unpublished role-controlled configurations return
        a publication-required error. The Server never executes project code.
      operationId: getProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: Current fields, profiles, selection and revision. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [ Admin Projects ]
      summary: Manage or export account-scoped project configurations
      description: 个人配置可由任何访客使用，写入遵循已发布模板字段限制及 revision 校验；官方配置管理 publication.* 需要维护者或所有者。 / Guests may manage their own
        configurations subject to published field rules and revision checks. Official publication.* actions require
        maintainer or owner access. For v2 personal configurations, default or draft targets resolve to the latest
        published template for non-managers; role-controlled projects must be published first.
      operationId: manageProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  default: draft
                call:
                  $ref: "#/components/schemas/ProjectConfigurationAction"
              required: [ call ]
      responses:
        "200":
          description: Committed state, or portable export for the export action. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: Revision conflict; data.code is CONFIGURATION_CONFLICT and no mutation was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/projects/{projectId}/draft/files:
