          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {}}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseResource"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/grants:
    get:
      tags: [Relational Databases]
