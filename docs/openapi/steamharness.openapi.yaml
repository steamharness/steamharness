components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 使用 `STEAMHARNESS_SERVER_ADMIN_KEY` 或已创建的账号 API Key。
    SessionCookie:
      type: apiKey
      in: cookie
      name: steamharness_auth_session
      description: 通过密码登录或管理员密钥登录建立的 httpOnly 浏览器会话。
  parameters:
    ProjectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
      example: smoke
    TargetQuery:
      name: target
      in: query
      required: false
      schema:
        type: string
        default: draft
      example: latest
    KanbanConfigurationId:
      name: configurationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelatedProjectAlias:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,63}$
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
      example: api-key-001
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      example: user-001
  responses:
    HarnessError:
      description: steamharness 标准错误响应。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
  schemas:
    ApiSuccessBase:
      type: object
      properties:
        errCode:
          type: integer
          const: 0
        errMessage:
          type: string
          const: ""
      required:
        - errCode
        - errMessage
    ApiFailure:
      type: object
      properties:
        errCode:
          type: integer
        errMessage:
          type: string
        data: {}
      required:
        - errCode
        - errMessage
    PermissionKey:
      type: string
      enum:
        - system.admin
      description: 仅用于系统管理，不表示项目业务权限。 / System administration only.
    AuthPrincipalKind:
      type: string
      enum:
        - admin_key
        - admin_session
        - user_session
        - api_key
    UserProfileStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
    AuthPrincipal:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/AuthPrincipalKind"
        userId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        apiKeyId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: 当前 API Key 的到期时间；Desktop Key 成功鉴权时会滑动续期。
        isSystemAdmin:
          type: boolean
      required:
        - kind
        - isSystemAdmin
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        isSystemAdmin:
          type: boolean
      required:
        - userId
        - email
        - displayName
        - status
        - createdAt
        - updatedAt
        - isSystemAdmin
    ApiKeyRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        prefix:
          type: string
        source:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        lastUsedIp:
          type: string
        userAgent:
          type: string
      required:
        - id
        - userId
        - name
        - prefix
        - source
        - scopes
        - createdAt
    DeviceCodeResult:
      type: object
      properties:
        id:
          type: string
        userCode:
          type: string
        clientName:
          type: string
        source:
          type: string
        requestedScopes:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - denied
            - expired
            - consumed
        requestedByIp:
          type: string
        userAgent:
          type: string
        expiresAt:
          type: string
          format: date-time
        intervalSeconds:
          type: integer
        approvedAt:
          type: string
          format: date-time
        approvedByUserId:
          type: string
        deniedAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            apiKeyId:
              type: string
            user:
              $ref: "#/components/schemas/AuthUserInfo"
            expiresAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userCode
        - clientName
        - source
        - requestedScopes
        - state
        - expiresAt
        - intervalSeconds
        - createdAt
        - updatedAt
    AdminUserSummary:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        lastSignInAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        isSystemAdmin:
          type: boolean
      required:
        - userId
        - email
        - displayName
        - status
        - isSystemAdmin
    AuthUserInfo:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
      required:
        - userId
        - email
        - displayName
    AuthSessionState:
      type: object
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/AuthPrincipal"
        accessToken:
          type: string
          description: 非 Web 客户端请求 `source=desktop` 或 `source=cli` 时返回的 API Key 明文，仅返回一次。
        apiKey:
          $ref: "#/components/schemas/ApiKeyRecord"
        user:
          $ref: "#/components/schemas/AuthUserInfo"
        expiresAt:
          type: string
          format: date-time
      required:
        - authenticated
    AuthSessionStateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthSessionState"
          required:
            - data
    AdminKeyConfiguredResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                configured:
                  type: boolean
              required:
                - configured
          required:
            - data
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                loggedOut:
                  type: boolean
              required:
                - loggedOut
          required:
            - data
    MeResult:
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/AuthPrincipal"
        profile:
          anyOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"
      required:
        - profile
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MeResult"
          required:
            - data
    UserProfileResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                profile:
                  $ref: "#/components/schemas/UserProfile"
              required:
                - profile
          required:
            - data
    ApiKeyListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ApiKeyRecord"
              required:
                - items
          required:
            - data
    ApiKeyCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                apiKey:
                  $ref: "#/components/schemas/ApiKeyRecord"
                token:
                  type: string
              required:
                - apiKey
                - token
          required:
            - data
    ApiKeyRevokeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                revoked:
                  type: boolean
                id:
                  type: string
              required:
                - revoked
                - id
          required:
            - data
    UserListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AdminUserSummary"
              required:
                - items
          required:
            - data
    UserInvitationResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                profile:
                  $ref: "#/components/schemas/UserProfile"
                invitationLink:
                  type: string
                  format: uri
                temporaryPassword:
                  type: string
              required:
                - profile
          required:
            - data
    AccountInvitation:
      type: object
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
      required:
        - email
        - displayName
        - expiresAt
    AccountInvitationResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                invitation:
                  $ref: "#/components/schemas/AccountInvitation"
              required:
                - invitation
          required:
            - data
    AccountInvitationLinkResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                invitationLink:
                  type: string
                  format: uri
              required:
                - invitationLink
          required:
            - data
    DeviceFlowStartResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
