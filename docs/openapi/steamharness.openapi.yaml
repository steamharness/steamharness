            type: string
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                    required:
                      - data
  /api/projects/{projectId}/kanban:
    get:
      tags:
        - Admin Projects
      summary: 读取 Kanban 工作区
      description: "返回固定版本的静态目录、HTML 入口、清单、当前账号命名配置及短期预览凭据。有参数的项目首次读取时原子创建默认配置；无参数项目返回空列表。"
      operationId: getKanbanWorkspace
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: &a2
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,63}$
      responses:
        "200":
          description: "Kanban 工作区与短期预览地址。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/bridge:
    post:
      tags:
        - Admin Projects
      summary: "调用 Kanban 数据 Bridge"
      description: "entryId 指向已登记的 Kanban 入口。关系数据和附件要求 input.database 及当前项目、资源授权；target 选择静态声明版本，草稿数据访问可先于源码上传。\n\nServer 不执行项目。entries.*、conversations.* 等本地执行操作返回 409 和 ENTRY_RUNTIME_UNAVAILABLE，请使用 CLI Web 或 Studio。"
      operationId: invokeKanbanBridge
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanStudioBridgeRequest"
      responses:
        "200":
          description: "返回操作结果，无返回值时 data 可为空，不存在的知识文档返回 null。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBridgeResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "500":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/previews/{capability}/{nonce}/{target}/{assetPath}:
    get:
      tags:
        - Admin Projects
      summary: "读取受能力凭据保护的 Kanban 静态资源"
      description: "使用工作区接口签发的短期 capability 读取固定版本资源。`assetPath` 可以表示 配置的 HTML 入口或产物目录内的多段相对路径；目录穿越、符号链接、敏感文件和目录外文件均被拒绝。 HTML 入口响应会注入带 nonce 的配置与项目数据 Bridge，并返回只允许产物同源资源、data 与 blob 的离线 CSP。 capability 本身是限定项目、用户、固定目标与有效期的临时凭据，因此 sandbox iframe 加载 ES module、WASM 和项目内数据文件时不需要登录 Cookie 或 API Key；\n\n其它项目 API 仍要求登录鉴权。\n\n预览凭据不替代账号权限；每次请求重新校验账号状态、当前成员关系及目标版本权限。"
      security: []
      operationId: getKanbanPreviewAsset
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: capability
          in: path
          required: true
          schema:
            type: string
        - name: nonce
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "项目允许访问的 HTML、CSS、JavaScript、图片、字体或其他静态资源。"
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            text/html: {}
            text/css: {}
            application/javascript: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/template:
    get:
      tags:
        - Admin Projects
      summary: "读取不可变的发布配置模板"
      operationId: getProjectConfigurationTemplate
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: "返回过滤后的版本字段、值、规则和附件哈希，要求项目读取或源码下载权限。模板不存在时 data 为 null。"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectConfigurationTemplate"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files:
    post:
      tags:
        - Admin Projects
      summary: "按字段权限上传个人配置附件"
      operationId: uploadProjectConfigurationFile
      description: "target 指定安装的发布版本；省略时使用作者草稿或接收者的最新已发布模板。"
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: query
          name: key
          required: true
          schema:
            type: string
        - in: query
          name: fileName
          required: true
          schema:
            type: string
        - in: query
          name: mimeType
          required: true
          schema:
            type: string
        - in: query
          name: field
          description: "可选的自定义文件字段 JSON 描述，最多 8192 字符，不能覆盖作者字段。"
          schema:
            type: string
            maxLength: 8192
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "返回一个服务器文件引用。附件按账号隔离，最多 50 MiB；另行保存配置引用后生效。"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files/{fileId}:
    get:
      tags:
        - Admin Projects
      summary: "读取获准的个人或版本附件"
      operationId: readProjectConfigurationFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: path
          name: fileId
          required: true
          schema:
            type: string
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: "返回文件内容。源码下载权限只开放模板附件，个人上传文件仅允许上传账号读取。"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations:
    get:
      tags:
        - Admin Projects
      summary: "读取账号隔离的项目配置"
      description: "需要账号身份及项目读取或源码下载权限。值按项目、入口和账号隔离，下载权限只开放版本模板及允许的个人值。官方草稿要求维护者、所有者或系统管理员。\n\nv2 项目的非管理者默认读取最新已发布模板，即使能读取源码草稿也不开放未发布配置；未发布的角色配置会提示先发布。\n\n临时权限回退只改变返回视图，保留账号已保存的选择。权限恢复后继续使用原选择，保存回退配置的值也不覆盖它；显式 select 才更改选择。Server 不执行项目代码。"
      operationId: getProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: "当前字段、配置、选择与修订号；响应使用 no-store。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Admin Projects
      summary: "管理或导出项目配置"
      description: "个人配置可由任何访客使用，写入遵循已发布模板字段限制及 revision 校验；官方配置管理 publication.* 需要维护者或所有者。"
      operationId: manageProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  default: draft
                call:
                  $ref: "#/components/schemas/ProjectConfigurationAction"
                entryId: *a2
              required:
                - call
                - entryId
      responses:
        "200":
          description: "返回已提交状态，export 操作返回可导入的配置文件；响应使用 no-store。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: "修订冲突，data.code 为 CONFIGURATION_CONFLICT，未提交任何修改。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/projects/{projectId}/draft/files:
    put:
      tags:
        - Admin Projects
      summary: "保存源码草稿文件"
      operationId: saveDraftFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SourceFileInput"
                removePaths:
                  type: array
                  items:
                    type: string
              required:
                - files
      responses:
        "200":
          description: "静态文件保存结果。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveDraftFilesResultResponse"
  /api/projects/{projectId}/clone:
    post:
      tags:
        - Admin Projects
      summary: 克隆项目
      description: "仅有源码下载授权的账号只能克隆已发布版本；克隆 draft 还需要原项目的管理权限。新副本的所有权不授予原项目的配置发布权限。目标 ID 由 Server 分配，禁止指定 targetProjectName 或 projectId。"
      operationId: cloneProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  example: Smoke Copy
                sourceTarget:
                  type: string
                  example: latest
                groupId:
                  type:
                    - string
                    - "null"
              not:
                anyOf:
                  - required:
                      - targetProjectName
                  - required:
                      - projectId
      responses:
        "200":
