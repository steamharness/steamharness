    ProjectInfoContract:
      type: object
      description: |
        项目元数据权威模型。读取旧项目时 `dataStorage` 可能为 null，其它创建或保存请求必须使用
        `DeclaredWorkflowProjectInfo` 并提供有效 mode。当前界面识别 `zh-CN`、`en`、
        `multilingual`、`multiplatform`、`macos`、`windows` 和 `web`；符合格式的未来 locale 或 ID 原样保留。

        Authoritative project metadata model. Legacy read responses may carry null `dataStorage`;
        create and save requests use `DeclaredWorkflowProjectInfo` with an explicit valid mode.
      properties:
        localizedNames:
          type: object
          additionalProperties:
            type: string
        declarations:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
        platformSupport:
          $ref: "#/components/schemas/ProjectPlatformSupport"
        dataStorage:
          description: 严格限定项目可访问的数据位置；null 只表示尚未迁移的旧项目。 / Strictly limits accessible data
            locations; null represents an undeclared legacy project only.
          oneOf:
            - $ref: "#/components/schemas/ProjectDataStorage"
            - type: "null"
        relatedProjects:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RelatedProject"
      required:
        - localizedNames
        - declarations
        - platformSupport
        - dataStorage
        - relatedProjects
    ProjectDataStorage:
      type: object
      properties:
        mode:
          type: string
          enum:
            - local
            - server
            - both
          description: local 仅本地，server 仅服务器，both 允许显式选择两端。 / local permits local storage
            only, server permits server storage only, and both permits an
            explicit choice.
      required:
        - mode
      additionalProperties: false
