            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 成功 / Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceMemberPage"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/members/{userId}:
    put:
      tags:
        - Projects & Groups
      summary: 设置直接成员角色 / Set direct member role
      operationId: setprojectMember
      description: 有效角色取项目直接角色、所属组及全部祖先组角色的最高值。维护者只能管理有效角色低于维护者的用户，且只能授予访客或开发者；所有者可管理全部角色。删除直接成员不影响继承权限，最后一名活跃所有者不可删除或降级。 /
        Effective access is the maximum direct and inherited role. Maintainers manage only lower roles. Owners manage
        all roles; the last active owner is protected.
      parameters:
        - &a8
          name: projectId
          in: path
          required: true
          schema:
