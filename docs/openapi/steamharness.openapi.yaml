  /api/projects/{projectId}/files:
    get:
      tags:
        - Admin Projects
      summary: 读取项目源文件
      description: 仅有源码下载授权的账号只能读取已发布版本；读取 draft 还需要项目管理权限，避免暴露未发布的配置字段和默认值。
      operationId: getProjectFiles
