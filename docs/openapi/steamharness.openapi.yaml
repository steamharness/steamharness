  /api/projects/{projectId}/project-group-download:
    get:
      tags:
        - Admin Projects
      summary: 下载精确项目组源码
      description: |
        根项目和有权限的 included 依赖按 dependency lock 中的精确版本返回。无权限依赖会被列入
        `skippedDependencies`，不会回退到 latest；响应不包含任何 KV、PersistentValue、CLI 登录凭据
        或其它宿主数据。included 依赖按精确锁、源码权限和源码保留状态处理。
        客户端应按文件路径与原始字节重算 `sourceHash` 后再写盘。
        成功发送 GET 响应后，实际返回的每个项目精确版本各累加一次下载量；
        同一响应内去重，跳过的依赖不计数。HEAD、失败和中断响应不计数。
