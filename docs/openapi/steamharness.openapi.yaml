  /api/projects/{projectId}/source-share:
    get:
      tags:
        - Admin Projects
      summary: "读取分享版本的静态信息"
      description: "需要登录和项目源码下载权限。读取精确发布版本，不加载项目代码，也不计下载次数。分享链接采用 /share/projects/{projectId}/{version}，不携带凭据或额外授权。"
      operationId: getProjectSourceShare
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          required: true
          description: "精确发布版本，不接受 latest 或 draft。"
          schema:
            type: string
            pattern: ^\d+\.\d+\.\d+$
      responses:
        "200":
          description: "获授权的版本信息，响应使用 no-store。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceShareResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          description: "需要项目访问权限。data.requestUrl 返回短期同源申请链接，批准后成为访客。"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 403
                  errMessage:
                    type: string
                  data:
                    type: object
                    properties:
                      requestUrl:
                        type: string
                        format: uri
                    required:
                      - requestUrl
                required:
                  - errCode
                  - errMessage
                  - data
        "404":
          $ref: "#/components/responses/HarnessError"
