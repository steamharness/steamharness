    get:
      tags:
        - Admin Workflows
      summary: 列出项目成员
      operationId: listWorkflowProjectMembers
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: 当前项目的 owner/manager/writer/viewer 成员列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/workflows/{workflowName}/members/{userId}:
    put:
      tags:
        - Admin Workflows
      summary: 设置项目成员角色
      description: |
        owner 和 manager 可以授予 manager/writer/viewer；该接口不支持转移 owner。
        manager 也不能把其它成员提升为 owner。
      operationId: setWorkflowProjectMember
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/ProjectRole"
              required:
                - role
            example:
              role: writer
      responses:
        "200":
          description: 更新后的成员记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Admin Workflows
      summary: 删除项目成员
      operationId: deleteWorkflowProjectMember
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/workflows/{workflowName}/invitations:
    get:
      tags:
        - Admin Workflows
      summary: 列出项目邀请
      operationId: listWorkflowProjectInvitations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: 项目下全部邀请记录，包含 pending / accepted / revoked / expired。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationListResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Admin Workflows
      summary: 生成项目邀请链接
      description: |
        owner / manager 可生成单次有效、7 天过期的邀请 token。owner 角色不可通过邀请授予。
        API 仅返回 token；邀请人需要自行拼接 `${origin}/invite/${token}` 并把链接发给同事。
      operationId: createWorkflowProjectInvitation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/InvitationRole"
              required:
                - role
            example:
              role: viewer
      responses:
        "201":
          description: 创建成功，data 中包含邀请记录和服务端签发的 token。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/workflows/{workflowName}/invitations/{invitationId}:
    delete:
      tags:
        - Admin Workflows
      summary: 撤销未接受的邀请
      operationId: revokeWorkflowProjectInvitation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 撤销结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: 邀请已接受或已撤销，无法再撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/invitations/{token}:
    get:
      tags:
        - Admin Workflows
      summary: 查看邀请详情
      description: |
        接受邀请前必须先调用本接口查询 token 是否仍然有效。token 本身就是 bearer 凭据，接口不需要登录即可访问；
        未登录用户可以通过返回的 `project.name` 与 `invitation.role` 看到加入信息，再被引导到登录。
      operationId: lookupWorkflowProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 邀请与项目摘要。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationLookupResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/invitations/{token}/accept:
    post:
      tags:
        - Admin Workflows
      summary: 接受项目邀请
      description: |
        调用方必须是已登录用户。接受成功后该用户被加入到项目成员表中，对应角色由邀请决定。
        每个 token 只能被接受一次；接受后再次请求会返回 409。
      operationId: acceptWorkflowProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 接受成功，包含邀请记录与已写入的成员记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationAcceptResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          description: 邀请已过期或被撤销。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/workflows/{workflowName}/visibility:
    patch:
      tags:
        - Admin Workflows
      summary: 更新项目可见性
      operationId: updateWorkflowProjectVisibility
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  $ref: "#/components/schemas/Visibility"
              required:
                - visibility
            example:
              visibility: public
      responses:
        "200":
          description: 更新后的 workflow 摘要。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/workflows/{workflowName}/versions:
    get:
      tags:
        - Admin Workflows
      summary: 列出 workflow 版本
      operationId: listWorkflowVersions
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: 版本列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionSummaryResponse"
  /api/workflows/{workflowName}/data-summary:
    get:
      tags:
        - Admin Workflows
      summary: 汇总项目 KV 与知识库数据
      description: 要求登录、项目读取权限及允许访问服务器数据的存储声明。汇总完整项目数据，不返回条目值、文档正文或预览。
      operationId: getWorkflowProjectDataSummary
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: 项目 KV 和知识库的完整统计。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataSummaryResponse"
  /api/workflows/{workflowName}/kv:
    get:
      tags:
        - Admin Workflows
      summary: 列出项目 KV
      operationId: listWorkflowKVEntries
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: 项目详情页只支持 project / conversation，并且只查询 KV 存储域。
          schema:
            type: string
            enum:
              - all
              - project
              - conversation
            default: all
        - name: q
          in: query
          description: 按 key、conversation 或 last run 搜索。
          schema:
            type: string
        - name: valueType
          in: query
          schema:
            $ref: "#/components/schemas/KVEntryValueType"
        - name: conversationId
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 当前项目 project / conversation KV 分页。列表只返回
            `valuePreview`、类型和大小等摘要，不返回完整 `value`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryPageResponse"
  /api/workflows/{workflowName}/kv/entry:
    get:
      tags:
        - Admin Workflows
      summary: 读取单条项目 KV
      operationId: getWorkflowKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope 必填。
          schema:
            type: string
      responses:
        "200":
          description: 单条项目 KV 详情，包含完整 `value`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryDetailResponse"
        "404":
          description: KV 不存在。
    delete:
      tags:
        - Admin Workflows
      summary: 删除单条项目 KV
      description: |
        删除一条已存在的 KV 条目，按 `scope` + `key`（conversation scope 还需要 `conversationId`）
        精确定位。删除是永久的，不能恢复；数据本身不可恢复，这一步不提供回收站。
        删除会触发项目存储修订号，桌面端等订阅方据此丢弃已镜像的条目。
        需要项目可管理权限与 `kv.manage`；条目不存在时返回 404。
      operationId: deleteWorkflowKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope 必填。
          schema:
            type: string
      responses:
        "200":
          description: 已删除的条目身份。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - scope
                          - key
                        properties:
                          scope:
                            type: string
                            enum:
                              - project
                              - conversation
                          key:
                            type: string
                          conversationId:
                            type: string
        "404":
          description: KV 不存在。
  /api/workflows/{workflowName}/knowledge-documents:
    get:
      tags:
        - Admin Workflows
      summary: 列出项目知识库文档
      operationId: listKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          description: 每页文档摘要数量，默认 20，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor；这是不透明 token，只能原样回传。
          schema:
            type: string
      responses:
        "200":
          description: 当前 workflow 项目内 markdown 知识库文档分页摘要列表，不包含正文 markdown。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentPageResponse"
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
    post:
      tags:
        - Admin Workflows
      summary: 新建项目知识库文档
      operationId: createKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: response
          in: query
          description: 返回完整文档或轻量摘要；管理端大文档写入建议使用 summary，避免保存后回传完整 markdown。
          schema:
            type: string
            enum:
              - document
              - summary
            default: document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeDocumentInput"
      responses:
        "201":
          description: 已新建 markdown 文档。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentWriteResponse"
        "400":
          description: 文档 id、title 或 markdown 输入无效。
        "409":
          description: 文档 id 已存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
  /api/workflows/{workflowName}/knowledge-documents/search:
    get:
      tags:
        - Admin Workflows
      summary: 查找项目知识库文档
      operationId: searchKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: q
          in: query
          required: true
          description: 非空搜索关键词，按 markdown 行大小写不敏感匹配。
          schema:
            type: string
        - name: documentId
          in: query
          description: 传入后只查找单篇文档；省略时查找全部文档。
          schema:
            type: string
        - name: beforeLines
          in: query
          description: 每条匹配向上返回多少行上下文，范围 0 到 50。
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: afterLines
          in: query
          description: 每条匹配向下返回多少行上下文，范围 0 到 50。
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: maxMatches
          in: query
          description: 兼容旧客户端的本页大小参数；未传 pageSize 时生效，默认 200，最大 1000。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: pageSize
          in: query
          description: 本页最多返回多少条匹配；默认 200，最大 1000。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor；省略时读取第一页。
          schema:
            type: string
      responses:
        "200":
          description: 按行匹配结果，包含行号和上下文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResultResponse"
        "400":
          description: 搜索关键词或上下文行数无效。
        "404":
          description: 指定 documentId 不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
  /api/workflows/{workflowName}/knowledge-documents/{documentId}/lines:
    get:
      tags:
        - Admin Workflows
      summary: 读取项目知识库文档的指定行范围
      operationId: readKnowledgeDocumentLines
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: startLine
          in: query
          required: true
          description: 起始行号，1-based inclusive。
          schema:
            type: integer
            minimum: 1
        - name: endLine
          in: query
          required: true
          description: 结束行号，1-based inclusive。单次最多读取 1000 行。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 指定文档的行范围。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentLinesResponse"
        "400":
          description: 行号参数无效或超过单次范围限制。
        "404":
          description: 指定 documentId 不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
  /api/workflows/{workflowName}/knowledge-documents/{documentId}:
    get:
      tags:
        - Admin Workflows
      summary: 读取项目知识库文档
      operationId: getKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 单篇 markdown 文档。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
        "404":
          description: 文档不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
    put:
      tags:
        - Admin Workflows
      summary: 编辑项目知识库文档
      operationId: editKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: response
          in: query
          description: 返回完整文档或轻量摘要；管理端大文档保存建议使用 summary，避免保存后回传完整 markdown。
          schema:
            type: string
            enum:
              - document
              - summary
            default: document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditKnowledgeDocumentInput"
      responses:
        "200":
          description: 已保存文档。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentWriteResponse"
        "400":
          description: title 或 markdown 输入无效，或没有传入可编辑字段。
        "404":
          description: 文档不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
    delete:
      tags:
        - Admin Workflows
      summary: 删除项目知识库文档
      operationId: deleteKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已从知识库索引移除，并写入 tombstone 标记。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKnowledgeDocumentResultResponse"
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
  /api/workflows/{workflowName}/token-usage:
    get:
      tags:
        - Admin Workflows
      summary: 读取项目 token 用量
      operationId: getWorkflowTokenUsage
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: conversationId
          in: query
          schema:
            type: string
          description: 传入后同时返回该 conversation 聚合。
        - name: includeEntries
          in: query
          schema:
            type: boolean
          description: 和 conversationId 一起使用，返回 `tokenUsage.entry.*` 明细。
      responses:
        "200":
          description: 项目 token 用量详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsageDetailResponse"
        "501":
          description: 当前 storage 不支持 PostgreSQL KV inspection。
  /api/workflows/{workflowName}/source-share:
    get:
      tags:
        - Admin Workflows
      summary: 读取分享版本的静态元数据
      description: 需要登录和独立源码下载权限，包含项目级源码授权。只读取精确已发布版本，不加载项目代码、不计下载量。Web 分享地址为
        /share/projects/{projectId}/{version}，不携带凭据或授予权限。
      operationId: getProjectSourceShare
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          required: true
          description: 精确已发布版本，不接受 latest 或 draft。
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: 已授权的版本元数据，Cache-Control 为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceShareResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/workflows/{workflowName}/source-archive:
    get:
      tags:
        - Admin Workflows
      summary: 下载不可变源码归档
      description: 成功发送 GET 响应后为实际返回的精确版本累加一次下载量；latest 归入解析后的版本。HEAD、失败和中断响应不计数。
      operationId: downloadProjectSourceArchive
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: 精确已发布版本或 latest，不接受 draft。
          schema:
            type: string
            default: latest
      responses:
        "200":
          description: 已发布版本的源码 tar.gz 归档。
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 使用 `STEAMHARNESS_SERVER_ADMIN_KEY` 或已创建的账号 API Key。
    SessionCookie:
      type: apiKey
      in: cookie
      name: steamharness_auth_session
      description: 通过密码登录或管理员密钥登录建立的 httpOnly 浏览器会话。
  parameters:
    ProjectName:
      name: workflowName
      in: path
      required: true
      schema:
        type: string
      example: smoke
    TargetQuery:
