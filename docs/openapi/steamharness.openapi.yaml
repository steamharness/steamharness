    HealthDeploymentUnit:
      oneOf:
        - type: "null"
        - type: object
          properties:
            unit:
              type: string
              enum:
                - server
                - server-web
            tag:
              type: string
              example: server/v0.1.0
            version:
              type: string
              example: 0.1.0
            versionLabel:
              type: string
              example: v0.1.0
            publishedAt:
              type:
                - string
                - "null"
              format: date-time
              example: 2026-06-29T10:00:00Z
            commitSha:
              type:
                - string
                - "null"
              example: abcdef123456
            components:
              type: object
              additionalProperties:
                type: string
              description: 此发布内置的组件版本，例如 Server 内置 Core 版本。
            releaseNotes:
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    format:
                      type: string
                      const: markdown
                    body:
                      type: string
                      description: 按请求语言返回的 Markdown 发布说明；旧 metadata 回退到默认正文。
                  required:
                    - format
                    - body
            source:
              type: string
              enum:
                - release-metadata
                - package-manifest
          required:
            - unit
            - tag
            - version
            - versionLabel
            - publishedAt
            - commitSha
            - components
            - releaseNotes
            - source
