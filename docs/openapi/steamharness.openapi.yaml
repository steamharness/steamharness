  /api/projects/{projectId}/source-share:
    get:
      tags:
        - Admin Projects
      summary: 读取分享版本的静态元数据
      description: 需要登录和独立源码下载权限，包含项目级源码授权。只读取精确已发布版本，不加载项目代码、不计下载量。Web 分享地址为 /share/projects/{projectId}/{version}，不携带凭据或授予权限。
      operationId: getProjectSourceShare
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          required: true
          description: 精确已发布版本，不接受 latest 或 draft。
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: 已授权的版本元数据，Cache-Control 为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceShareResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
