        - $ref: "#/components/parameters/RelatedProjectAlias"
      responses:
        "200":
          description: 删除结果和当前项目剩余关系。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedProjectRemoveResponse"
  /project-card-images/{projectId}/{fileName}:
