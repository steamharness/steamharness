        - configurations
    ProjectConfigurationAction:
      type: object
      description: "请求最多 1 MiB，每次修改必须带 revision。配置操作需 id，create 可带 name；save 合并类型化值并移除 unset 指定的覆盖。字段编辑使用 field 和可选旧 key。\n\n`import` 接收完整文档，`export` 可按 id 筛选且始终应用当前角色。固定值和基础配置名称不可修改，无权执行的批次整体拒绝。"
      properties:
        action:
          type: string
          enum:
            - get
            - export
            - create
            - duplicate
            - rename
            - save
            - select
            - delete
            - field.save
            - field.delete
            - import
            - publication.save
            - publication.preview
        revision:
          type: integer
          minimum: 0
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        profileKey:
          type: string
          description: "新建个人配置继承的基础策略。"
        values:
          type: object
          additionalProperties: true
        unset:
          type: array
          items:
            type: string
        field:
          $ref: "#/components/schemas/ProjectConfigurationField"
        key:
          type: string
        document:
          $ref: "#/components/schemas/ProjectConfigurationExport"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
      required:
        - action
    ProjectConfigurationResponse:
      allOf:
