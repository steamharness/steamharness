        runId:
          type: string
        conversationId:
          type: string
    ProjectStorageRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: 当前项目访问使用的项目 UUID；与 consumerProjectId/alias 互斥。
        consumerProjectId:
          type: string
          format: uuid
          description: 关联项目访问的消费项目 UUID；必须与 alias 一起提供。
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          description: 消费项目声明中的关联项目 alias；Server 据此解析目标 UUID。
        storageKind:
          type: string
          enum:
            - kv
            - persistent_value
        operation:
          type: string
          enum:
            - get
            - set
            - compare-and-set
            - delete
            - knowledge-mutation
        entry:
          $ref: "#/components/schemas/ProjectStorageEntry"
        value:
          description: set 和 compare-and-set 操作必填；必须是 JSON value 且不能省略。
        expectedRevision:
          type:
            - string
            - "null"
          description: compare-and-set 操作必填。传入 get 返回的 revision；首次创建没有值时传 null。
        source:
          $ref: "#/components/schemas/ProjectStorageSource"
        namespace:
          $ref: "#/components/schemas/ProjectStorageKnowledgeNamespace"
        mutation:
          $ref: "#/components/schemas/ProjectStorageKnowledgeMutation"
      required:
        - storageKind
        - operation
      oneOf:
        - required:
            - projectId
          not:
