            type: string
            pattern: ^[a-f0-9]{64}\.(png|jpe?g|gif|webp)$
      responses:
        "200":
          description: 头像图片，响应可长期公开缓存。
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: 头像不存在。
  /api/projects/files/{fileId}:
    get:
