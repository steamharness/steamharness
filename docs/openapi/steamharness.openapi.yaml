openapi: 3.1.0
info:
  title: steamharness API
  version: 0.1.0
  description: SteamHarness Server 提供项目、不可变源码版本和项目数据存储。本地客户端负责执行项目。
servers:
  - url: http://localhost:7126
    description: Local SteamHarness Server (dev default)
  - url: http://localhost:7130
    description: Deployed SteamHarness Server (release default)
security:
  - BearerAuth: []
tags:
  - name: Health
    description: 健康检查。
  - name: Auth & Accounts
    description: 登录、账号状态、系统管理员、会话与 API Key。
  - name: Admin Projects
    description: 项目源码、版本与静态元数据管理。
  - name: Admin Files
    description: 项目文件上传、读取、下载与删除。
  - name: Projects & Groups
    description: 固定角色、多级组继承、成员、邀请和归属管理。 / Fixed roles, hierarchy and membership.
paths:
  /health:
    get:
      tags:
        - Health
      summary: 健康检查
      security: []
      parameters:
        - in: header
          name: X-SteamHarness-Locale
          required: false
          description: 返回内容语言。支持 `zh-CN` 和 `en`；未提供时保持 Server 既有英文默认。
          schema:
            type: string
            enum:
              - zh-CN
              - en
            default: en
        - in: query
          name: locale
          required: false
          description: WebSocket 或无法设置自定义请求头的调用方可使用的语言回退；`X-SteamHarness-Locale` 存在时以请求头为准。
          schema:
            type: string
            enum:
              - zh-CN
              - en
      responses:
        "200":
          description: Server 正常。
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 0
                  errMessage:
                    type: string
                    const: ""
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      runtime:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - development
                              - production
                            example: production
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-29T09:55:00Z
                        required:
                          - mode
                          - startedAt
                      versions:
                        type: object
                        properties:
                          serverVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.3
                          coreVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.1
                        required:
                          - serverVersion
                          - coreVersion
                      currentRelease:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              summary:
                                type: string
                              body:
                                type: string
                                description: 按请求语言返回的 Markdown 格式完整更新说明；旧 metadata 没有本地化字段时回退到 `releaseNotes.body`。
                              docsUrl:
                                type: string
                                format: uri
                                description: 当前版本或部署的同语言完整更新记录地址。部署可提供当前环境内的相对日志路径。 / Localized version or deployment notes in the current environment.
                                example: https://docs.steamharness.yuhe.space/en/guides/releases/server/v0.1.3
                            required:
                              - summary
                              - body
                              - docsUrl
                      deployment:
                        type: object
                        properties:
                          server:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                          serverWeb:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                        required:
                          - server
                          - serverWeb
                    required:
                      - status
                      - runtime
                      - versions
                      - currentRelease
                      - deployment
                required:
                  - errCode
                  - errMessage
                  - data
  /api/auth/session:
    get:
      tags:
        - Auth & Accounts
      summary: 读取当前浏览器或 Bearer 登录态
      operationId: getAuthSession
      security: []
      responses:
        "200":
          description: "未登录时返回 `authenticated: false`；已登录时带上 principal 摘要。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
  /api/auth/admin-key/health:
    get:
      tags:
        - Auth & Accounts
      summary: 检查管理员密钥是否已配置
      operationId: getAdminKeyHealth
      security: []
      responses:
        "200":
          description: 返回当前服务端是否配置了 `STEAMHARNESS_SERVER_ADMIN_KEY`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyConfiguredResponse"
  /api/auth/admin-key/session:
    post:
      tags:
        - Auth & Accounts
      summary: 通过管理员密钥建立恢复会话
      description: |
        用于首个管理员恢复、无账号时的恢复登录以及权限恢复。
        若同时配置了账号系统，服务端会优先尝试把当前管理员密钥映射为带 `builtin_admin` 的浏览器会话。
      operationId: createAdminKeySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKeySessionRequest"
      responses:
        "200":
          description: 登录成功并写入 httpOnly cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/login:
    post:
      tags:
        - Auth & Accounts
      summary: 通过邮箱密码建立账号会话
      description: |
        普通账号和管理员账号统一使用这一入口登录。
        如果请求中的邮箱和密码匹配 `STEAMHARNESS_BOOTSTRAP_ADMIN_EMAIL` / `STEAMHARNESS_BOOTSTRAP_ADMIN_PASSWORD`，
        服务端只会在账号表为空时创建该 `builtin_admin`；后续登录验证数据库中的当前密码，不会用环境变量覆盖改密或禁用状态。
        显示名称以数据库中保存的用户资料为准；登录不会用初始化默认名称或旧认证名称覆盖修改后的名称。
        账号、密码哈希、会话与邀请都保存在 `STEAMHARNESS_DATABASE_URL` 指向的 PostgreSQL 中。
        密码使用 scrypt 加随机盐；浏览器 Cookie 只保存签名后的刷新 token，数据库只保存 token 哈希。
      operationId: createPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: 登录成功并写入 httpOnly cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/logout:
    post:
      tags:
        - Auth & Accounts
      summary: 清理当前浏览器会话
      operationId: logoutAuthSession
      security: []
      responses:
        "200":
          description: 无论当前是否存在会话，都会尝试清理 cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /api/auth/invitations/{token}:
    get:
      tags:
        - Auth & Accounts
      summary: 读取账号邀请信息
      description: 返回邀请邮箱、显示名称、24 小时有效期和可选接受时间，不返回数据库中的 token 哈希。管理员重新生成邀请后，旧链接立即失效。
      operationId: getAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回可用于设置初始密码的邀请信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Auth & Accounts
      summary: 接受账号邀请并设置初始密码
      description: 接受一次性邀请、设置密码并撤销该账号已有的浏览器会话。
      operationId: acceptAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAccountInvitationRequest"
      responses:
        "200":
          description: 接受邀请、激活账号并写入 30 天 httpOnly 会话 Cookie。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/start:
    post:
      tags:
        - Auth & Accounts
      summary: 创建设备登录请求
      description: |
        CLI / Desktop / Web 先调用此接口获取 device code、user code 与浏览器批准地址，
        之后由已登录的浏览器会话访问 `/login/device` 批准。
      operationId: startDeviceFlow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowStartRequest"
      responses:
        "200":
          description: 返回本次 device flow 所需的设备码、验证码与轮询间隔。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/token:
    post:
      tags:
        - Auth & Accounts
      summary: 轮询 device flow 结果并换取 API Key
      description: |
        返回 `authorization_pending` 时继续按 `intervalSeconds` 轮询；
        返回 `slow_down` 时应读取 `Retry-After` 或 `data.retryAfterSeconds` 做退避；
        返回 `expired_token` 表示当前 device code 已过期或已被消费。
      operationId: pollDeviceFlowToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowTokenRequest"
      responses:
        "200":
          description: 批准成功后返回一次性明文 API Key 与账号信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowTokenResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "428":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/approve:
    post:
      tags:
        - Auth & Accounts
      summary: 在浏览器中批准一次 device 登录
      operationId: approveDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: 批准成功，轮询端随后可换取 API Key。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/deny:
    post:
      tags:
        - Auth & Accounts
      summary: 在浏览器中拒绝一次 device 登录
      operationId: denyDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: 请求被拒绝，轮询端会收到 `access_denied`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/me:
    get:
      tags:
        - Auth & Accounts
      summary: 读取当前账号资料
      operationId: getCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 返回当前 principal 以及用户资料；管理员密钥登录时 `profile` 为 `null`。Desktop API Key 成功鉴权时，`principal.expiresAt` 返回滑动续期后的到期时间。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
    patch:
      tags:
        - Auth & Accounts
      summary: 更新当前账号资料
      description: 显示名称修改同时保存到认证账号和用户资料，重新登录或会话续期后保留；仅修改头像、邮箱或密码不会恢复旧名称。
      operationId: updateCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 返回更新后的用户资料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys:
    get:
      tags:
        - Auth & Accounts
      summary: 列出当前可管理的 API Key
      operationId: listAccountApiKeys
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: 普通用户默认查看自己的 API Key；管理员或带 `api_keys.manage_all` 的 principal 可查看全部。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: 创建新的 API Key
      operationId: createAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: 返回新的 API Key 记录和只显示一次的明文 token。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys/{apiKeyId}:
    delete:
      tags:
        - Auth & Accounts
      summary: 撤销一个 API Key
      operationId: revokeAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: 撤销成功。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users:
    get:
      tags:
        - Auth & Accounts
      summary: 列出账号和聚合权限摘要
      operationId: listAccountUsers
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: 按邮箱、显示名称或角色名称搜索。
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - disabled
              - invited
          description: 按 SteamHarness 账号状态筛选。
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitations:
    post:
      tags:
        - Auth & Accounts
      summary: 邀请一个新用户
      operationId: inviteAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: 默认返回用户资料和 Server 生成的 `/account/invite/:token` 完整邀请链接；兼容请求仍可返回临时密码信息。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitation-link/{userId}:
    get:
      tags:
        - Auth & Accounts
      summary: 为已有受邀用户重新生成邀请链接
      operationId: regenerateAccountInvitationLink
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 返回新的 24 小时邀请链接。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationLinkResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}:
    patch:
      tags:
        - Auth & Accounts
      summary: 更新用户邮箱、显示名称、临时密码或启停状态
      operationId: updateAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: 返回更新后的用户资料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects:
    get:
      tags:
        - Admin Projects
      summary: 列出项目
      operationId: listProjects
      responses:
        "200":
          description: 项目摘要列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryListResponse"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema: &a4
            type: string
        - name: groupId
          in: query
          required: false
          schema: *a4
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - published
              - draft
        - name: minRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectRole"
      description: 先按登录账号权限筛选，再执行搜索与分页。groupId 为空字符串时查询个人项目；省略时查询所有可访问项目。公开项目对登录账号提供隐式访客权限。 / Authorization precedes
        pagination. Public projects grant signed-in users implicit guest access.
    post:
      tags:
        - Admin Projects
      summary: 使用指定 UUID 原子创建 server 项目
      description: 登录账号可创建个人项目，创建者成为所有者。groupId 指定归属组时需要该组开发者权限，创建者只保留原有继承角色。已有项目的开发者上传不会修改管理信息或归属。 / Signed-in users may
        create personal projects as owners. Group projects require developer access and do not promote the creator.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
              name: "@steamharness/hello-workflow"
              projectType: workflow
              projectInfo:
                localizedNames: {}
                declarations: []
                platformSupport:
                  mode: agnostic
                dataStorage:
                  mode: both
              visibility: private
              projectCard:
                icon: workflow
                iconColor: "#ffffff"
                iconBackgroundColor: "#2563eb"
      responses:
        "201":
          description: 创建或恢复成功，返回指定 UUID、项目类型、完整声明和可见性。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/project-storage:
    post:
      tags:
        - Admin Projects
      summary: 访问当前项目或关联项目存储
      description: |
        `context.storage.server.kv` 与 `context.storage.server.persistentValue` 共用此 HTTP 入口，
        但通过 `storageKind` 写入强制隔离的存储域。scope 只允许 `project` 和 `conversation`。
        当前项目请求携带 `projectId`，且 `entry.projectId` 必须相同。关联项目请求只携带
        `consumerProjectId` 与 alias，`storageKind` 固定为 `kv`，不得在 entry 中指定目标 UUID；
        Server 从双方当前 `projectInfo` 解析目标并逐次检查授权。

        `get` 要求调用方可读取消费项目；`set`、`compare-and-set`、`delete` 要求消费项目的数据写权限。
        关联访问无需成为目标项目成员。`compare-and-set` 使用 get 返回的 revision；不匹配时
        返回 `{ applied: false }`。`delete` 删除一条已存在的条目并返回 `{ removed: boolean }`；
        条目不存在时返回 `{ removed: false }`，不是错误。`knowledge-mutation` 只允许当前项目的
        `persistent_value`，要求项目数据写权限，并在一个 PostgreSQL 事务中更新知识库索引与正文。
      operationId: accessProjectStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStorageRequest"
            examples:
              getCurrentProjectKV:
                summary: 读取当前项目 KV
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: kv
                  operation: get
                  entry:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    key: state
              setConversationPersistentValue:
                summary: 写入当前会话 PersistentValue
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: set
                  entry:
                    scope: conversation
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    conversationId: thread-1
                    key: memory
                  value:
                    saved: true
                  source:
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    runId: run-1
                    conversationId: thread-1
              compareAndSetRelatedKV:
                summary: 通过 alias 原子更新关联项目 KV
                value:
                  consumerProjectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  alias: inventory
                  storageKind: kv
                  operation: compare-and-set
                  entry:
                    scope: project
                    key: counter
                  expectedRevision: "42"
                  value: 2
              createKnowledgeDocument:
                summary: 事务性新建知识库文档
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: knowledge-mutation
                  namespace:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  mutation:
                    type: create
                    input:
                      id: runbook
                      title: Runbook
                      markdown: "# Runbook"
      responses:
        "200":
          description: "get 返回 `{ exists, value?, revision? }`；set 返回 `{ ok: true }`；compare-and-set 返回 `{ applied, revision?
            }`；knowledge-mutation 返回文档或删除结果。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorageResponse"
        "400":
          description: 地址、storageKind、scope、projectId 绑定、conversationId、key、value、expectedRevision 或 knowledge-mutation 输入无效。
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          description: 调用者无权读取消费项目或写入其数据、关联授权不足，或项目声明不允许服务器存储。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "404":
          description: 关联项目不可用、待确认，或 knowledge-mutation 指定的编辑文档不存在。
        "409":
          description: knowledge-mutation 新建的文档 id 已存在。
        "501":
          description: server 未启用 PostgreSQL storage。
