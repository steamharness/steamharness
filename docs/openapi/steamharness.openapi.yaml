          type: string
        resolvedTarget:
          type: string
      required:
        - projectId
        - projectName
        - target
        - resolvedTarget
    UpdateProjectDisplayInfoResultResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UpdateProjectDisplayInfoResult"
          required:
            - data
    DeleteProjectResultResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                projectId:
                  type: string
              required:
                - projectId
          required:
            - data
    ParamDefinition:
      type: object
      properties:
        name:
          type: string
        flag:
          type: string
        shortFlag:
          type: string
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - positional
            - file
        required:
          type: boolean
        label:
          type: string
        description:
          type: string
        defaultValue:
          type: string
        multiple:
          type: boolean
        control:
          type: string
          enum:
            - text
            - textarea
            - radio
            - select
            - checkboxes
            - date
            - time
            - datetime
            - date-range
          description: |
            Shared form control hint. Date-related controls keep string values:
            date uses YYYY-MM-DD, time uses HH:mm:ss, datetime uses local
            YYYY-MM-DDTHH:mm:ss, and date-range uses inclusive
            YYYY-MM-DD/YYYY-MM-DD. Date controls do not support panel=quick.
        panel:
          type: string
          enum:
            - main
            - auxiliary
            - quick
            - mode
        resolveOnInput:
          type: boolean
          description: Whether main composer input changes trigger the selected entrypoint resolver (or the Conversation executor
            resolver). Defaults to false.
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              description:
                type: string
            required:
              - value
        accept:
          type: array
          items:
            type: string
        format:
          type: string
          enum:
            - json
      required:
        - name
        - type
      allOf:
        - if:
            properties:
              control:
                enum:
                  - date
                  - time
                  - datetime
                  - date-range
            required:
              - control
          then:
            properties:
              type:
                const: string
              panel:
                enum:
                  - main
                  - auxiliary
              multiple:
                const: false
            not:
              required:
                - options
    KanbanManifest:
      type: object
      properties:
        version:
          type: integer
          const: 1
        params:
          type: array
          items:
            $ref: "#/components/schemas/ParamDefinition"
      required:
        - version
        - params
    ConfigurationSharingRule:
      type: object
      additionalProperties: false
      properties:
        publish: { type: boolean, default: true }
        includeValue: { type: boolean, default: false }
        editable: { type: boolean, default: true }
    ConfigurationPublicationProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        profileKey: { type: string, description: Stable source-declared role profile. }
        values: { type: object, additionalProperties: true }
      required: [ id, name, values ]
    AgentModelPolicy:
      type: object
      additionalProperties: false
      description: Source-declared restriction retained independently of published field visibility. Draft and template metadata cannot relax the current source restriction.
      properties:
        allowThirdParty: { type: boolean }
    ConfigurationProfilePolicy:
      type: object
      description: Source-owned role policy. Client labels, role claims and personal metadata never grant authority. Projects without this policy keep their existing behavior.
      properties:
        version: { type: integer, enum: [ 1 ] }
        defaultProfileKey: { type: string, description: Must identify a guest profile. }
        manageMinimumRole: { $ref: "#/components/schemas/ProjectRole" }
        profiles:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
              minimumRole: { $ref: "#/components/schemas/ProjectRole" }
              fixedValues: { type: object, additionalProperties: true }
              description: { type: string }
              tags: { type: array, items: { type: string } }
            required: [ key, name, minimumRole, fixedValues ]
      required: [ version, defaultProfileKey, manageMinimumRole, profiles ]
    ConfigurationPublicationDraft:
      type: object
      properties:
        revision: { type: integer, minimum: 0 }
        configurationRevision: { type: integer, minimum: 0 }
        profilePolicy: { $ref: "#/components/schemas/ConfigurationProfilePolicy" }
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        configurationAccountId:
          {
            type: string,
            readOnly: true,
            description: Server-assigned source account for personal revision checks; client values do not grant authority.
          }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ProjectConfigurationField" }
        configurations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ConfigurationPublicationProfile" }
        defaultConfigurationId: { type: string }
      required: [ revision, configurationRevision, fields, configurations, defaultConfigurationId ]
    ProjectConfigurationTemplate:
      type: object
      description: Version 3 freezes role policies and is rejected by unsupported hosts. Immutable, filtered version data; defaultValue is omitted. Arrays are indivisible. Excluded names are
        represented only by opaque deny hashes. The authenticated download validates source and attachment hashes before
        caching outside project source.
      properties:
        version: { type: integer, enum: [ 2, 3 ] }
        kind: { type: string, enum: [ steamharness-configuration-template ] }
        projectId: { type: string }
        projectVersion: { type: string }
        sourceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        draftRevision: { type: integer, minimum: 0 }
        profilePolicy: { $ref: "#/components/schemas/ConfigurationProfilePolicy" }
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        fields:
          type: array
          items: { $ref: "#/components/schemas/ProjectConfigurationField" }
        configurations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ConfigurationPublicationProfile" }
        defaultConfigurationId: { type: string }
        reservedFields:
          type: array
          items: { type: string, pattern: '^[a-f0-9]{64}$' }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              path: { type: string }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            required: [ id, path, sha256 ]
      required:
        [
          version,
          kind,
          projectId,
          projectVersion,
          sourceHash,
          draftRevision,
          fields,
          configurations,
          defaultConfigurationId
        ]
    ProjectConfigurationCapability:
      type: object
      properties:
        editable: { type: boolean }
        reason: { type: string }
      required: [ editable ]
    ProjectConfigurationField:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,199}$'
        type:
          type: string
          enum: [ string, number, boolean, json, file ]
        label:
          type: string
        description:
          type: string
        defaultValue:
          description: Native JSON default. Never store real secrets in source declarations.
        required:
          type: boolean
        secret:
          type: boolean
        multiple:
          type: boolean
          description: String arrays for string fields; up to 32 server file references for file fields.
        control:
          type: string
          enum: [ text, textarea, select, radio, checkboxes, ai-models ]
          description: ai-models is reserved for the STEAMHARNESS_AGENT_MODELS JSON field. Entries contain id, name, model and source. System entries use credentialId; third-party entries use apiKind, baseUrl and apiKey. Values are private unless explicitly included in publication.
        allowThirdParty:
          type: boolean
          description: Only valid for ai-models. Set false in configuration.json to allow only system AI. Saves and imports cannot add third-party entries or relax the project's declared policy. Omitted or true allows both sources.
        accept:
          type: array
          description: File fields only. Accepted MIME types or extensions. Files upload through POST
            /api/projects/{projectId}/configurations/files and values contain server metadata, never file bytes.
          items:
            type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required: [ value ]
        sharing:
          $ref: "#/components/schemas/ConfigurationSharingRule"
        paths:
          type: object
          description: JSON Pointer rules, inherited from the parent with more specific rules taking precedence. Excluding the
            whole field excludes every descendant.
          additionalProperties: { $ref: "#/components/schemas/ConfigurationSharingRule" }
        omittedPaths:
          description: Generated opaque deny hashes for omitted JSON paths, without private path names.
          type: array
          items: { type: string, pattern: '^[a-f0-9]{64}$' }
      required: [ name, type ]
    ProjectConfigurationProfile:
      type: object
      properties:
        deletedPaths:
          description: Personal JSON deletion overlays; managed by the service and rechecked against each version's permissions.
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        profileKey: { type: string }
        baseProfile: { type: boolean, readOnly: true }
        templateId:
          type: string
        id:
          type: string
        name:
          type: string
        values:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [ id, name, values, createdAt, updatedAt ]
    ProjectConfigurationState:
      type: object
      description: Role-filtered personal state. Guests receive only accessible base profiles and attachments.
      properties:
        profilePolicy: { $ref: "#/components/schemas/ConfigurationProfilePolicy" }
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        version:
          type: integer
          enum: [ 1 ]
        revision:
          type: integer
          minimum: 0
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        shadowedCustomFields:
          description: Custom definitions temporarily hidden by same-name project declarations, retained for later restoration.
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        capabilities:
          type: object
          readOnly: true
          properties:
            manageConfigurations: { type: boolean }
            role: { $ref: "#/components/schemas/ProjectRole" }
            online: { type: boolean }
            subject: { type: string, description: Host-verified application account scope; not an authorization input. }
            reason: { type: string }
        configurationCapabilities:
          type: object
          readOnly: true
          additionalProperties:
            type: object
            properties:
              use: { type: boolean }
              edit: { type: boolean }
              rename: { type: boolean }
              delete: { type: boolean }
              minimumRole: { $ref: "#/components/schemas/ProjectRole" }
              description: { type: string }
              tags: { type: array, items: { type: string } }
              reason: { type: string }
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectConfigurationProfile"
        activeConfigurationId:
          type: string
        template:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
        publicationPreview:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        canManagePublication: { type: boolean }
        sourceHash:
          type: string
          description: 当前所选源码的摘要；读取已发布版本不会要求草稿存在。 / Hash of the selected source; reading a published version does not require a draft.
        publicationRevision:
          type: integer
          description: 仅开发者及以上读取草稿时提供，用于发布并发校验。 / Provided to developers and above when reading the draft for publication concurrency checks.
        fieldCapabilities:
          type: object
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/ProjectConfigurationCapability"
              - type: object
                properties:
                  paths:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/ProjectConfigurationCapability" }
        conflicts:
          type: array
          description: Preserved personal drafts whose field types changed on upgrade.
          items:
            type: object
            properties:
              configurationId: { type: string }
              key: { type: string }
              value: {}
              reason: { type: string }
      required: [ version, revision, fields, customFields, configurations, activeConfigurationId ]
    ProjectConfigurationExport:
      type: object
      properties:
        version:
          type: integer
          enum: [ 1 ]
        kind:
          type: string
          enum: [ steamharness-project-configurations ]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              profileKey: { type: string }
              templateId:
                type: string
              name:
                type: string
              values:
                type: object
                additionalProperties: true
            required: [ name, values ]
      required: [ version, kind, fields, configurations ]
    ProjectConfigurationAction:
      type: object
      description: At most 1 MiB. Revision is mandatory for every mutation. Profile mutations require id; create takes
        optional name. Save merges typed values and removes overrides named in unset. Field edits use field and optional
        old key. Import takes a complete document. Export optionally filters by id and always applies the current role. Fixed values and base names cannot be changed. Unauthorized batches are rejected atomically.
      properties:
        action:
          type: string
          enum:
            [
              get,
              export,
              create,
              duplicate,
              rename,
              save,
              select,
              delete,
              field.save,
              field.delete,
              import,
              publication.save,
              publication.preview
            ]
        revision:
          type: integer
          minimum: 0
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        profileKey: { type: string, description: Base policy inherited by a newly created personal configuration. }
        values:
          type: object
          additionalProperties: true
        unset:
          type: array
          items:
            type: string
        field:
          $ref: "#/components/schemas/ProjectConfigurationField"
        key:
          type: string
        document:
          $ref: "#/components/schemas/ProjectConfigurationExport"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
      required: [ action ]
    ProjectConfigurationResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/ProjectConfigurationState"
                - $ref: "#/components/schemas/ProjectConfigurationExport"
          required: [ data ]
    KanbanConfiguration:
      $ref: "#/components/schemas/ProjectConfigurationProfile"
    KanbanPreview:
