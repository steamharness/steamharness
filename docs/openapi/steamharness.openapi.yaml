          type: string
          enum:
            - main
            - auxiliary
            - quick
            - mode
        resolveOnInput:
          type: boolean
          description: Whether main composer input changes trigger the selected entrypoint resolver (or the Conversation
            executor resolver). Defaults to false.
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              description:
                type: string
            required:
              - value
        accept:
          type: array
          items:
            type: string
        format:
          type: string
          enum:
            - json
      required:
        - name
        - type
      allOf:
        - if:
            properties:
              control:
                enum:
                  - date
                  - time
                  - datetime
                  - date-range
            required:
              - control
          then:
            properties:
              type:
                const: string
              panel:
                enum:
                  - main
                  - auxiliary
              multiple:
                const: false
            not:
              required:
                - options
    KanbanManifest:
      type: object
      properties:
        version:
          type: integer
          const: 1
        params:
          type: array
          items:
            $ref: "#/components/schemas/ParamDefinition"
      required:
        - version
        - params
    ConfigurationSharingRule:
      type: object
      additionalProperties: false
      properties:
        publish:
          type: boolean
          default: true
        includeValue:
          type: boolean
