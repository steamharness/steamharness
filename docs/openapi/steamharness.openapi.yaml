      responses:
        "200":
          description: 返回规范化后的项目卡片元数据。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCardMetadataResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "501":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/source-files:
    get:
      tags:
        - Admin Projects
      summary: 下载可本地化的已发布源码快照
      description: 下载已发布不可变源码快照，独立校验源码下载权限，无平台限制。成功发送 GET 响应后为实际返回的精确版本累加一次下载量；HEAD、失败和中断响应不计数。
      operationId: getDownloadableSourceFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
