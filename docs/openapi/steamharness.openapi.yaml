openapi: 3.1.0
info:
  title: steamharness API
  version: 0.1.0
  description: "SteamHarness Server 管理项目声明、不可变源码版本、账号和数据资源。项目入口由 CLI 或 Studio 执行。"
servers:
  - url: http://localhost:7126
    description: "本地 Server，dev 默认地址。"
  - url: http://localhost:7130
    description: "已部署的 Server，发布通道默认地址。"
security:
  - BearerAuth: []
tags:
  - name: Health
    description: "检查服务健康状态。"
  - name: Auth & Accounts
    description: "登录、会话、设备授权、账号、角色和 API Key。"
  - name: Admin Projects
    description: "管理项目源码、版本和静态信息。"
  - name: Admin Files
    description: "上传、读取、下载和删除项目文件。"
  - name: Projects & Groups
    description: "固定角色、组继承、成员与邀请。"
  - name: Runtime Storage
    description: "账号私有的 Agent 记录、执行租约和关系型检查点。"
  - name: Relational Databases
    description: "独立 PostgreSQL 资源、账号共享和不可变模型迁移。"
  - name: Knowledge Bases
    description: "独立知识库、账号授权、文档版本和私有附件。"
paths:
  /api/knowledge-bases:
    get:
      tags: [Knowledge Bases]
      summary: "列出可访问的知识库"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":1000000,"default":1}},{"name":"pageSize","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"search","in":"query","required":false,"schema":{"type":"string","maxLength":256}}]
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"object","additionalProperties":false,"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"total":{"type":"integer"},"page":{"type":"integer"},"pageSize":{"type":"integer"}},"required":["items","total","page","pageSize"]}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "创建独立知识库"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"name":{"type":"string","minLength":1,"maxLength":128},"requestId":{"type":"string","format":"uuid"}},"required":["name","requestId"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/bindings:
    get:
      tags: [Knowledge Bases]
      summary: "列出当前账号的知识库绑定"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"projectId","in":"query","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"entryId","in":"query","required":true,"schema":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"}}]
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"array","items":{"type":"object"}}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "将入口绑定到获授权知识库"
      description: "绑定只选择资源，不授予访问权。已注册项目需要 writeData 能力及匹配的知识库声明；未注册本地项目按账号隔离。重复绑定相同目标保留原修订号。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"knowledgeBaseId":{"type":"string","format":"uuid"},"mode":{"enum":["read","write"]}},"required":["projectId","entryId","alias","knowledgeBaseId"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    delete:
      tags: [Knowledge Bases]
      summary: "解除知识库别名绑定"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"}},"required":["projectId","entryId","alias"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/bindings/resolve:
    post:
      tags: [Knowledge Bases]
      summary: "解析并校验知识库绑定"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/KnowledgeBaseIdentity"}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}:
    get:
      tags: [Knowledge Bases]
      summary: "查看可访问知识库"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/grants:
    get:
      tags: [Knowledge Bases]
      summary: "由所有者列出知识库账号授权"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"array","items":{"type":"object"}}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "授予或更新知识库访问权"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"userId":{"type":"string","minLength":1,"maxLength":256},"mode":{"enum":["read","write"]}},"required":["userId","mode"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/grants/{userId}:
    delete:
      tags: [Knowledge Bases]
      summary: "撤销知识库访问权"
      description: "需要账号身份。系统管理密钥不能代替账号授权，响应不缓存。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"userId","in":"path","required":true,"schema":{"type":"string"}}]
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/operations:
    post:
      tags: [Knowledge Bases]
      summary: "操作已声明的知识库"
      description: "每次操作重新检查账号、绑定 ID、revision、accessRevision 及已注册项目权限。写入要求 write 模式，文档 expectedRevision 过期返回 409。\n\n搜索游标绑定资源修订号和查询条件。请求体最多 70 MiB，附件内容最多 50 MiB。不回退到 KV，不自动重放写入。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"knowledgeBaseId":{"type":"string","format":"uuid"},"operation":{"enum":["knowledge.revision","knowledge.listDocuments","knowledge.getDocument","knowledge.createDocument","knowledge.editDocument","knowledge.deleteDocument","knowledge.searchDocuments","knowledge.readDocumentLines","files.createFile","files.readFile","files.deleteFile","files.stat","files.list"]},"input":{"type":"object","description":"输入由操作决定。文档使用 documentId（创建时也可用 id）、title、markdown 及可选的正数 expectedRevision；列表使用 pageSize/cursor。\n\n搜索接受 query/documentId/beforeLines/afterLines/pageSize/cursor/maxMatches。附件使用 fileId 或 name/mimeType/kind/base64，files.list 使用 page/pageSize。Base64 仅用于传输，正文保存在私有存储。"},"binding":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["projectId","entryId","alias","knowledgeBaseId","operation","input","binding"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/manage:
    post:
      tags: [Knowledge Bases]
      summary: "管理知识文档和私有附件"
      description: "管理操作直接检查账号 read/write 授权，无需消费入口绑定。写入不自动重试；文档用 expectedRevision 检查并发，附件正文不保存在 SQL 中。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/KnowledgeBaseOperation"}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/data:
    post:
      tags: [Relational Databases]
      summary: "管理已应用模型的表行"
      description: "账号授权允许在受限 SQL 角色下执行表级操作。models 返回模型和 schemaHash，其他操作必须带该指纹。rows 支持服务端分页、搜索和标量等值过滤；update/delete 要求完整稳定键及 xmin rowVersion，旧版本编辑会失败。\n\nBigInt、Decimal 使用十进制字符串；DateTime 必须带时区并按 UTC 处理；Bytes 使用 Base64。日期返回 UTC 零点，只有时间的类型使用 1970-01-01；枚举使用声明名称，由 Server 处理数据库映射。\n\n无默认值且未提供的列表写为空数组。cuid 等客户端生成的默认值需显式填写，数据库默认值及 @updatedAt 自动应用。每个数据库锁最多等 5 秒，超时返回 DATABASE_BUSY。已执行写入不重放，不接受原始 SQL 或关系写入。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"databaseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/RelationalTableRequest"}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/query:
    post:
      tags: [Relational Databases]
      summary: "通过固定入口绑定查询表行"
      description: "支持与 data 相同的表级操作，并要求当前账号、项目、入口、别名绑定有效。只读绑定不能写入，accessRevision 在授权变化后使旧客户端失效。\n\n并发请求等待绑定和资源锁，每个锁最多 5 秒；超时在执行前返回 DATABASE_BUSY。取得锁后再次检查绑定、授权版本和模型，已执行写入不重放。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"databaseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"consumer":{"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"},"binding":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"revision":{"type":"integer","minimum":1}},"required":["id","revision"]},"accessRevision":{"type":"integer","minimum":1}},"required":["projectId","entryId","alias","schemaHash","binding","accessRevision"]},"request":{"$ref":"#/components/schemas/RelationalTableRequest"}},"required":["consumer","request"]}
      responses:
        "200":
          description: "资源操作成功。"
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases:
    get:
      tags: [Relational Databases]
      summary: "列出拥有或获授权的数据库"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":1000000,"default":1}},{"name":"pageSize","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"search","in":"query","required":false,"schema":{"type":"string","maxLength":256}}]
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "object", "additionalProperties": false, "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/RelationalDatabaseResource"}}, "total": {"type":"integer"}, "page": {"type":"integer"}, "pageSize": {"type":"integer"}}, "required": ["items", "total", "page", "pageSize"]}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Relational Databases]
      summary: "申请并创建独立数据库"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"name": {"type": "string", "minLength": 1, "maxLength": 128}, "requestId": {"type": "string", "format": "uuid"}}, "required": ["name", "requestId"]}
      responses:
        "200":
          description: "数据库管理操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseResource"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/bindings/resolve:
    post: {"tags":["Relational Databases"],"summary":"为 Browser 表客户端解析入口别名","description":"固定绑定身份、模式、schemaHash 和账号 accessRevision。每个绑定或资源锁最多等待 5 秒，超时返回 DATABASE_BUSY；不返回 SQL 凭据。重绑、解绑、撤权或模型变化后，旧客户端失效。","security":[{"BearerAuth":[]},{"SessionCookie":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"}},"required":["projectId","entryId","alias","schemaHash"]}}}},"responses":{"200":{"description":"请求成功。","content":{"application/json":{"schema":{"type":"object","properties":{"errCode":{"const":0},"errMessage":{"type":"string"},"data":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"databaseId":{"type":"string","format":"uuid"},"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string"},"revision":{"type":"integer","minimum":1},"accessRevision":{"type":"integer","minimum":1},"mode":{"enum":["read","write"]},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"}},"required":["id","alias","databaseId","revision","accessRevision","mode","schemaHash"]}},"required":["errCode","errMessage","data"]}}}},"default":{"$ref":"#/components/responses/HarnessError"}}}
  /api/databases/bindings:
    get:
      tags: [Relational Databases]
      summary: "列出当前账号和入口的数据库绑定"
      description: "绑定按账号隔离，只选择已获授权的资源，不赋予权限，也不写入项目源码。重绑或解绑会撤销已有 SQL 连接。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema: {"type": "string", "format": "uuid"}
        - name: entryId
          in: query
          required: true
          schema: {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/RelationalDatabaseBinding"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Relational Databases]
      summary: "将生成的入口别名绑定到可访问资源"
      description: "绑定按账号隔离，只选择已获授权的资源，不赋予权限，也不写入项目源码。重绑或解绑会撤销已有 SQL 连接。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseBindRequest"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseBinding"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    delete:
      tags: [Relational Databases]
      summary: "解除入口别名绑定并撤销 SQL 连接"
      description: "绑定按账号隔离，只选择已获授权的资源，不赋予权限，也不写入项目源码。重绑或解绑会撤销已有 SQL 连接。"
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseConsumer"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections:
    post:
      tags: [Relational Databases]
      summary: "为已绑定原生入口签发临时连接"
      description: "仅供原生 Node 宿主使用，需要账号 Bearer API Key，拒绝 Cookie 会话和带 Origin 的浏览器请求。SQL 凭据不能传入项目 RPC。\n\n同一绑定的多个 worker 可并发签发连接，鉴权使用共享读锁。每次操作在有界等待后检查账号授权与入口绑定；重绑、迁移、撤权使用排他锁，繁忙时可能返回 DATABASE_BUSY。"
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseConnectionRequest"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseConnectionLease"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections/{credentialId}/authorize:
    post:
      tags: [Relational Databases]
      summary: "在查询或事务提交前重新验证连接"
      description: "仅供原生 Node 宿主使用，需要账号 Bearer API Key，拒绝 Cookie 和浏览器 Origin。SQL 凭据不能传入项目 RPC。\n\n每次操作检查账号授权和入口绑定。鉴权共享绑定与资源读锁，管理变更使用排他锁；每个锁最多等 5 秒，超时返回 DATABASE_BUSY，取得锁后重新校验绑定。"
      security:
        - BearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseAuthorizeRequest"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections/{credentialId}:
    delete:
      tags: [Relational Databases]
      summary: "释放原生连接并终止 SQL 会话"
      description: "仅供原生 Node 宿主使用，需要账号 Bearer API Key，拒绝 Cookie 会话和带 Origin 的浏览器请求。每次检查账号授权和当前绑定，SQL 凭据不得传入项目 RPC。"
      security:
        - BearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      responses:
        "200":
          description: "数据库宿主操作成功。"
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}:
    get:
      tags: [Relational Databases]
      summary: "查看可访问数据库"
      description: "需要账号身份。资源所有权决定授权及迁移能力，响应不返回数据库凭据。"
