        "409":
          $ref: "#/components/responses/HarnessError"
  /api/invitations/{token}:
    get:
      tags:
        - Admin Projects
      summary: 查看邀请详情
      description: 需要登录才能查看邀请；资源可为项目或组，project 字段显示对应资源的 ID 和名称。 / Sign-in required; resourceType identifies project or group.
      operationId: lookupProjectInvitation
