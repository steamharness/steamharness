        path:
          type: string
          example: index.ts
        content:
          type: string
          example: export default {};
        encoding:
          type: string
          enum:
            - base64
          description: 二进制静态资源使用 base64 编码时填写；省略时 content 按 UTF-8 文本处理。
      required:
        - path
        - content
    File:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        size:
          type: integer
        encoding:
          type: string
          enum:
            - base64
          description: 存在时表示 `content` 是原始文件字节的 base64 编码，而不是可编辑文本。
      required:
        - path
        - content
        - size
    ProjectKind:
      type: string
      enum:
        - workflow
        - conversation
        - kanban
      description: Registered entry type. One aggregate can contain multiple types and repeated types. Server reads
