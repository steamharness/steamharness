        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        shadowedCustomFields:
          description: "被同名项目声明暂时隐藏的自定义字段，保留以便之后恢复。"
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        capabilities:
          type: object
          readOnly: true
          properties:
            manageConfigurations:
              type: boolean
            role:
              $ref: "#/components/schemas/ProjectRole"
            online:
              type: boolean
            subject:
              type: string
              description: "宿主验证的应用账号作用域，不能作为客户端授权输入。"
            reason:
              type: string
        configurationCapabilities:
          type: object
          readOnly: true
          additionalProperties:
            type: object
            properties:
              use:
                type: boolean
              edit:
                type: boolean
              rename:
                type: boolean
              delete:
                type: boolean
              minimumRole:
                $ref: "#/components/schemas/ProjectRole"
              description:
                type: string
              tags:
                type: array
                items:
                  type: string
              reason:
                type: string
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProjectConfigurationProfile"
        activeConfigurationId:
          type: string
        template:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        publication:
          $ref: "#/components/schemas/ConfigurationPublicationDraft"
        publicationPreview:
          $ref: "#/components/schemas/ProjectConfigurationTemplate"
        canManagePublication:
          type: boolean
        sourceHash:
          type: string
          description: "当前所选源码的摘要；读取已发布版本不会要求草稿存在。"
        publicationRevision:
          type: integer
          description: "仅开发者及以上读取草稿时提供，用于发布并发校验。"
        fieldCapabilities:
          type: object
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/ProjectConfigurationCapability"
              - type: object
                properties:
                  paths:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/ProjectConfigurationCapability"
        conflicts:
          type: array
          description: "升级后字段类型变化时保留的个人草稿。"
          items:
            type: object
            properties:
              configurationId:
                type: string
              key:
                type: string
              value: {}
              reason:
                type: string
        entryId: *a2
      required:
        - version
        - revision
        - fields
        - customFields
        - configurations
        - activeConfigurationId
    ProjectConfigurationExport:
      type: object
      properties:
        version:
          type: integer
          enum:
            - 1
        kind:
          type: string
          enum:
            - steamharness-project-configurations
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              profileKey:
                type: string
              templateId:
                type: string
              name:
                type: string
              values:
                type: object
                additionalProperties: true
            required:
