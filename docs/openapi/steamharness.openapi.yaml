      description: 要求登录、项目读取权限及允许访问服务器数据的存储声明。汇总完整项目数据，不返回条目值、文档正文或预览。
      operationId: getProjectDataSummary
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: 项目 KV 和知识库的完整统计。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataSummaryResponse"
  /api/projects/{projectId}/kv:
    get:
      tags:
        - Admin Projects
      summary: 列出项目 KV
      operationId: listProjectKVEntries
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: 项目详情页只支持 project / conversation，并且只查询 KV 存储域。
          schema:
            type: string
            enum:
              - all
              - project
              - conversation
            default: all
        - name: q
          in: query
          description: 按 key、conversation 或 last run 搜索。
          schema:
            type: string
        - name: valueType
          in: query
          schema:
            $ref: "#/components/schemas/KVEntryValueType"
        - name: conversationId
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 当前项目 project / conversation KV 分页。列表只返回 `valuePreview`、类型和大小等摘要，不返回完整 `value`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryPageResponse"
  /api/projects/{projectId}/kv/entry:
    get:
      tags:
        - Admin Projects
      summary: 读取单条项目 KV
      operationId: getProjectKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope 必填。
          schema:
            type: string
      responses:
        "200":
          description: 单条项目 KV 详情，包含完整 `value`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryDetailResponse"
        "404":
          description: KV 不存在。
    delete:
      tags:
        - Admin Projects
      summary: 删除单条项目 KV
      description: |
        删除一条已存在的 KV 条目，按 `scope` + `key`（conversation scope 还需要 `conversationId`）
        精确定位。删除是永久的，不能恢复；数据本身不可恢复，这一步不提供回收站。
        删除会触发项目存储修订号，桌面端等订阅方据此丢弃已镜像的条目。
        需要项目可管理权限与 `kv.manage`；条目不存在时返回 404。
      operationId: deleteProjectKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope 必填。
          schema:
            type: string
      responses:
        "200":
          description: 已删除的条目身份。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - scope
                          - key
                        properties:
                          scope:
                            type: string
                            enum:
                              - project
                              - conversation
                          key:
                            type: string
                          conversationId:
                            type: string
        "404":
          description: KV 不存在。
  /api/projects/{projectId}/knowledge-documents:
    get:
      tags:
        - Admin Projects
      summary: 列出项目知识库文档
      operationId: listKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          description: 每页文档摘要数量，默认 20，最大 100。
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor；这是不透明 token，只能原样回传。
          schema:
            type: string
      responses:
        "200":
          description: 当前项目内 markdown 知识库文档分页摘要列表，不包含正文 markdown。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentPageResponse"
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
    post:
      tags:
        - Admin Projects
      summary: 新建项目知识库文档
      operationId: createKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: response
          in: query
          description: 返回完整文档或轻量摘要；管理端大文档写入建议使用 summary，避免保存后回传完整 markdown。
          schema:
            type: string
            enum:
              - document
              - summary
            default: document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeDocumentInput"
      responses:
        "201":
          description: 已新建 markdown 文档。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentWriteResponse"
        "400":
          description: 文档 id、title 或 markdown 输入无效。
        "409":
          description: 文档 id 已存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
  /api/projects/{projectId}/knowledge-documents/search:
    get:
      tags:
        - Admin Projects
      summary: 查找项目知识库文档
      operationId: searchKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: q
          in: query
          required: true
          description: 非空搜索关键词，按 markdown 行大小写不敏感匹配。
          schema:
            type: string
        - name: documentId
          in: query
          description: 传入后只查找单篇文档；省略时查找全部文档。
          schema:
            type: string
        - name: beforeLines
          in: query
          description: 每条匹配向上返回多少行上下文，范围 0 到 50。
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: afterLines
          in: query
          description: 每条匹配向下返回多少行上下文，范围 0 到 50。
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: maxMatches
          in: query
          description: 兼容旧客户端的本页大小参数；未传 pageSize 时生效，默认 200，最大 1000。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: pageSize
          in: query
          description: 本页最多返回多少条匹配；默认 200，最大 1000。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: cursor
          in: query
          description: 上一页返回的 nextCursor；省略时读取第一页。
          schema:
            type: string
      responses:
        "200":
          description: 按行匹配结果，包含行号和上下文。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResultResponse"
        "400":
          description: 搜索关键词或上下文行数无效。
        "404":
          description: 指定 documentId 不存在。
        "501":
          description: 当前 storage 未启用 PostgreSQL，项目知识库不可用。
