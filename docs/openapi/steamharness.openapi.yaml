      type: object
      properties:
        projectId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - root
            - dependency
        archivePath:
          type: string
          description: project-group 归档内的安全相对 `.tgz` 或 `.tar.gz` 路径。
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
      required:
        - projectId
        - role
        - archivePath
