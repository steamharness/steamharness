        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 由各项目总量聚合的系统总量，以及项目 token 用量分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsagePageResponse"
        "501":
          description: 当前 storage 不支持 PostgreSQL KV inspection。
  /api/audit-events:
    get:
      tags:
        - Admin Projects
