        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: includeBinary
          in: query
          description: |
            设为 `true` 时，Kanban 项目的非文本静态资源以 base64 返回并标记
            `encoding: base64`。默认响应只包含可编辑文本文件。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 文件列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFilesResultResponse"
    post:
      tags:
        - Admin Files
      summary: 上传项目文件
      operationId: uploadProjectFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: fileName
          in: query
          schema:
            type: string
          example: input.png
        - name: mimeType
          in: query
          schema:
            type: string
          example: image/png
        - name: conversationId
          in: query
          schema:
            type: string
          example: thread-1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 已保存文件引用。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ManagedFileReference"
                    required:
                      - data
  /api/projects/{projectId}/project-card-image:
    post:
      tags:
        - Admin Projects
      summary: 上传项目卡片图片
      description: |
        上传客户端完成 1:1 裁剪后生成的 WebP。调用方必须具备项目管理权限。
        Server 校验格式与大小后按内容哈希保存，并返回公开、不可变的图片 URL。
      operationId: uploadProjectCardImage
