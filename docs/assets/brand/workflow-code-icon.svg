    <rect x="170" y="146" width="684" height="684" rx="158" stroke="#FFFFFF" stroke-opacity="0.84" stroke-width="52"/>
    <path d="M312 520C312 414.514 397.514 329 503 329H629C666.555 329 697 359.445 697 397C697 434.555 666.555 465 629 465H488C448.235 465 416 497.235 416 537C416 576.765 448.235 609 488 609H700" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="142"/>
    <path d="M312 520C312 414.514 397.514 329 503 329H629C666.555 329 697 359.445 697 397C697 434.555 666.555 465 629 465H488C448.235 465 416 497.235 416 537C416 576.765 448.235 609 488 609H700" stroke="url(#flow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="96"/>
