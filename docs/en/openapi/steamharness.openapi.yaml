          type: string
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - positional
            - file
        required:
          type: boolean
        label:
          type: string
        description:
          type: string
        defaultValue:
          type: string
        multiple:
          type: boolean
        control:
          type: string
          enum:
            - text
            - textarea
            - radio
            - select
            - checkboxes
            - date
            - time
            - datetime
            - date-range
          description: |
            Shared form control hint. Date-related controls keep string values:
            date uses YYYY-MM-DD, time uses HH:mm:ss, datetime uses local
            YYYY-MM-DDTHH:mm:ss, and date-range uses inclusive
            YYYY-MM-DD/YYYY-MM-DD. Date controls do not support panel=quick.
        panel:
          type: string
          enum:
            - main
            - auxiliary
            - quick
            - mode
        resolveOnInput:
          type: boolean
          description: Whether main composer input changes trigger the selected entrypoint resolver (or the Conversation
            executor resolver). Defaults to false.
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
              description:
                type: string
            required:
              - value
        accept:
          type: array
          items:
            type: string
        format:
          type: string
          enum:
            - json
      required:
        - name
        - type
      allOf:
        - if:
            properties:
              control:
                enum:
                  - date
                  - time
                  - datetime
                  - date-range
            required:
              - control
          then:
            properties:
              type:
                const: string
              panel:
                enum:
                  - main
                  - auxiliary
              multiple:
                const: false
            not:
              required:
                - options
