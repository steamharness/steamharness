          schema:
            type: string
      responses:
        "200":
          description: 成功 / Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Summary"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/publish:
    post:
      tags:
        - Admin Projects
      summary: Publish a project version
      description: Publish the draft package version as an immutable source snapshot and update latest. Duplicate
        versions return 409. Project code is never installed, built or loaded.
      operationId: publishProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: 初始发布
                expectedVersion:
                  type: string
                  description: Optional expected draft version. A mismatch returns 409 to prevent publishing a replaced draft.
                  pattern: ^\d+\.\d+\.\d+$
                expectedSourceHash:
                  type: string
                  description: Prepared source hash, required with configuration publication drafts. Changed source returns 409
                    without creating a version.
                  pattern: ^[a-f0-9]{64}$
                expectedConfigurationRevisions:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  example: { users: 0, board: 3 }
                  description: Maps each entryId to its publication draft revision as a non-negative JSON safe integer (initially 0).
                    Must match each draft revision; the referenced personal configuration revision must also remain unchanged.
      responses:
        "200":
          description: Publish the results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/members:
    get:
      tags:
        - Projects & Groups
      summary: List Project Members
      operationId: listprojectMembers
      description: 有效角色取项目直接角色、所属组及全部祖先组角色的最高值。维护者只能管理有效角色低于维护者的用户，且只能授予访客或开发者；所有者可管理全部角色。删除直接成员不影响继承权限，最后一名活跃所有者不可删除或降级。
        / Effective access is the maximum direct and inherited role. Maintainers manage only lower roles.
        Owners manage all roles; the last active owner is protected.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The owner/manager/writer/viewer member list of the current project.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceMemberPage"
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
