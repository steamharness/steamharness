                $ref: "#/components/schemas/UpdateProjectDisplayInfoResultResponse"
  /api/projects/{projectId}:
    delete:
      tags:
        - Admin Projects
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: Delete the result.
