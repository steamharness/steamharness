openapi: 3.1.0
info:
  title: steamharness API
  version: 0.1.0
  description: SteamHarness Server manages static aggregate metadata, immutable source and independent database
    spaces. CLI and Studio execute entries.
servers:
  - url: http://localhost:7126
    description: Local SteamHarness Server (dev default)
  - url: http://localhost:7130
    description: Deployed SteamHarness Server (release default)
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Health check.
  - name: Auth & Accounts
    description: Login, session, device flow, user, role, and API Key.
  - name: Admin Projects
    description: Project source, version and metadata management.
  - name: Admin Files
    description: Project file upload, read, download and deletion.
  - name: Projects & Groups
    description: Independent spaces, explicit approval, consumer bindings and shared grants.
  - name: Runtime Storage
    description: Account-private Agent records, execution leases and relational checkpoints.
  - name: Relational Databases
    description: Independent PostgreSQL resources, account sharing and immutable model migrations.
  - name: Knowledge Bases
    description: Independent knowledge resources, account grants, versioned documents and private files.
paths:
  /api/knowledge-bases:
    get:
      tags: [Knowledge Bases]
      summary: "List accessible knowledge resources"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":1000000,"default":1}},{"name":"pageSize","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"search","in":"query","required":false,"schema":{"type":"string","maxLength":256}}]
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"object","additionalProperties":false,"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"total":{"type":"integer"},"page":{"type":"integer"},"pageSize":{"type":"integer"}},"required":["items","total","page","pageSize"]}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "Create an independent knowledge resource"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"name":{"type":"string","minLength":1,"maxLength":128},"requestId":{"type":"string","format":"uuid"}},"required":["name","requestId"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/bindings:
    get:
      tags: [Knowledge Bases]
      summary: "List current account knowledge bindings"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"projectId","in":"query","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"entryId","in":"query","required":true,"schema":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"}}]
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"array","items":{"type":"object"}}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "Bind an entry to an authorized knowledge resource"
      description: "Binding cannot grant access. Registered projects require writeData capability and a matching knowledge declaration. Local unregistered project IDs are account-scoped. Unchanged bindings keep their revision."
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"knowledgeBaseId":{"type":"string","format":"uuid"},"mode":{"enum":["read","write"]}},"required":["projectId","entryId","alias","knowledgeBaseId"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    delete:
      tags: [Knowledge Bases]
      summary: "Unbind a knowledge alias"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"}},"required":["projectId","entryId","alias"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/bindings/resolve:
    post:
      tags: [Knowledge Bases]
      summary: "Resolve and authorize a knowledge binding"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/KnowledgeBaseIdentity"}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}:
    get:
      tags: [Knowledge Bases]
      summary: "Describe an accessible knowledge base"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"$ref":"#/components/schemas/KnowledgeBaseResource"}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/grants:
    get:
      tags: [Knowledge Bases]
      summary: "List knowledge account grants as owner"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{"type":"array","items":{"type":"object"}}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Knowledge Bases]
      summary: "Grant or replace knowledge account access"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"userId":{"type":"string","minLength":1,"maxLength":256},"mode":{"enum":["read","write"]}},"required":["userId","mode"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/grants/{userId}:
    delete:
      tags: [Knowledge Bases]
      summary: "Revoke knowledge account access"
      description: "Account identity is required. Administrative keys do not replace account grants. Responses are not cached."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"userId","in":"path","required":true,"schema":{"type":"string"}}]
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/operations:
    post:
      tags: [Knowledge Bases]
      summary: "Operate on a declared knowledge resource"
      description: "Rechecks account, binding ID/revision/accessRevision and registered project capability in the operation. Writes require write mode. Stale document expectedRevision returns 409. Search cursors are tied to resource revision and query. Body limit 70 MiB; file contents up to 50 MiB. No KV fallback or mutation replay."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"knowledgeBaseId":{"type":"string","format":"uuid"},"operation":{"enum":["knowledge.revision","knowledge.listDocuments","knowledge.getDocument","knowledge.createDocument","knowledge.editDocument","knowledge.deleteDocument","knowledge.searchDocuments","knowledge.readDocumentLines","files.createFile","files.readFile","files.deleteFile","files.stat","files.list"]},"input":{"type":"object","description":"Operation-specific input. Documents use documentId (create may use id), title, markdown and optional positive expectedRevision. Lists use pageSize/cursor; search uses query/documentId/beforeLines/afterLines/pageSize/cursor/maxMatches. Files use fileId or name/mimeType/kind/base64. files.list uses page/pageSize. Base64 is transported only; contents are stored privately."},"binding":{"$ref":"#/components/schemas/KnowledgeBaseBinding"}},"required":["projectId","entryId","alias","knowledgeBaseId","operation","input","binding"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/knowledge-bases/{baseId}/manage:
    post:
      tags: [Knowledge Bases]
      summary: "Manage knowledge documents and private attachments"
      description: "Account read/write grants authorize management without a consumer binding. Mutations do not retry. Documents use optimistic expectedRevision; attachment contents remain outside SQL."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"baseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/KnowledgeBaseOperation"}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/data:
    post:
      tags: [Relational Databases]
      summary: "Manage applied model rows"
      description: "Account grants authorize bounded scalar CRUD under a restricted SQL role. models returns applied metadata and schemaHash. Every other operation requires that schemaHash. rows uses server pagination/search and scalar equality. update/delete require complete stable key and xmin rowVersion; stale edits fail. BigInt and Decimal use decimal strings, DateTime requires ISO with a timezone and uses UTC, Bytes uses Base64. Native dates return UTC midnight; time-only types use 1970-01-01. Enums use authored names with database mappings resolved by Server. Omitted lists without defaults become empty arrays. Application-generated defaults such as cuid must be supplied explicitly; database defaults and @updatedAt are applied. Concurrent requests queue before SQL execution, with a 5-second wait per database lock and DATABASE_BUSY on timeout. Executed writes are not replayed. No raw SQL or relation mutation input is accepted."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"databaseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref":"#/components/schemas/RelationalTableRequest"}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/query:
    post:
      tags: [Relational Databases]
      summary: "Query rows through a pinned consumer binding"
      description: "Same bounded table operations as data, additionally requiring the current account/project/entry/alias binding. Read bindings cannot write. The generated Browser table client uses this structured protocol; accessRevision invalidates clients after grant changes. Concurrent requests queue on binding and resource locks for up to 5 seconds per lock; DATABASE_BUSY means the wait expired before execution. Binding, access revision and schema are revalidated after waiting; executed writes are never replayed."
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"databaseId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","additionalProperties":false,"properties":{"consumer":{"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"},"binding":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"revision":{"type":"integer","minimum":1}},"required":["id","revision"]},"accessRevision":{"type":"integer","minimum":1}},"required":["projectId","entryId","alias","schemaHash","binding","accessRevision"]},"request":{"$ref":"#/components/schemas/RelationalTableRequest"}},"required":["consumer","request"]}
      responses:
        "200":
          description: Successful resource response.
          content:
            application/json:
              schema: {"type":"object","properties":{"errCode":{"type":"integer","const":0},"errMessage":{"type":"string"},"data":{}},"required":["errCode","errMessage","data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases:
    get:
      tags: [Relational Databases]
      summary: List owned and granted database resources
      description: Account identity required. Resource ownership controls grants and migrations. No database credentials are returned.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters: [{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":1000000,"default":1}},{"name":"pageSize","in":"query","required":false,"schema":{"type":"integer","minimum":1,"maximum":100,"default":20}},{"name":"search","in":"query","required":false,"schema":{"type":"string","maxLength":256}}]
      responses:
        "200":
          description: Successful database management response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "object", "additionalProperties": false, "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/RelationalDatabaseResource"}}, "total": {"type":"integer"}, "page": {"type":"integer"}, "pageSize": {"type":"integer"}}, "required": ["items", "total", "page", "pageSize"]}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Relational Databases]
      summary: Request and provision an independent database
      description: Account identity required. Resource ownership controls grants and migrations. No database credentials are returned.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"name": {"type": "string", "minLength": 1, "maxLength": 128}, "requestId": {"type": "string", "format": "uuid"}}, "required": ["name", "requestId"]}
      responses:
        "200":
          description: Successful database management response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseResource"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/bindings/resolve:
    post: {"tags":["Relational Databases"],"summary":"Resolve an entry alias for a generated Browser table client","description":"Pins binding identity, mode, schemaHash and account accessRevision. Concurrent resolutions queue for up to 5 seconds per binding or resource lock before returning DATABASE_BUSY. No SQL credential is returned. Rebinding, unbinding, revocation and model changes invalidate old clients.","security":[{"BearerAuth":[]},{"SessionCookie":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string","pattern":"^[a-z][a-z0-9_-]{0,63}$"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"}},"required":["projectId","entryId","alias","schemaHash"]}}}},"responses":{"200":{"description":"Success.","content":{"application/json":{"schema":{"type":"object","properties":{"errCode":{"const":0},"errMessage":{"type":"string"},"data":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string","format":"uuid"},"alias":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,62}$"},"databaseId":{"type":"string","format":"uuid"},"projectId":{"type":"string","format":"uuid"},"entryId":{"type":"string"},"revision":{"type":"integer","minimum":1},"accessRevision":{"type":"integer","minimum":1},"mode":{"enum":["read","write"]},"schemaHash":{"type":"string","pattern":"^[a-f0-9]{64}$"}},"required":["id","alias","databaseId","revision","accessRevision","mode","schemaHash"]}},"required":["errCode","errMessage","data"]}}}},"default":{"$ref":"#/components/responses/HarnessError"}}}
  /api/databases/bindings:
    get:
      tags: [Relational Databases]
      summary: List database bindings for the current account and entry
      description: Account-scoped host binding. The mapping selects an already granted resource and cannot grant permissions. It is not persisted in project source. Rebinding or unbinding revokes existing SQL connections.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: projectId
          in: query
          required: true
          schema: {"type": "string", "format": "uuid"}
        - name: entryId
          in: query
          required: true
          schema: {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/RelationalDatabaseBinding"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    post:
      tags: [Relational Databases]
      summary: Bind a generated entry alias to an accessible resource
      description: Account-scoped host binding. The mapping selects an already granted resource and cannot grant permissions. It is not persisted in project source. Rebinding or unbinding revokes existing SQL connections.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseBindRequest"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseBinding"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
    delete:
      tags: [Relational Databases]
      summary: Unbind an entry alias and revoke its SQL connections
      description: Account-scoped host binding. The mapping selects an already granted resource and cannot grant permissions. It is not persisted in project source. Rebinding or unbinding revokes existing SQL connections.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseConsumer"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections:
    post:
      tags: [Relational Databases]
      summary: Issue a temporary connection for a bound native entry
      description: Native Node hosts only. Requires an account Bearer API key; Cookie sessions and browser Origin headers are rejected. Never forward SQL credentials to project RPC. Independent native workers may issue credentials concurrently for the same binding using shared read locks. Every operation validates account access and the current entry binding after a bounded lock wait; binding changes, migrations and revocation retain exclusive locks and may return DATABASE_BUSY.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseConnectionRequest"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/RelationalDatabaseConnectionLease"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections/{credentialId}/authorize:
    post:
      tags: [Relational Databases]
      summary: Revalidate a connection before a query or transaction commit
      description: Native Node hosts only. Requires an account Bearer API key; Cookie sessions and browser Origin headers are rejected. Never forward SQL credentials to project RPC. Every operation validates account access and the current entry binding. Authorization uses shared binding and resource locks so concurrent checks can proceed together; binding changes and migrations retain exclusive locks. Each lock waits up to five seconds before returning DATABASE_BUSY, and the binding is revalidated after the locks are acquired.
      security:
        - BearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/RelationalDatabaseAuthorizeRequest"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/connections/{credentialId}:
    delete:
      tags: [Relational Databases]
      summary: Release a native connection and terminate its SQL sessions
      description: Native Node hosts only. Requires an account Bearer API key; Cookie sessions and browser Origin headers are rejected. Never forward SQL credentials to project RPC. Every operation validates account access and the current entry binding.
      security:
        - BearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      responses:
        "200":
          description: Successful database host response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}:
    get:
      tags: [Relational Databases]
      summary: Inspect an accessible database resource
      description: Account identity required. Resource ownership controls grants and migrations. No database credentials are returned.
      security:
