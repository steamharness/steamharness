      summary: Withdrawal of unaccepted invitations
      operationId: revokeprojectInvitation
      description: 有效角色取项目直接角色、所属组及全部祖先组角色的最高值。维护者只能管理有效角色低于维护者的用户，且只能授予访客或开发者；所有者可管理全部角色。删除直接成员不影响继承权限，最后一名活跃所有者不可删除或降级。
        / Effective access is the maximum direct and inherited role. Maintainers manage only lower roles.
        Owners manage all roles; the last active owner is protected.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Undo the result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                        required:
                          - revoked
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/invitations/{token}:
    get:
      tags:
        - Admin Projects
      summary: View Invitation Details
      description: >
        before accepting the invitation, you must call this operation to check whether the token is still
        valid. The token itself is the bear credential, and the interface can be accessed without logging in;

        Users who are not logged in can see the joining information through the returned `project.name` and
        `invitation.role`, and then be directed to the login.
      operationId: lookupProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation and project summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationLookupResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/invitations/{token}/accept:
    post:
      tags:
        - Admin Projects
      summary: Accept project invitation
      description: >
        The caller must be a logged in user. After successful acceptance, the user is added to the project
        member table, and the corresponding role is determined by the invitation.

        Each token can only be accepted once; a second request after acceptance returns a 409.
      operationId: acceptProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted successfully, including invitation record and written member record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationAcceptResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          description: The invitation has expired or been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
