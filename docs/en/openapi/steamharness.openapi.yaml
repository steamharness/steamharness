  /api/projects/{projectId}/entries/{entryId}/resources/read:
    post:
      tags:
        - Admin Projects
      summary: Read an independent knowledge resource through an entry alias
      description: Authenticated. Every operation checks the current actor and effective grant. Approval never
        widens requested permissions.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: entryId
          in: path
          required: true
          schema: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  const: knowledge
                knowledgeBase: *a2
                documentId: {type: string}
              required:
                - kind
                - knowledgeBase
              additionalProperties: false
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    const: 0
                  errMessage:
                    const: ""
                  data: {}
                required:
                  - errCode
                  - errMessage
                  - data
        "400":
          description: Invalid request, rejected transition or approval authority.
        "401":
          description: Authentication required.
        "403":
          description: Project role or active host database grant denies access.
        "404":
          description: Resource or registered entry unavailable.
