      properties:
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
        projectId:
          type: string
          format: uuid
        delivery:
          type: string
          enum:
            - included
            - external
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          description: included rely on the exact version of post-release solidification;
            external do not carry.
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: included rely on source code hash solidified after release;
            external do not carry.
      required:
        - alias
        - projectId
        - delivery
