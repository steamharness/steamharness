            schema: {"type": "object", "additionalProperties": false, "properties": {"schema": {"type": "string", "minLength": 1, "maxLength": 1048576}, "migrations": {"type": "array", "maxItems": 1000, "items": {"$ref": "#/components/schemas/DatabaseMigration"}}}, "required": ["schema", "migrations"]}
      responses:
        "200":
          description: Successful database management response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"$ref": "#/components/schemas/DatabaseMigrationPlan"}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/databases/{databaseId}/migrations/deploy:
    post:
      tags: [Relational Databases]
      summary: Replay shadow history and transactionally deploy pending migrations
      description: Account identity required. Resource ownership controls grants and migrations. No database credentials are returned.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: databaseId
          in: path
          required: true
          schema: {"type": "string", "format": "uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type": "object", "additionalProperties": false, "properties": {"migrations": {"type": "array", "maxItems": 1000, "items": {"$ref": "#/components/schemas/DatabaseMigration"}}, "schemaHash": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "acceptDataLoss": {"type": "boolean", "default": false}}, "required": ["migrations", "schemaHash"]}
      responses:
        "200":
          description: Successful database management response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "array", "items": {"$ref": "#/components/schemas/DatabaseMigrationState"}}}, "required": ["errCode", "errMessage", "data"]}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces:
    post:
      tags:
        - Runtime Storage
      summary: Register or find an account-private Agent workspace
      description: Requires an account Bearer token or account session cookie. An administrator key alone is insufficient. Project workspaces require
        current project read access and a registered entry. Local/Assistant workspaces support unpublished projects without granting access to
        registered project data.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeWorkspaceInput"
      responses:
        "200":
          description: Existing or newly registered account-private workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/resolve:
    post:
      tags: [Runtime Storage]
      summary: Resolve registered project or private unpublished workspace
      description: Existing projects require current read access and a registered entry. Only a missing project resolves to a private local workspace; forbidden access never falls back. Assistant identity remains separate.
      security:
        - BearerAuth: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeWorkspaceInput"
      responses:
        "200":
          description: Account-private resolved workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}:
    get:
      tags:
        - Runtime Storage
      summary: Read an account-owned Agent workspace
      description: Other accounts receive 404, including system administrators. Project access and entry registration are rechecked.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account-owned workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeWorkspaceResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/sessions/open:
    post:
      tags:
        - Runtime Storage
      summary: Acquire an exclusive Agent execution lease
      description: The workspace and sessionKey identify persistent history. Repeating an active ownerToken returns the same lease. Another active owner
        receives 409. Takeover after expiry increments the fence. Owner tokens are stored only as hashes.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sessionKey
                - ownerToken
              properties:
                sessionKey:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Stable host identity without NUL.
                ownerToken:
                  type: string
                  minLength: 32
                  maxLength: 128
                  writeOnly: true
      responses:
        "200":
          description: Session lease, 30 seconds by default.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuntimeStorageLease"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/history/{kind}:
    get:
      tags: [Runtime Storage]
      summary: Read committed platform history
      description: Returns account-owned ordered messages, queues, events and values. Project access and entry registration are rechecked. Reads do not acquire execution ownership.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RuntimeHistoryKind"
      responses:
        "200":
          description: Committed account-owned data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RuntimeHistoryRecord"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/agent-sessions:
    get:
      tags: [Runtime Storage]
      summary: List stored Agent session identities
      description: Returns non-deleted session keys in the account-owned workspace whose literal prefix matches the query.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Committed account-owned data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/workspaces/{workspaceId}/snapshot:
    get:
      tags: [Runtime Storage]
      summary: Read a versioned committed Agent session snapshot
      description: Uses a consistent database snapshot without acquiring or resuming the source execution. An active owner may continue. Deleted sessions return 404.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionKey
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Committed account-owned data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RuntimeStorageResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RuntimeAgentSessionSnapshot"
        default:
          $ref: "#/components/responses/HarnessError"
  /api/runtime-storage/sessions/{sessionId}/operations:
    post:
      tags:
        - Runtime Storage
      summary: Execute a typed Agent storage operation under the current lease
      description: Account ownership, current project access, owner token, lease expiry and fence are verified for every request. Maximum body is 16 MiB.
        Mutable operations persist requestId and result in the same transaction. Read queries such as submissionByRequest are never cached as mutations. Retrying identical content returns the original result; changing content
        for an existing ID returns 409. No SQL or executable code is accepted. Errors include RUNTIME_STORAGE_LEASE_LOST, RUNTIME_STORAGE_OWNER_CONFLICT
        RUNTIME_STORAGE_REVISION_CONFLICT and RUNTIME_STORAGE_IDEMPOTENCY_CONFLICT in data.code.
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - ownerToken
                - fence
                - operation
              properties:
                ownerToken:
                  type: string
                  minLength: 32
                  maxLength: 128
                  writeOnly: true
                fence:
                  $ref: "#/components/schemas/RuntimeStorageId"
                operation:
                  $ref: "#/components/schemas/RuntimeStorageOperation"
      responses:
        "200":
          description: Record, page, commit sequence, ID, renewed lease or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStorageResponse"
        default:
          $ref: "#/components/responses/HarnessError"
  /health:
    get:
      tags:
        - Health
      summary: Health check
      security: []
      parameters:
        - in: header
          name: X-SteamHarness-Locale
          required: false
          description: Response language. Supports `zh-CN` and `en`; requests without a locale retain the Server's
            existing English default.
          schema:
            type: string
            enum:
              - zh-CN
              - en
            default: en
        - in: query
          name: locale
          required: false
          description: Language fallback for WebSocket clients or callers that cannot set a custom header.
            `X-SteamHarness-Locale` takes precedence when present.
          schema:
            type: string
            enum:
              - zh-CN
              - en
      responses:
        "200":
          description: Server Normal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 0
                  errMessage:
                    type: string
                    const: ""
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      runtime:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - development
                              - production
                            example: production
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-29T09:55:00Z
                        required:
                          - mode
                          - startedAt
                      versions:
                        type: object
                        properties:
                          serverVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.3
                          coreVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.1
                        required:
                          - serverVersion
                          - coreVersion
                      currentRelease:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              summary:
                                type: string
                              body:
                                type: string
                                description: Complete Markdown release notes in the requested language. Older metadata without localizations
                                  falls back to `releaseNotes.body`.
                              docsUrl:
                                type: string
                                format: uri
                                description: URL for the current Server version on the standalone release-notes page in the requested
                                  language.
                                example: https://docs.steamharness.yuhe.space/en/guides/releases/server/v0.1.3
                            required:
                              - summary
                              - body
                              - docsUrl
                    required:
                      - status
                      - runtime
                      - versions
                      - currentRelease
                required:
                  - errCode
                  - errMessage
                  - data
  /api/auth/browser-session:
    post:
      tags: [Auth & Accounts]
      summary: Reuse a native client login in Server Web
      operationId: createBrowserSession
      description: Issue a single-use code valid for 60 seconds using an account API key. The destination must be a local absolute path. No new account session or API key is created. The code retains the original account and key permissions; responses are not cached. Limited to 20 requests per key per minute.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnTo]
              properties:
                returnTo: {type: string, maxLength: 2048, example: /databases}
      responses:
        "200":
          description: Short-lived browser handoff code; never returns the original token.
          content:
            application/json:
              schema:
                type: object
                required: [errCode, errMessage, data]
                properties:
                  errCode: {type: integer, const: 0}
                  errMessage: {type: string}
                  data:
                    type: object
                    required: [code, expiresAt]
                    properties:
                      code: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                      expiresAt: {type: string, format: date-time}
        default:
          $ref: "#/components/responses/HarnessError"
    get:
      tags: [Auth & Accounts]
      summary: Consume a browser handoff and open its destination
      operationId: consumeBrowserSession
      description: Consumes the code once, revalidates the original API key and sets a signed HttpOnly SameSite=Lax cookie before redirecting. The original key remains authoritative on every request, including revocation, expiry and disabled accounts. Expired or reused codes fail with 401. Responses use no-store and no-referrer.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
      responses:
        "303":
          description: Browser authentication established with the native client's account and key permissions.
          headers:
            Location:
              description: Local destination supplied when the code was issued.
              schema: {type: string}
            Set-Cookie:
              description: Signed HttpOnly authentication cookie; Secure on HTTPS requests.
              schema: {type: string}
        default:
          $ref: "#/components/responses/HarnessError"
  /api/auth/session:
    get:
      tags:
        - Auth & Accounts
      summary: Read the current browser or Bearer login status
      operationId: getAuthSession
      security: []
      responses:
        "200":
          description: "Return `authenticated: false` when not logged in; bring principal summary when logged in."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
  /api/auth/admin-key/health:
    get:
      tags:
        - Auth & Accounts
      summary: Check if the administrator key is configured
      operationId: getAdminKeyHealth
      security: []
      responses:
        "200":
          description: Returns whether `STEAMHARNESS_SERVER_ADMIN_KEY` is configured on the current server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyConfiguredResponse"
  /api/auth/admin-key/session:
    post:
      tags:
        - Auth & Accounts
      summary: Establish a recovery session with an administrator key
      description: >
        It is used for the first administrator recovery, recovery login when there is no account, and
        permission recovery.

        If the account system is configured at the same time, the server will preferentially try to map the
        current administrator key to the browser session with `builtin_admin`.
      operationId: createAdminKeySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKeySessionRequest"
      responses:
        "200":
          description: Login successful and write httpOnly cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/login:
    post:
      tags:
        - Auth & Accounts
      summary: Establish an account session by using the email password
      description: >
        Ordinary account and administrator account unified use this 1 portal login.

        If the mailbox and password in the request match `STEAMHARNESS_BOOTSTRAP_ADMIN_EMAIL` /
        `STEAMHARNESS_BOOTSTRAP_ADMIN_PASSWORD`,

        The server creates this `builtin_admin` only while the account table is empty. Later logins verify the
        current database password and never overwrite a changed password or disabled state from environment
        variables.

        Display names follow the saved user profile. Login never replaces a changed name with the bootstrap
        default or an outdated authentication name.

        Accounts, password hashes, sessions, and invitations are stored in the PostgreSQL database selected by
        `STEAMHARNESS_DATABASE_URL`.

        Passwords use scrypt with random salts. The browser cookie stores only a signed refresh token and the
        database stores token hashes only.
      operationId: createPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Login successful and write httpOnly cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/logout:
    post:
      tags:
        - Auth & Accounts
      summary: Clean up the current browser session
      operationId: logoutAuthSession
      security: []
      responses:
        "200":
          description: Attempts to clean cookies regardless of whether a session currently exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /api/auth/invitations/{token}:
    get:
      tags:
        - Auth & Accounts
      summary: Read account invitation metadata
      description: Returns the invited email, display name, 24-hour expiry, and optional acceptance time without
        exposing the stored token hash. Regenerating an invitation immediately invalidates its older link.
      operationId: getAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns invitation metadata used by the initial-password page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Auth & Accounts
      summary: Accept an account invitation and set the initial password
      description: Accepts the one-time invitation, sets the password, and revokes the account's existing browser
        sessions.
      operationId: acceptAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAccountInvitationRequest"
      responses:
        "200":
          description: Accepts the invitation, activates the account, and writes a 30-day httpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/start:
    post:
      tags:
        - Auth & Accounts
      summary: Create Device Login Request
      description: >
        CLI, Desktop, and Web first call this endpoint to obtain the device code, user code, and browser
        approval address,

        The `/login/device` approval is then accessed by the logged-in browser session.
      operationId: startDeviceFlow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowStartRequest"
      responses:
        "200":
          description: Returns the device code, verification code, and polling interval required for this device flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/token:
    post:
      tags:
        - Auth & Accounts
      summary: Poll device flow results and exchange for API Key
      description: |
        Continue to poll by `intervalSeconds` when returning to `authorization_pending`;
        When returning `slow_down`, `Retry-After` or `data.retryAfterSeconds` should be read for backoff;
        Returns `expired_token` to indicate that the current device code has expired or been consumed.
      operationId: pollDeviceFlowToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowTokenRequest"
      responses:
        "200":
          description: After the approval is successful, a one-time plaintext API Key and account information are
            returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowTokenResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "428":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/approve:
    post:
      tags:
        - Auth & Accounts
      summary: Approve a device login in the browser
      operationId: approveDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: If the approval is successful, the polling end can then exchange the API Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/deny:
    post:
      tags:
        - Auth & Accounts
      summary: Deny device login once in browser
      operationId: denyDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: The request is rejected and the polling side receives `access_denied`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/me:
    get:
      tags:
        - Auth & Accounts
      summary: Read current account information
      operationId: getCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Returns the current principal and user profile; administrator-key login has a null `profile`.
            After successful Desktop API Key authentication, `principal.expiresAt` contains the
            sliding-renewal expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
    patch:
      tags:
        - Auth & Accounts
      summary: Update current account information
      description: Display name changes update both the authentication account and user profile and survive login
        and session renewal. Updating only an avatar, email, or password preserves the saved name.
      operationId: updateCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Returns the updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys:
    get:
      tags:
        - Auth & Accounts
      summary: List currently manageable API Keys
      operationId: listAccountApiKeys
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Ordinary users view their own API Key by default; administrators or principal with
            `api_keys.manage_all` can view all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: Create a new API Key
      operationId: createAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Returns a new API Key record and a clear-text token that is displayed only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys/{apiKeyId}:
    delete:
      tags:
        - Auth & Accounts
      summary: Undo a API key
      operationId: revokeAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: Undo successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users:
    get:
      tags:
        - Auth & Accounts
      summary: List accounts and aggregate permissions summary
      operationId: listAccountUsers
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by mailbox, display name, or role name.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - disabled
              - invited
          description: Filter by project account status.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitations:
    post:
      tags:
        - Auth & Accounts
      summary: Invite a new user
      operationId: inviteAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Returns the user profile and a complete Server-generated `/account/invite/:token` URL by default;
            compatible requests may still return temporary-password information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitation-link/{userId}:
    get:
      tags:
        - Auth & Accounts
      summary: Regenerate an invitation link for an existing invited user
      operationId: regenerateAccountInvitationLink
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Returns a new 24-hour invitation URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationLinkResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}:
    patch:
      tags:
        - Auth & Accounts
      summary: Update a user's mailbox, display name, temporary password, or start/stop status
      operationId: updateAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: Returns the updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects:
    get:
      tags:
        - Admin Projects
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: Project summary list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryListResponse"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema: &a1
            type: string
        - name: groupId
          in: query
          required: false
          schema: *a1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - published
              - draft
        - name: minRole
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectRole"
      description: 先按登录账号权限筛选，再执行搜索与分页。groupId 为空字符串时查询个人项目；省略时查询所有可访问项目。公开项目对登录账号提供隐式访客权限。 / Authorization precedes
        pagination. Public projects grant signed-in users implicit guest access.
    post:
      tags:
        - Admin Projects
      summary: Create an application with a Server-assigned UUID
      description: 登录账号可创建个人项目，创建者成为所有者。groupId 指定归属组时需要该组开发者权限，创建者只保留原有继承角色。已有项目的开发者上传不会修改管理信息或归属。 / Signed-in
        users may create personal projects as owners. Group projects require developer access and do not
        promote the creator. Server assigns a fresh UUID; client-selected projectId is rejected. No source
        upload is required.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: "@steamharness/hello-workflow"
              projectInfo:
                localizedNames: {}
                declarations: []
                platformSupport:
                  mode: agnostic
              visibility: private
              projectCard:
                icon: workflow
                iconColor: "#ffffff"
                iconBackgroundColor: "#2563eb"
              entries:
                - entryId: main
                  type: workflow
                  name: Main
                  root: .
                  entry: index.ts
                  databases: []
              defaultEntry: main
      responses:
        "201":
          description: Created a new application; returns the Server-assigned UUID, project type, complete declaration,
            and visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/token-usage:
    get:
      tags:
        - Admin Projects
      summary: Read system token usage
      operationId: getSystemTokenUsage
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: System total aggregated from project totals, plus paginated project token usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsagePageResponse"
        "501":
          description: The current storage does not support the PostgreSQL KV inspection.
  /api/audit-events:
    get:
      tags:
        - Admin Projects
      summary: Read Global Audit Log
      operationId: listAuditEvents
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
          example: 2026-06-18T16:00:00.000Z::audit-1
        - name: from
          in: query
          description: ISO 8601 start time, including boundaries.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: ISO 8601 end time, including boundaries.
          schema:
            type: string
            format: date-time
        - name: userId
          in: query
          schema:
            type: string
        - name: principalKind
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AuditOutcome"
      responses:
        "200":
          description: Audit events are paginated and structured context is desensitized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPageResponse"
        "403":
          description: The current principal is missing `audit.read`.
  /api/projects/{projectId}/init:
    post:
      tags:
        - Admin Projects
      summary: Initialize a project from files
      operationId: initProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SourceFileInput"
              required:
                - files
            example:
              files:
                - path: package.json
                  content: '{"id":"hello","type":"module"}'
                - path: index.ts
                  content: export default {};
      responses:
        "200":
          description: Static file processing result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPackageResultResponse"
  /api/projects/{projectId}/preparations/latest:
    get:
      tags:
        - Admin Projects
      summary: Querying the Latest Server Preparation Tasks
      operationId: getLatestProjectPreparation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: Latest preparation tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationJobResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/preparations/{jobId}:
    get:
      tags:
        - Admin Projects
      summary: Query Server Preparation Tasks
      operationId: getProjectPreparation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prepare the current status of the task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationJobResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/package:
    post:
      tags:
        - Admin Projects
      summary: Upload a project package
      operationId: uploadProjectPackage
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: fileName
          in: query
          schema:
            type: string
          example: hello.tgz
        - name: mode
          in: query
          description: When set to `create`, it is only created and not overwritten by normal upload.
          schema:
            type: string
            enum:
              - create
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: The source archive is persisted and an asynchronous preparation task is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparationJobResponse"
  /api/projects/{projectId}/files:
    get:
      tags:
        - Admin Projects
      summary: Read a project source file
      description: Source download access includes published versions only. Reading draft additionally requires
        project management access, so unpublished configuration fields and defaults remain private.
      operationId: getProjectFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: includeBinary
          in: query
          description: >
            When set to `true`, the non-text static resources of the Kanban item are returned in base64 and
            marked

            `encoding: base64`. The default response contains only editable text files.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFilesResultResponse"
    post:
      tags:
        - Admin Files
      summary: Upload project file
      operationId: uploadProjectFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: fileName
          in: query
          schema:
            type: string
          example: input.png
        - name: mimeType
          in: query
          schema:
            type: string
          example: image/png
        - name: conversationId
          in: query
          schema:
            type: string
          example: thread-1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Saved file reference.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ManagedFileReference"
                    required:
                      - data
  /api/projects/{projectId}/project-card-image:
    post:
      tags:
        - Admin Projects
      summary: Upload project card image
      description: >
        Upload the WebP generated after the client completes 1:1 clipping. The caller must have project
        management privileges.

        Server After checking the format and size, it is saved by content hash and returns a public, immutable
        image URL.
      operationId: uploadProjectCardImage
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The image has been saved; the same content reuses the same URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCardImageResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "413":
          $ref: "#/components/responses/HarnessError"
        "415":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/project-card:
    put:
      tags:
        - Admin Projects
      summary: Update project card metadata
      description: Update display metadata only. Entry types come from steamharness.json entries and cannot be changed
        through this API.
      operationId: updateProjectCard
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectCard:
                  $ref: "#/components/schemas/ProjectCardMetadata"
              required:
                - projectCard
      responses:
        "200":
          description: Returns the normalized item card metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCardMetadataResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "501":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/source-files:
    get:
      tags:
        - Admin Projects
      summary: Download a localizable snapshot of the published source code
      description: Download a published immutable source snapshot with separate source download permission. No
        platform restriction. A successfully sent GET response adds one download to the exact returned
        version. HEAD, failed and interrupted responses are not counted.
      operationId: getDownloadableSourceFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: Exact published version or latest. Draft is rejected.
          schema:
            type: string
            default: latest
      responses:
        "200":
          description: List of source files that can be used to create local projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadableSourceFilesResultResponse"
        "403":
          description: The current identity does not have permission to download the project source code.
        "409":
          description: Published source snapshot is unavailable.
  /project-card-images/{projectId}/{fileName}:
    get:
      tags:
        - Admin Projects
      summary: Read public project card picture
      description: Reads immutable WebP saved by content hash for project lists and Desktop surfaces.
      security: []
      operationId: getProjectCardImage
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.webp$
      responses:
        "200":
          description: Project card WebP picture, response can be long-term public cache.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: The picture does not exist.
  /storage/avatars/{userId}/{fileName}:
    get:
      tags:
        - Admin Account
      summary: Read a public avatar from local object storage
      description: Mounted only when Server runs with STEAMHARNESS_STORAGE_DRIVER=local. It serves immutable avatars
        addressed by content hash; the route serves avatars only, and `storage/workflows/**` and
        `storage/writer-artifacts/**` are never reachable through it.
      security: []
      operationId: getLocalStorageAvatar
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9-]{1,64}$
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.(png|jpe?g|gif|webp)$
      responses:
        "200":
          description: The avatar image. The response may be publicly cached for a long time.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: The avatar does not exist.
  /api/projects/files/{fileId}:
    get:
      tags:
        - Admin Files
      summary: Read or download project files
      operationId: getFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: The contents of the file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    delete:
      tags:
        - Admin Files
      summary: Delete project file
      operationId: deleteFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete the result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                    required:
                      - data
  /api/projects/{projectId}/kanban:
    get:
      tags:
        - Admin Projects
      summary: Read Kanban Workspace
      description: >
        Read fixed target static product directories, HTML entries, manifests, named configurations for
        current user isolation, and short-term preview capability.

        A parameterized project creates a "default configuration" atomically the first time it is read; a
        parameterless project returns an empty configuration list.
      operationId: getKanbanWorkspace
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: &a2
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,63}$
      responses:
        "200":
          description: Kanban workspace and short-term preview address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/bridge:
    post:
      tags:
        - Admin Projects
      summary: Call Kanban project data Bridge
      description: Use entryId for the registered Kanban entry. Data and attachment calls require input.database and
        current project and space authorization. target selects a static declaration version; draft data
        access can use a registered entry before source upload. No project execution occurs.
      operationId: invokeKanbanBridge
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanStudioBridgeRequest"
      responses:
        "200":
          description: Bridge operation result; data can be omitted for KV that does not exist, and null is returned for
            knowledge documents that do not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBridgeResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "500":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/previews/{capability}/{nonce}/{target}/{assetPath}:
    get:
      tags:
        - Admin Projects
      summary: Read capability-protected Kanban static resources
      description: >
        Uses the short-lived capability issued by the workspace endpoint to read resources from a fixed
        version. `assetPath` may be

        the configured HTML entry or a multi-segment relative path inside the artifact directory. Directory
        traversal, symbolic links,

        sensitive files, and files outside that directory are rejected. The HTML entry injects the
        configuration and project-data Bridge

        with a nonce and returns an offline CSP limited to same-artifact resources, data, and blob URLs. The
        capability itself is a temporary

        credential scoped to the project, user, fixed target, and expiration time, so a sandboxed iframe can
        load ES modules, WASM, and

        project data files without a login cookie or API key. Other project APIs still require login
        authentication.
      security: []
      operationId: getKanbanPreviewAsset
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: capability
          in: path
          required: true
          schema:
            type: string
        - name: nonce
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML, CSS, JavaScript, images, fonts, or other allowed static resources from the project.
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            text/html: {}
            text/css: {}
            application/javascript: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/template:
    get:
      tags:
        - Admin Projects
      summary: Read an immutable published configuration template
      operationId: getProjectConfigurationTemplate
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: Version template with filtered fields, values, rules and attachment hashes. Requires project read
            or source-download permission. Missing templates return null data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectConfigurationTemplate"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files:
    post:
      tags:
        - Admin Projects
      summary: Upload a personal configuration attachment after checking field permissions
      operationId: uploadProjectConfigurationFile
      description: Set target to the installed published version to check its field permissions. Omitting target
        uses the author's draft or the recipient's latest published template.
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: query
          name: key
          required: true
          schema:
            type: string
        - in: query
          name: fileName
          required: true
          schema:
            type: string
        - in: query
          name: mimeType
          required: true
          schema:
            type: string
        - in: query
          name: field
          description: Optional JSON descriptor for a local custom file field; never overrides an author field. At most
            8192 characters.
          schema:
            type: string
            maxLength: 8192
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: One server file reference. Uploads are account isolated and limited to 50 MiB; save the returned
            reference in a separate configuration mutation.
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files/{fileId}:
    get:
      tags:
        - Admin Projects
      summary: Read an allowed personal or immutable version attachment
      operationId: readProjectConfigurationFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: path
          name: fileId
          required: true
          schema:
            type: string
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: File bytes. Source-download access grants only the template attachments; personal uploads are
            restricted to their uploading account.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations:
    get:
      tags:
        - Admin Projects
      summary: Read account-scoped configurations for any project type
      description: Requires project read or source-download access and an account identity. Values are isolated by
        project and account. Download access only exposes the version template and permitted personal values.
        Official drafts require the actual original owner or an administrator. The Server never executes
        project code. A temporary role fallback changes the response view while preserving the account's
        saved selection; access recovery reuses it. Saving fallback values preserves that selection,
        while an explicit select action updates it.
      operationId: getProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: Current fields, profiles, selection and revision. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Admin Projects
      summary: Manage or export account-scoped project configurations
      description: Mutations require the queried revision. Imports and path permission checks are atomic. Exports
        contain all readable effective values, including sensitive fields. The last personal profile cannot be
        deleted. publication.save manages an online author draft using its own revision, and
        publication.preview filters an optional draft without saving. Both require the original owner or an
        administrator. Client role fields never grant ownership.
      operationId: manageProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  default: draft
                call:
                  $ref: "#/components/schemas/ProjectConfigurationAction"
                entryId: *a2
              required:
                - call
                - entryId
      responses:
        "200":
          description: Committed state, or portable export for the export action. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: Revision conflict; data.code is CONFIGURATION_CONFLICT and no mutation was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/projects/{projectId}/draft/files:
