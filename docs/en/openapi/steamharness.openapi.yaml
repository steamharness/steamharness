        - storage
        - createdAt
    HealthDeploymentUnit:
      oneOf:
        - type: "null"
        - type: object
          properties:
            unit:
              type: string
              enum:
                - server
                - server-web
            tag:
              type: string
              example: server/v0.1.0
            version:
              type: string
              example: 0.1.0
            versionLabel:
              type: string
              example: v0.1.0
            publishedAt:
              type:
                - string
                - "null"
              format: date-time
              example: 2026-06-29T10:00:00Z
            commitSha:
              type:
                - string
                - "null"
              example: abcdef123456
            components:
              type: object
              additionalProperties:
                type: string
              description: The built-in component versions of this release, such as the Server
                built-in Core version.
            releaseNotes:
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    format:
                      type: string
                      const: markdown
                    body:
                      type: string
                      description: Markdown release notes in the requested language. Older metadata
                        falls back to the default body.
                  required:
                    - format
                    - body
            source:
              type: string
              enum:
                - release-metadata
                - package-manifest
          required:
            - unit
            - tag
            - version
            - versionLabel
            - publishedAt
            - commitSha
            - components
            - releaseNotes
            - source
