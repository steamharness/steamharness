          type: array
          items:
            $ref: "#/components/schemas/DatabaseBinding"
      required:
        - spaces
        - requests
        - grants
        - bindings
    DatabaseRequestInput:
      type: object
      description: Approval metadata and binding references are generated exclusively by the host.
      properties:
        projectId: *a10
        entryId: *a2
        alias: *a2
        target:
          $ref: "#/components/schemas/DatabaseTarget"
        permissions:
          $ref: "#/components/schemas/DatabasePermissions"
      required:
        - projectId
        - entryId
        - alias
        - target
        - permissions
      additionalProperties: false
    DatabaseAddress:
      type: object
      properties:
        spaceId: *a10
        storageKind:
          enum:
            - kv
            - persistent_value
        scope:
          enum:
            - project
            - conversation
        key: *a11
        conversationId: *a11
      required:
        - spaceId
        - storageKind
        - scope
        - key
    DatabaseDataRequest:
      type: object
      properties:
        projectId: *a10
        entryId: *a2
        alias: *a2
        bindingRef: *a10
        credentialVersion:
          type: integer
          minimum: 1
        operation:
          enum:
            - get
            - set
            - delete
            - compare-and-set
            - transaction
            - list
            - revision
        entry:
          $ref: "#/components/schemas/DatabaseAddress"
        value: {}
        expectedRevision:
          type:
            - string
            - "null"
        entries:
          type: array
          items:
            type: object
            properties:
              entry:
                $ref: "#/components/schemas/DatabaseAddress"
              expectedRevision:
                type:
                  - string
                  - "null"
              mutation:
                type: object
                properties:
                  operation:
                    enum:
                      - set
                      - delete
                  value: {}
                required:
                  - operation
            required:
              - entry
              - expectedRevision
        keyPrefixes:
          type: array
          maxItems: 1024
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: Optional KV list filter. Prefixes cannot contain NUL and only narrow the current
            host declaration and grant. The intersection applies before counting and pagination.
        query: *a11
        cursor: *a11
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - projectId
        - entryId
        - alias
        - bindingRef
        - credentialVersion
        - operation
      description: Consumer data access checks current project role, entry requirement and live grant. Knowledge
        keys require persistent_value and knowledge permissions. Transactions compare every observed revision
        and atomically apply mutations; conflicts return applied=false.
