                $ref: "#/components/schemas/CloneWorkflowResultResponse"
  /api/projects/{projectId}/project-info:
    put:
      tags:
        - Admin Workflows
      summary: Synchronize the default project name and presentation declarations
      description: |
        Synchronizes the local root `package.json` `name` and `steamHarness.projectInfo` to an already bound
        project. Presentation declarations and platforms are display metadata and do not restrict source upload or download.
      operationId: updateWorkflowProjectInfo
