    ProjectConfigurationTemplate:
      type: object
      description: Immutable, filtered version data; defaultValue is omitted. Arrays are indivisible. Excluded names
        are represented only by opaque deny hashes. The authenticated download validates source and attachment
        hashes before caching outside project source.
      properties:
        version:
          type: integer
          enum:
            - 2
            - 3
        kind:
          type: string
          enum:
            - steamharness-configuration-template
        projectId:
          type: string
        projectVersion:
          type: string
        sourceHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        draftRevision:
          type: integer
          minimum: 0
        profilePolicy:
          $ref: "#/components/schemas/ConfigurationProfilePolicy"
        agentModelPolicy:
          $ref: "#/components/schemas/AgentModelPolicy"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProjectConfigurationField"
        configurations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ConfigurationPublicationProfile"
        defaultConfigurationId:
          type: string
        reservedFields:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              path:
                type: string
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
            required:
              - id
              - path
              - sha256
      required:
        - version
        - kind
        - projectId
        - projectVersion
        - sourceHash
        - draftRevision
        - fields
        - configurations
        - defaultConfigurationId
