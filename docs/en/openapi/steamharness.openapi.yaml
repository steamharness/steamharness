openapi: 3.1.0
info:
  title: steamharness API
  version: 0.1.0
  description: SteamHarness Server stores projects, immutable source versions and
    project data. Project execution is local.
servers:
  - url: http://localhost:7125
    description: Local SteamHarness Server (dev default)
  - url: http://localhost:7130
    description: Deployed SteamHarness Server (release default)
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Health check.
  - name: Auth & Accounts
    description: Login, session, device flow, user, role, and API Key.
  - name: Admin Workflows
    description: Project source, version and metadata management.
  - name: Admin Files
    description: Project file upload, read, download and deletion.
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      security: []
      parameters:
        - in: header
          name: X-SteamHarness-Locale
          required: false
          description: Response language. Supports `zh-CN` and `en`; requests without a
            locale retain the Server's existing English default.
          schema:
            type: string
            enum:
              - zh-CN
              - en
            default: en
        - in: query
          name: locale
          required: false
          description: Language fallback for WebSocket clients or callers that cannot set
            a custom header. `X-SteamHarness-Locale` takes precedence when present.
          schema:
            type: string
            enum:
              - zh-CN
              - en
      responses:
        "200":
          description: Server Normal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 0
                  errMessage:
                    type: string
                    const: ""
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      runtime:
                        type: object
                        properties:
                          mode:
                            type: string
                            enum:
                              - development
                              - production
                            example: production
                          startedAt:
                            type: string
                            format: date-time
                            example: 2026-06-29T09:55:00Z
                        required:
                          - mode
                          - startedAt
                      versions:
                        type: object
                        properties:
                          serverVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.3
                          coreVersion:
                            type:
                              - string
                              - "null"
                            example: 0.1.1
                        required:
                          - serverVersion
                          - coreVersion
                      currentRelease:
                        oneOf:
                          - type: "null"
                          - type: object
                            properties:
                              summary:
                                type: string
                              body:
                                type: string
                                description: Complete Markdown release notes in the requested language. Older
                                  metadata without localizations falls back to
                                  `releaseNotes.body`.
                              docsUrl:
                                type: string
                                format: uri
                                description: URL for the current Server version on the standalone release-notes
                                  page in the requested language.
                                example: https://docs.steamharness.yuhe.space/en/guides/releases/server#server-v0-1-3
                            required:
                              - summary
                              - body
                              - docsUrl
                      deployment:
                        type: object
                        properties:
                          server:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                          serverWeb:
                            $ref: "#/components/schemas/HealthDeploymentUnit"
                        required:
                          - server
                          - serverWeb
                    required:
                      - status
                      - runtime
                      - versions
                      - currentRelease
                      - deployment
                required:
                  - errCode
                  - errMessage
                  - data
  /api/auth/session:
    get:
      tags:
        - Auth & Accounts
      summary: Read the current browser or Bearer login status
      operationId: getAuthSession
      security: []
      responses:
        "200":
          description: "Return `authenticated: false` when not logged in; bring principal
            summary when logged in."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
  /api/auth/admin-key/health:
    get:
      tags:
        - Auth & Accounts
      summary: Check if the administrator key is configured
      operationId: getAdminKeyHealth
      security: []
      responses:
        "200":
          description: Returns whether `STEAMHARNESS_SERVER_ADMIN_KEY` is configured on the
            current server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKeyConfiguredResponse"
  /api/auth/admin-key/session:
    post:
      tags:
        - Auth & Accounts
      summary: Establish a recovery session with an administrator key
      description: |
        It is used for the first administrator recovery, recovery login when there is no account, and permission recovery.
        If the account system is configured at the same time, the server will preferentially try to map the current administrator key to the browser session with `builtin_admin`.
      operationId: createAdminKeySession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKeySessionRequest"
      responses:
        "200":
          description: Login successful and write httpOnly cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/login:
    post:
      tags:
        - Auth & Accounts
      summary: Establish an account session by using the email password
      description: |
        Ordinary account and administrator account unified use this 1 portal login.
        If the mailbox and password in the request match `STEAMHARNESS_BOOTSTRAP_ADMIN_EMAIL` / `STEAMHARNESS_BOOTSTRAP_ADMIN_PASSWORD`,
        The server creates this `builtin_admin` only while the account table is empty. Later logins verify the current database password and never overwrite a changed password or disabled state from environment variables.
        Accounts, password hashes, sessions, and invitations are stored in the PostgreSQL database selected by `STEAMHARNESS_DATABASE_URL`.
        Passwords use scrypt with random salts. The browser cookie stores only a signed refresh token and the database stores token hashes only.
      operationId: createPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: Login successful and write httpOnly cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/logout:
    post:
      tags:
        - Auth & Accounts
      summary: Clean up the current browser session
      operationId: logoutAuthSession
      security: []
      responses:
        "200":
          description: Attempts to clean cookies regardless of whether a session currently
            exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /api/auth/invitations/{token}:
    get:
      tags:
        - Auth & Accounts
      summary: Read account invitation metadata
      description: Returns the invited email, display name, 24-hour expiry, and
        optional acceptance time without exposing the stored token hash.
        Regenerating an invitation immediately invalidates its older link.
      operationId: getAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Returns invitation metadata used by the initial-password page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/invitations/{token}/accept:
    post:
      tags:
        - Auth & Accounts
      summary: Accept an account invitation and set the initial password
      description: Accepts the one-time invitation, sets the password, and revokes the
        account's existing browser sessions.
      operationId: acceptAccountInvitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptAccountInvitationRequest"
      responses:
        "200":
          description: Accepts the invitation, activates the account, and writes a 30-day
            httpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/start:
    post:
      tags:
        - Auth & Accounts
      summary: Create Device Login Request
      description: |
        CLI, Desktop, and Web first call this endpoint to obtain the device code, user code, and browser approval address,
        The `/login/device` approval is then accessed by the logged-in browser session.
      operationId: startDeviceFlow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowStartRequest"
      responses:
        "200":
          description: Returns the device code, verification code, and polling interval
            required for this device flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/token:
    post:
      tags:
        - Auth & Accounts
      summary: Poll device flow results and exchange for API Key
      description: |
        Continue to poll by `intervalSeconds` when returning to `authorization_pending`;
        When returning `slow_down`, `Retry-After` or `data.retryAfterSeconds` should be read for backoff;
        Returns `expired_token` to indicate that the current device code has expired or been consumed.
      operationId: pollDeviceFlowToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowTokenRequest"
      responses:
        "200":
          description: After the approval is successful, a one-time plaintext API Key and
            account information are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowTokenResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "428":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
        "503":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/approve:
    post:
      tags:
        - Auth & Accounts
      summary: Approve a device login in the browser
      operationId: approveDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: If the approval is successful, the polling end can then exchange
            the API Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/device/deny:
    post:
      tags:
        - Auth & Accounts
      summary: Deny device login once in browser
      operationId: denyDeviceFlow
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceFlowDecisionRequest"
      responses:
        "200":
          description: The request is rejected and the polling side receives
            `access_denied`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApprovalResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/me:
    get:
      tags:
        - Auth & Accounts
      summary: Read current account information
      operationId: getCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Returns the current principal and user profile; administrator-key
            login has a null `profile`. After successful Desktop API Key
            authentication, `principal.expiresAt` contains the sliding-renewal
            expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
    patch:
      tags:
        - Auth & Accounts
      summary: Update current account information
      operationId: updateCurrentAccount
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Returns the updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys:
    get:
      tags:
        - Auth & Accounts
      summary: List currently manageable API Keys
      operationId: listAccountApiKeys
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Ordinary users view their own API Key by default; administrators or
            principal with `api_keys.manage_all` can view all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: Create a new API Key
      operationId: createAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Returns a new API Key record and a clear-text token that is
            displayed only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "429":
          $ref: "#/components/responses/HarnessError"
  /api/auth/api-keys/{apiKeyId}:
    delete:
      tags:
        - Auth & Accounts
      summary: Undo a API key
      operationId: revokeAccountApiKey
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: Undo successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRevokeResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/permissions:
    get:
      tags:
        - Auth & Accounts
      summary: List permission groups and definitions
      operationId: listAccountPermissionGroups
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Returns the permissions registry used by the role editor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionGroupListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/roles:
    get:
      tags:
        - Auth & Accounts
      summary: List all global roles
      operationId: listAccountRoles
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Built-in roles and custom roles are returned uniformly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Auth & Accounts
      summary: Create a custom role
      operationId: createAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: The creation is successful and the role details are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/roles/{roleId}:
    patch:
      tags:
        - Auth & Accounts
      summary: Update role name, description, or permissions
      operationId: updateAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Returns the updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Auth & Accounts
      summary: Delete a custom role
      operationId: deleteAccountRole
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Deletion successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users:
    get:
      tags:
        - Auth & Accounts
      summary: List accounts and aggregate permissions summary
      operationId: listAccountUsers
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by mailbox, display name, or role name.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - disabled
              - invited
          description: Filter by Workflow account status.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitations:
    post:
      tags:
        - Auth & Accounts
      summary: Invite a new user
      operationId: inviteAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Returns the user profile and a complete Server-generated
            `/account/invite/:token` URL by default; compatible requests may
            still return temporary-password information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInvitationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/invitation-link/{userId}:
    get:
      tags:
        - Auth & Accounts
      summary: Regenerate an invitation link for an existing invited user
      operationId: regenerateAccountInvitationLink
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Returns a new 24-hour invitation URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInvitationLinkResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}:
    patch:
      tags:
        - Auth & Accounts
      summary: Update a user's mailbox, display name, temporary password, or
        start/stop status
      operationId: updateAccountUser
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: Returns the updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/auth/admin/users/{userId}/roles:
    put:
      tags:
        - Auth & Accounts
      summary: Override the role collection for the specified user
      operationId: replaceAccountUserRoles
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserRolesRequest"
      responses:
        "200":
          description: Returns a new aggregated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects:
    get:
      tags:
        - Admin Workflows
      summary: List workflow
      operationId: listWorkflows
      responses:
        "200":
          description: workflow Summary list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryListResponse"
    post:
      tags:
        - Admin Workflows
      summary: Atomically create a server project with a specified UUID
      description: |
        An authenticated user or administrator creates or recovers a same-UUID server project from the UUID in local
        `package.json.id`. `projectId`, `name`, `projectType`, and complete `projectInfo` containing
        `dataStorage.mode` are required; `projectCard` and `visibility` are optional. Server atomically stores the
        complete project declaration and records the creator as owner. It does not create a default record first,
        perform a second metadata synchronization, or accept project source. If the same account already manages
        the project, an identical UUID, name, and type recovers the binding and refreshes the declaration; other
        conflicts return `409`.
      operationId: createWorkflowProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowProjectRequest"
            example:
              projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
              name: "@steamharness/hello-workflow"
              projectType: workflow
              projectInfo:
                localizedNames: {}
                declarations: []
                platformSupport:
                  mode: agnostic
                dataStorage:
                  mode: both
              visibility: private
              projectCard:
                icon: workflow
                iconColor: "#ffffff"
                iconBackgroundColor: "#2563eb"
      responses:
        "201":
          description: Created or recovered successfully; returns the specified UUID,
            project type, complete declaration, and visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/project-storage:
    post:
      tags:
        - Admin Workflows
      summary: Access current-project or related-project storage
      description: |
        `context.storage.server.kv` and `context.storage.server.persistentValue` share this HTTP endpoint, while
        `storageKind` keeps them in mandatory separate storage domains. Scope is only `project` or `conversation`.
        A current-project request supplies `projectId`, and `entry.projectId` must match it. A related-project
        request supplies only `consumerProjectId` and alias, fixes `storageKind` to `kv`, and must not put a target
        UUID in the entry. Server resolves the target from both projects' current `projectInfo` and checks its grant
        on every operation.

        `get` requires read access to the consumer project; `set`, `compare-and-set` and `delete` require data write
        access to it. Related access does not require target-project membership. `compare-and-set` uses the
        revision returned by get and returns `{ applied: false }` on a mismatch. `delete` removes one existing
        entry and returns `{ removed: boolean }`; an absent entry returns `{ removed: false }` rather than an
        error. `knowledge-mutation` is restricted to current-project `persistent_value`, also requires
        project data write access, and updates Knowledge indexes and bodies in one PostgreSQL transaction.
      operationId: accessProjectStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStorageRequest"
            examples:
              getCurrentProjectKV:
                summary: Read current-project KV
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: kv
                  operation: get
                  entry:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    key: state
              setConversationPersistentValue:
                summary: Write current-conversation PersistentValue
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: set
                  entry:
                    scope: conversation
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    conversationId: thread-1
                    key: memory
                  value:
                    saved: true
                  source:
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                    runId: run-1
                    conversationId: thread-1
              compareAndSetRelatedKV:
                summary: Atomically update related-project KV through an alias
                value:
                  consumerProjectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  alias: inventory
                  storageKind: kv
                  operation: compare-and-set
                  entry:
                    scope: project
                    key: counter
                  expectedRevision: "42"
                  value: 2
              createKnowledgeDocument:
                summary: Transactionally create a Knowledge document
                value:
                  projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  storageKind: persistent_value
                  operation: knowledge-mutation
                  namespace:
                    scope: project
                    projectId: 8bd4fef2-e083-4201-a89f-6f7d0676df53
                  mutation:
                    type: create
                    input:
                      id: runbook
                      title: Runbook
                      markdown: "# Runbook"
      responses:
        "200":
          description: "get returns `{ exists, value?, revision? }`; set returns `{ ok:
            true }`; compare-and-set returns `{ applied, revision? }`;
            knowledge-mutation returns a document or deletion result."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStorageResponse"
        "400":
          description: The address, storageKind, scope, projectId binding, conversationId,
            key, value, expectedRevision, or knowledge-mutation input is
            invalid.
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          description: The caller lacks project read or data write access, the related
            grant is insufficient, or a project declaration forbids server
            storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
        "404":
          description: A related project is unavailable or pending confirmation, or the
            document selected by knowledge-mutation does not exist.
        "409":
          description: The document ID created by knowledge-mutation already exists.
        "501":
          description: The server does not have PostgreSQL storage enabled.
