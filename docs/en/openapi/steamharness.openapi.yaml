        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Projects & Groups
      summary: Generate Project Invitation Link
      operationId: createprojectInvitation
      description: >
        The owner / manager can generate a single valid invitation token that expires in 7 days. The owner
        role cannot be granted by invitation.

        API returns token only; the inviter needs to splice `${origin}/invite/${token}` and send the link to a
        colleague.
      parameters: *a4
      requestBody:
        required: true
