          description: Successful database management response.
          content:
            application/json:
              schema: {"type": "object", "additionalProperties": false, "properties": {"errCode": {"type": "integer", "const": 0}, "errMessage": {"type": "string", "const": ""}, "data": {"type": "null"}}, "required": ["errCode", "errMessage", "data"]}
