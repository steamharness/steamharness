    get:
      tags:
        - Admin Projects
      summary: Download an immutable source archive
      description: A successfully sent GET response adds one download to the exact returned version. latest counts
        toward the resolved version. HEAD, failed and interrupted responses are not counted.
      operationId: downloadProjectSourceArchive
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: Exact published version or latest. Draft is rejected.
