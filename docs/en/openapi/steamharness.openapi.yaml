  /api/projects/{projectId}/source-share:
    get:
      tags:
        - Admin Projects
      summary: Read static metadata for a shared version
      description: Requires sign-in and separate source download permission, including project-level source grants.
        Reads an exact published version without loading project code or counting a download. Web share links
        use /share/projects/{projectId}/{version} and contain no credentials or additional grants.
      operationId: getProjectSourceShare
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          required: true
          description: An exact published version; latest and draft are rejected.
          schema:
            type: string
            pattern: ^\d+\.\d+\.\d+$
      responses:
        "200":
          description: Authorized version metadata with Cache-Control set to no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceShareResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          description: 需要项目访问权限。data.requestUrl 返回短期同源申请链接，批准后成为访客。 / Access required; data.requestUrl provides a
            short-lived request link for guest membership.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: integer
                    const: 403
                  errMessage:
                    type: string
                  data:
                    type: object
                    properties:
                      requestUrl:
                        type: string
                        format: uri
                    required:
                      - requestUrl
                required:
                  - errCode
                  - errMessage
                  - data
        "404":
          $ref: "#/components/responses/HarnessError"
