            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInfoUpdateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/info:
