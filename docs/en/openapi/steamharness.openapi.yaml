components:
  securitySchemes:
    MemoryManagementAuth:
      type: http
      scheme: bearer
      description: Independent shma_ account memory credential issued only by password or device login and retained in the trusted host. Existing project API keys are not accepted.
    MemoryRuntimeAuth:
      type: http
      scheme: bearer
      description: Short-lived shmu_ grant restricted to personal global and the host-selected current project or directory. Account identity and allowed scopes are resolved by Server.
    BearerAuth:
      type: http
      scheme: bearer
      description: Use `STEAMHARNESS_SERVER_ADMIN_KEY` or the created account API Key.
    SessionCookie:
      type: apiKey
      in: cookie
      name: steamharness_auth_session
      description: A httpOnly browser session established by password login or administrator key login.
  parameters:
    ProjectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
      example: smoke
    TargetQuery:
      name: target
      in: query
      required: false
      schema:
        type: string
        default: draft
      example: latest
    KanbanConfigurationId:
      name: configurationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelatedProjectAlias:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,63}$
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
      example: api-key-001
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      example: user-001
  responses:
    HarnessError:
      description: steamharness standard error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
  schemas:
    MemoryResponse:
      type: object
      required: [errCode, errMessage, data]
      properties:
        errCode: {type: integer, const: 0}
        errMessage: {type: string, const: ""}
        data:
          description: Operation result; lists return items, nextCursor and permission-filtered locked counts. Capabilities return connected, enabled, status, automatic, readOnly, currentScope and scopes.
    MemoryCapabilitiesResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data:
              type: object
              required: [connected, enabled, status, automatic, readOnly, scopes]
              properties:
                connected: {type: boolean}
                enabled: {type: boolean}
                status: {type: string, enum: [ready, unavailable, unconfigured]}
                automatic: {type: boolean}
                readOnly: {type: boolean}
                currentScope: {type: string}
                scopes:
                  type: array
                  items: {type: string}
    MemoryListResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data:
              type: object
              required: [items, locked]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: {$ref: "#/components/schemas/AccountMemoryRecord"}
                nextCursor: {type: string}
                locked:
                  type: object
                  description: Unfiltered counts only; omitted during keyword searches. No locked content or source text is returned.
                  additionalProperties: {type: integer, minimum: 0}
    MemoryRecordResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AccountMemoryRecord"}
    MemoryMutationResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/AccountMemoryRecord"
                - type: object
                  description: Replaying a completed write after forgetting returns only a tombstone.
                  required: [id, deleted]
                  properties:
                    id: {type: string}
                    deleted: {type: boolean, const: true}
    MemoryRecallResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data:
              type: array
              maxItems: 8
              items: {$ref: "#/components/schemas/AccountMemoryRecord"}
    MemoryPreferencesResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/MemoryPreferences"}
    MemoryTurnResponse:
      allOf:
        - $ref: "#/components/schemas/MemoryResponse"
        - type: object
          properties:
            data:
              type: object
              required: [accepted]
              properties:
                accepted: {type: boolean}
                jobId: {type: string}
    AccountMemoryRecord:
      type: object
      required: [id, scope, content, origin, version, updatedAt, sources]
      properties:
        id: {type: string}
        scope: {type: string, description: "global, project:<business ID>, or directory:<host registered UUID>"}
        content: {type: string, maxLength: 16000}
        origin: {type: string, enum: [manual, automatic]}
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
        sources:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              role: {type: string}
              content: {type: string}
    MemoryOperation:
      type: object
      required: [operationId]
      properties:
        operationId: {type: string, minLength: 1, maxLength: 200, description: "Stable per user operation; reuse with different content returns 409."}
    MemoryCreate:
      allOf:
        - $ref: "#/components/schemas/MemoryOperation"
        - type: object
          required: [scope, content]
          properties:
            scope: {type: string}
            content: {type: string, minLength: 1, maxLength: 16000}
    MemoryEdit:
      allOf:
        - $ref: "#/components/schemas/MemoryOperation"
        - type: object
          required: [version, content]
          properties:
            version: {type: integer, minimum: 1}
            content: {type: string, minLength: 1, maxLength: 16000}
    MemoryClear:
      allOf:
        - $ref: "#/components/schemas/MemoryOperation"
        - type: object
          required: [scope]
          properties:
            scope: {type: string}
    MemoryPreferences:
      type: object
      required: [enabled, automatic]
      properties:
        enabled: {type: boolean}
        automatic: {type: boolean}
    MemoryGrant:
      type: object
      description: Manager only. Select a business project scope or register a host directory. Returns token (shmu_), scope and expiresAt; grants expire after five minutes and cannot create new grants.
      properties:
        scope: {type: string}
        directory: {type: boolean}
        directoryId: {type: string, format: uuid}
        label: {type: string, maxLength: 200}
        readOnly: {type: boolean, default: false}
    MemoryRecall:
      type: object
      required: [query]
      properties:
        query: {type: string}
    MemoryTurn:
      type: object
      required: [turnId, messages]
      description: Scoped write grant only. Stable IDs are required. Only persisted user text and the final assistant answer are allowed; no reasoning, tool results or recall injection.
      properties:
        turnId: {type: string, minLength: 1, maxLength: 160}
        messages:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [id, role, content, timestamp]
            properties:
              id: {type: string}
              role: {type: string, enum: [user, assistant]}
              content: {type: string, maxLength: 100000}
              timestamp: {type: number}
    ApiSuccessBase:
      type: object
      properties:
        errCode:
          type: integer
          const: 0
        errMessage:
          type: string
          const: ""
      required:
        - errCode
        - errMessage
    ApiFailure:
      type: object
      properties:
        errCode:
          type: integer
        errMessage:
          type: string
        data: {}
      required:
        - errCode
        - errMessage
    PermissionKey:
      type: string
      enum:
        - system.admin
      description: 仅用于系统管理，不表示项目业务权限。 / System administration only.
    AuthPrincipalKind:
      type: string
      enum:
        - admin_key
        - admin_session
        - user_session
        - api_key
    UserProfileStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
    AuthPrincipal:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/AuthPrincipalKind"
        userId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        apiKeyId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: The current API Key expiration. A successfully authenticated Desktop Key uses sliding renewal.
        isSystemAdmin:
          type: boolean
      required:
        - kind
        - isSystemAdmin
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        isSystemAdmin:
          type: boolean
      required:
        - userId
        - email
        - displayName
        - status
        - createdAt
        - updatedAt
        - isSystemAdmin
    ApiKeyRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        prefix:
          type: string
        source:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        lastUsedIp:
          type: string
        userAgent:
          type: string
      required:
        - id
        - userId
        - name
        - prefix
        - source
        - scopes
        - createdAt
    DeviceCodeResult:
      type: object
      properties:
        id:
          type: string
        userCode:
          type: string
        clientName:
          type: string
        source:
          type: string
        requestedScopes:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - denied
            - expired
            - consumed
        requestedByIp:
          type: string
        userAgent:
          type: string
        expiresAt:
          type: string
          format: date-time
        intervalSeconds:
          type: integer
        approvedAt:
          type: string
          format: date-time
        approvedByUserId:
          type: string
        deniedAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            apiKeyId:
              type: string
            user:
              $ref: "#/components/schemas/AuthUserInfo"
            expiresAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userCode
        - clientName
        - source
        - requestedScopes
        - state
        - expiresAt
        - intervalSeconds
        - createdAt
        - updatedAt
    AdminUserSummary:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        lastSignInAt:
          type: string
          format: date-time
        createdAt:
