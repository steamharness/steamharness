  /api/projects/{projectId}/project-group-download:
    get:
      tags:
        - Admin Workflows
      summary: Download the exact project group source code
      description: |
        The root project and included dependencies with permissions are returned by the exact version in the dependency lock. No permission dependency will be included.
        `skippedDependencies`, does not fall back to latest; the response does not contain any KV, PersistentValue, CLI login credentials
        or other host data. Included dependencies follow the exact lock, source permission, and retained-source state. The client must recompute each
        `sourceHash` from file paths and original bytes before writing to disk.
        A successfully sent GET response adds one download to each exact project version actually returned,
        deduplicated within the response. Skipped dependencies are not counted. HEAD, failed and interrupted responses are not counted.
      operationId: downloadWorkflowProjectGroup
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: Exact version or `latest` has been published; `draft` is not
            accepted.
