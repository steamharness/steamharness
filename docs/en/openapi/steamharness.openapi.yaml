      description: Explicitly reauthorizes a failed job with the current management login after checking the original scope, account preferences and extraction availability. Preserves task identity, cached candidates and the original scope snapshot to prevent old tasks from undoing edits or clears. Missing or other-account jobs return 404; locked scopes return 403; disabled automatic saving or an unconfigured extraction model returns 409. Repeated requests for an already pending, running or completed job do not enqueue duplicate work.
