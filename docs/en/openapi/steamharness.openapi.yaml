                sourceTarget:
                  type: string
                  example: latest
                groupId:
                  type:
                    - string
                    - "null"
              not:
                anyOf:
                  - required:
                      - targetProjectName
                  - required:
                      - projectId
      responses:
        "200":
          description: Clone the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloneProjectResultResponse"
  /api/projects/{projectId}/project-info:
