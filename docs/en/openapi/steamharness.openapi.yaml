                $ref: "#/components/schemas/ProjectCardImageResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "413":
          $ref: "#/components/responses/HarnessError"
        "415":
