        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "501":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/source-files:
    get:
      tags:
        - Admin Projects
      summary: Download a localizable snapshot of the published source code
      description: Download a published immutable source snapshot with separate source download permission. No
        platform restriction. A successfully sent GET response adds one download to the exact returned
        version. HEAD, failed and interrupted responses are not counted.
      operationId: getDownloadableSourceFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: Exact published version or latest. Draft is rejected.
          schema:
            type: string
            default: latest
      responses:
        "200":
          description: List of source files that can be used to create local projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadableSourceFilesResultResponse"
        "403":
          description: The current identity does not have permission to download the project source code.
        "409":
          description: Published source snapshot is unavailable.
  /project-card-images/{projectId}/{fileName}:
    get:
      tags:
        - Admin Projects
      summary: Read public project card picture
      description: Reads immutable WebP saved by content hash for project lists and Desktop surfaces.
      security: []
      operationId: getProjectCardImage
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.webp$
      responses:
        "200":
          description: Project card WebP picture, response can be long-term public cache.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: The picture does not exist.
  /storage/avatars/{userId}/{fileName}:
    get:
      tags:
        - Admin Account
      summary: Read a public avatar from local object storage
      description: Mounted only when Server runs with STEAMHARNESS_STORAGE_DRIVER=local. It serves immutable avatars
        addressed by content hash; the route serves avatars only, and `storage/workflows/**` and
        `storage/writer-artifacts/**` are never reachable through it.
      security: []
      operationId: getLocalStorageAvatar
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9-]{1,64}$
        - name: fileName
          in: path
