      required:
        - storageKind
        - scope
        - key
        - valueType
        - valueSizeBytes
        - valuePreview
        - projectId
        - updatedAt
    KVEntryDetail:
      allOf:
        - $ref: "#/components/schemas/KVEntrySummary"
        - type: object
          properties:
            value:
              description: The full KV value. Only the single details interface returns this
                field, and the list interface does not return this field.
          required:
            - value
    ProjectDataSummary:
      type: object
      properties:
        kv:
          type: object
          properties:
            entryCount:
              type: integer
              minimum: 0
            projectEntryCount:
              type: integer
              minimum: 0
            conversationEntryCount:
              type: integer
              minimum: 0
            valueSizeBytes:
              type: integer
              minimum: 0
              description: Sum of PostgreSQL pg_column_size for stored values, excluding
                indexes.
            textCharacterCount:
              type: integer
              minimum: 0
              description: Total Unicode code points in string values, excluding JSON text for
                objects and arrays.
            updatedAt:
              oneOf:
                - type: string
                  format: date-time
                - type: "null"
          required:
            - entryCount
            - projectEntryCount
            - conversationEntryCount
            - valueSizeBytes
            - textCharacterCount
            - updatedAt
        knowledge:
          type: object
          properties:
            documentCount:
              type: integer
              minimum: 0
              description: Number of valid documents, excluding indexes and deletion markers.
            characterCount:
              type: integer
              minimum: 0
              description: Total Unicode code points in Markdown content.
            lineCount:
              type: integer
              minimum: 0
              description: Sum of newline counts plus one per document. An empty document
                counts as one line.
            markdownSizeBytes:
              type: integer
              minimum: 0
              description: Total UTF-8 bytes in Markdown content.
            updatedAt:
              oneOf:
                - type: string
                  format: date-time
                - type: "null"
          required:
            - documentCount
            - characterCount
            - lineCount
            - markdownSizeBytes
            - updatedAt
      required:
        - kv
        - knowledge
    ProjectDataSummaryResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ProjectDataSummary"
          required:
            - data
    KVEntryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KVEntrySummary"
        nextCursor:
          type: string
        hasMore:
          type: boolean
        total:
          type: integer
      required:
        - items
        - hasMore
        - total
    KVEntryPageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/KVEntryPage"
          required:
            - data
    KVEntryDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/KVEntryDetail"
          required:
            - data
    ProjectStorageScope:
      type: string
      enum:
        - project
        - conversation
    ProjectStorageEntry:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/ProjectStorageScope"
        key:
          type: string
        projectId:
          type: string
          format: uuid
          description: Required for current-project requests and must equal the top-level
            projectId; forbidden for related-project requests.
        conversationId:
          type: string
      required:
        - scope
        - key
    ProjectStorageSource:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: Must equal projectId for current access or consumerProjectId for
            related-project access.
        runId:
          type: string
        conversationId:
          type: string
    ProjectStorageRequest:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: Current project UUID; mutually exclusive with consumerProjectId and
            alias.
        consumerProjectId:
          type: string
          format: uuid
          description: Consumer project UUID for related-project access; must be provided
            with alias.
        alias:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          description: Related-project alias declared by the consumer; Server resolves the
            target UUID.
        storageKind:
          type: string
          enum:
            - kv
            - persistent_value
        operation:
          type: string
          enum:
            - get
            - set
            - compare-and-set
            - delete
            - knowledge-mutation
        entry:
          $ref: "#/components/schemas/ProjectStorageEntry"
        value:
          description: Set and compare-and-set operations are required; must be JSON value
            and cannot be omitted.
        expectedRevision:
          type:
            - string
            - "null"
          description: compare-and-set operation is required. The revision returned by the
            pass-in get; null is passed when no value is first created.
        source:
          $ref: "#/components/schemas/ProjectStorageSource"
        namespace:
          $ref: "#/components/schemas/ProjectStorageKnowledgeNamespace"
        mutation:
          $ref: "#/components/schemas/ProjectStorageKnowledgeMutation"
      required:
        - storageKind
        - operation
      oneOf:
        - required:
            - projectId
          not:
            anyOf:
              - required:
                  - consumerProjectId
              - required:
                  - alias
        - required:
            - consumerProjectId
            - alias
          not:
            required:
              - projectId
    ProjectStorageKnowledgeNamespace:
      type: object
      properties:
        scope:
          type: string
          const: project
        projectId:
          type: string
          format: uuid
          description: Must equal the request projectId.
      required:
        - scope
        - projectId
    ProjectStorageKnowledgeMutation:
      type: object
      properties:
        type:
          type: string
          enum:
            - create
            - edit
            - delete
        input:
          oneOf:
            - $ref: "#/components/schemas/CreateKnowledgeDocumentInput"
            - $ref: "#/components/schemas/ProjectStorageKnowledgeEditInput"
            - $ref: "#/components/schemas/ProjectStorageKnowledgeDeleteInput"
      required:
        - type
        - input
    ProjectStorageKnowledgeEditInput:
      type: object
      properties:
        documentId:
          type: string
        title:
          type: string
        markdown:
          type: string
      required:
        - documentId
      anyOf:
        - required:
            - title
        - required:
            - markdown
    ProjectStorageKnowledgeDeleteInput:
      type: object
      properties:
        documentId:
          type: string
      required:
        - documentId
    ProjectStorageGetResult:
      type: object
      properties:
        exists:
          type: boolean
        value:
          description: The JSON value returned if exists is true.
        revision:
          type: string
          description: The opaque current row version token returned if exists is true;
            the compare-and-set must be passed back as is.
      required:
        - exists
    ProjectStorageSetResult:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    ProjectStorageCompareAndSetResult:
      type: object
      properties:
        applied:
          type: boolean
          description: Whether the current revision is still matched and successfully
            written.
        revision:
          type: string
          description: The new row version token after writing when the applied is true.
      required:
        - applied
    ProjectStorageKnowledgeMutationResult:
      oneOf:
        - $ref: "#/components/schemas/KnowledgeDocument"
        - $ref: "#/components/schemas/DeleteKnowledgeDocumentResult"
    ProjectStorageResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              oneOf:
                - $ref: "#/components/schemas/ProjectStorageGetResult"
                - $ref: "#/components/schemas/ProjectStorageSetResult"
                - $ref: "#/components/schemas/ProjectStorageCompareAndSetResult"
                - $ref: "#/components/schemas/ProjectStorageKnowledgeMutationResult"
          required:
            - data
    KnowledgeDocumentSummaryRecord:
      type: object
