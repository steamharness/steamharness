            type: string
            pattern: ^[a-f0-9]{64}\.webp$
      responses:
        "200":
          description: Project card WebP picture, response can be long-term public cache.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: The picture does not exist.
  /storage/avatars/{userId}/{fileName}:
    get:
      tags:
        - Admin Account
      summary: Read a public avatar from local object storage
      description: Mounted only when Server runs with STEAMHARNESS_STORAGE_DRIVER=local.
        It serves immutable avatars addressed by content hash; the route serves
        avatars only, and `storage/workflows/**` and
        `storage/writer-artifacts/**` are never reachable through it.
      security: []
      operationId: getLocalStorageAvatar
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9-]{1,64}$
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}\.(png|jpe?g|gif|webp)$
      responses:
        "200":
          description: The avatar image. The response may be publicly cached for a long
            time.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: The avatar does not exist.
  /api/projects/files/{fileId}:
    get:
      tags:
        - Admin Files
      summary: Read or download project files
      operationId: getWorkflowFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: The contents of the file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    delete:
      tags:
        - Admin Files
      summary: Delete project file
      operationId: deleteWorkflowFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete the result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                    required:
                      - data
  /api/projects/{projectId}/kanban:
    get:
      tags:
        - Admin Workflows
      summary: Read Kanban Workspace
      description: |
        Read fixed target static product directories, HTML entries, manifests, named configurations for current user isolation, and short-term preview capability.
        A parameterized project creates a "default configuration" atomically the first time it is read; a parameterless project returns an empty configuration list.
      operationId: getKanbanWorkspace
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: Kanban workspace and short-term preview address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/bridge:
    post:
      tags:
        - Admin Workflows
      summary: Call Kanban project data Bridge
      description: |
        Project readers may perform read operations; writes require project management access. Server first verifies that target
        resolves to a Kanban project, then pins current-project operations to the path projectName and project scope.
        A related-project operation accepts only alias and key. Server resolves the target UUID from the fixed version
        and rereads both current declarations to check the target's grant to the Kanban. A request cannot specify a
        project UUID, scope, database path, or release version.
        File operations use the path-bound project's managed Server storage without requiring uploaded preview artifacts
        or a version target. files.createFile accepts name, optional mimeType, and base64 up to 50 MiB; readFile/deleteFile
        accept only fileId and reject other projects or conversation-scoped files. readFile returns file and base64.
      operationId: invokeKanbanBridge
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanStudioBridgeRequest"
      responses:
        "200":
          description: Bridge operation result; data can be omitted for KV that does not
            exist, and null is returned for knowledge documents that do not
            exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBridgeResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "500":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/related-project-revisions:
    get:
      tags:
        - Admin Workflows
      summary: Subscribe to Server Web Kanban related-project revisions
      description: |
        Server-Sent Events returns a full snapshot and subsequent changes for direct related projects. Server resolves
        the exact Kanban version from target and rereads both current declarations to verify the relation and read grant.
        Revocation or an invalid relation sends `unavailable` and closes the stream. A revision is opaque and contains
        no target-project ID, KV key, scope, or database path.
      operationId: streamKanbanRelatedProjectRevisions
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: SSE streams; connections and reconnections send snapshot first,
            followed by revision and heartbeat.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: snapshot
                data: {"resolvedTarget":"0.3.0","revisions":[{"alias":"stocks","revision":"42"}]}

                event: revision
                data: {"alias":"stocks","revision":"43"}

                event: heartbeat
                data: {"timestamp":"2026-08-04T02:00:00.000Z"}
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/previews/{capability}/{nonce}/{target}/{assetPath}:
    get:
      tags:
        - Admin Workflows
      summary: Read capability-protected Kanban static resources
      description: |
        Uses the short-lived capability issued by the workspace endpoint to read resources from a fixed version. `assetPath` may be
        the configured HTML entry or a multi-segment relative path inside the artifact directory. Directory traversal, symbolic links,
        sensitive files, and files outside that directory are rejected. The HTML entry injects the configuration and project-data Bridge
        with a nonce and returns an offline CSP limited to same-artifact resources, data, and blob URLs. The capability itself is a temporary
        credential scoped to the project, user, fixed target, and expiration time, so a sandboxed iframe can load ES modules, WASM, and
        project data files without a login cookie or API key. Other project APIs still require login authentication.
      security: []
      operationId: getKanbanPreviewAsset
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: capability
          in: path
          required: true
          schema:
            type: string
        - name: nonce
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML, CSS, JavaScript, images, fonts, or other allowed static
            resources from the project.
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            text/html: {}
            text/css: {}
            application/javascript: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/configurations:
    post:
      tags:
        - Admin Workflows
      summary: New or Copy Kanban Configuration
      operationId: createKanbanConfiguration
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanCreateConfigurationRequest"
      responses:
        "201":
          description: The status of the complete configuration after creation; the new
            configuration also becomes the active configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceStateResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/configurations/{configurationId}:
    patch:
      tags:
        - Admin Workflows
      summary: Rename Kanban configuration or save parameter values
      operationId: updateKanbanConfiguration
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/KanbanConfigurationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanPatchConfigurationRequest"
      responses:
        "200":
          description: The full configuration status after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceStateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Admin Workflows
      summary: Delete Kanban Configuration
      description: The last configuration cannot be deleted; deleting the active
        configuration selects the first remaining configuration.
      operationId: deleteKanbanConfiguration
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/KanbanConfigurationId"
        - $ref: "#/components/parameters/TargetQuery"
      responses:
        "200":
          description: Full configuration status after deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceStateResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/active-configuration:
    put:
      tags:
        - Admin Workflows
      summary: Toggle Active Kanban Configuration
      operationId: selectKanbanConfiguration
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanSelectConfigurationRequest"
      responses:
        "200":
          description: The full configuration status after the switchover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceStateResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/draft/files:
    put:
      tags:
        - Admin Workflows
      summary: Save server draft file
      operationId: saveWorkflowDraftFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
