          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/publish:
    post:
      tags:
        - Admin Projects
      summary: Publish a project version
      description: Publish the draft package version as an immutable source snapshot and update latest. Duplicate
        versions return 409. Project code is never installed, built or loaded.
      operationId: publishProject
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: 初始发布
                expectedVersion:
                  type: string
                  description: Optional expected draft version. A mismatch returns 409 to prevent publishing a replaced draft.
                  pattern: ^\d+\.\d+\.\d+$
                expectedSourceHash:
                  type: string
                  description: Prepared source hash, required with configuration publication drafts. Changed source returns 409
