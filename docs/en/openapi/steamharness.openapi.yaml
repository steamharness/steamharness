                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                          role:
                            $ref: "#/components/schemas/ProjectRole"
                        required:
                          - userId
                          - role
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Projects & Groups
      summary: Delete Project Members
      operationId: removeprojectMember
      description: 有效角色取项目直接角色、所属组及全部祖先组角色的最高值。维护者只能管理有效角色低于维护者的用户，且只能授予访客或开发者；所有者可管理全部角色。删除直接成员不影响继承权限，最后一名活跃所有者不可删除或降级。
        / Effective access is the maximum direct and inherited role. Maintainers manage only lower roles.
        Owners manage all roles; the last active owner is protected.
      parameters:
        - *a3
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Delete the result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          removed:
                            type: boolean
                        required:
                          - removed
                    required:
                      - data
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/invitations:
    get:
      tags:
        - Projects & Groups
      summary: List project invitations
      operationId: listprojectInvitations
      description: 维护者仅可列出访客和开发者邀请；所有者与系统管理员可列出全部角色邀请。 / Maintainers can list guest and developer invitations only;
        owners and system administrators can list every role.
