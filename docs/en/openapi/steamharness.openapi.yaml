  /api/projects/{projectId}/kanban:
    get:
      tags:
        - Admin Projects
      summary: Read Kanban Workspace
      description: >
        Read fixed target static product directories, HTML entries, manifests, named configurations for
        current user isolation, and short-term preview capability.

        A parameterized project creates a "default configuration" atomically the first time it is read; a
        parameterless project returns an empty configuration list.
      operationId: getKanbanWorkspace
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: &a2
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,63}$
      responses:
        "200":
          description: Kanban workspace and short-term preview address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanWorkspaceResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/bridge:
    post:
      tags:
        - Admin Projects
      summary: Call Kanban project data Bridge
      description: Use entryId for the registered Kanban entry. Data and attachment calls require input.database and
        current project and space authorization. target selects a static declaration version; draft data
        access can use a registered entry before source upload. No project execution occurs.
      operationId: invokeKanbanBridge
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KanbanStudioBridgeRequest"
      responses:
        "200":
          description: Bridge operation result; data can be omitted for KV that does not exist, and null is returned for
            knowledge documents that do not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanBridgeResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "500":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/kanban/previews/{capability}/{nonce}/{target}/{assetPath}:
    get:
      tags:
        - Admin Projects
      summary: Read capability-protected Kanban static resources
      description: >
        Uses the short-lived capability issued by the workspace endpoint to read resources from a fixed
        version. `assetPath` may be

        the configured HTML entry or a multi-segment relative path inside the artifact directory. Directory
        traversal, symbolic links,

        sensitive files, and files outside that directory are rejected. The HTML entry injects the
        configuration and project-data Bridge

        with a nonce and returns an offline CSP limited to same-artifact resources, data, and blob URLs. The
        capability itself is a temporary

        credential scoped to the project, user, fixed target, and expiration time, so a sandboxed iframe can
        load ES modules, WASM, and

        project data files without a login cookie or API key. Other project APIs still require login
        authentication.
      security: []
      operationId: getKanbanPreviewAsset
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: capability
          in: path
          required: true
          schema:
            type: string
        - name: nonce
          in: path
          required: true
          schema:
            type: string
        - name: target
          in: path
          required: true
          schema:
            type: string
        - name: assetPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML, CSS, JavaScript, images, fonts, or other allowed static resources from the project.
          headers:
            Content-Security-Policy:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Access-Control-Allow-Origin:
              schema:
                type: string
                const: "*"
          content:
            text/html: {}
            text/css: {}
            application/javascript: {}
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/template:
    get:
      tags:
        - Admin Projects
      summary: Read an immutable published configuration template
      operationId: getProjectConfigurationTemplate
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: Version template with filtered fields, values, rules and attachment hashes. Requires project read
            or source-download permission. Missing templates return null data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ProjectConfigurationTemplate"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files:
    post:
      tags:
        - Admin Projects
      summary: Upload a personal configuration attachment after checking field permissions
      operationId: uploadProjectConfigurationFile
      description: Set target to the installed published version to check its field permissions. Omitting target
        uses the author's draft or the recipient's latest published template.
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: query
          name: key
          required: true
          schema:
            type: string
        - in: query
          name: fileName
          required: true
          schema:
            type: string
        - in: query
          name: mimeType
          required: true
          schema:
            type: string
        - in: query
          name: field
          description: Optional JSON descriptor for a local custom file field; never overrides an author field. At most
            8192 characters.
          schema:
            type: string
            maxLength: 8192
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: One server file reference. Uploads are account isolated and limited to 50 MiB; save the returned
            reference in a separate configuration mutation.
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations/files/{fileId}:
    get:
      tags:
        - Admin Projects
      summary: Read an allowed personal or immutable version attachment
      operationId: readProjectConfigurationFile
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - in: path
          name: fileId
          required: true
          schema:
            type: string
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: File bytes. Source-download access grants only the template attachments; personal uploads are
            restricted to their uploading account.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/configurations:
    get:
      tags:
        - Admin Projects
      summary: Read account-scoped configurations for any project type
      description: Requires project read or source-download access and an account identity. Values are isolated by
        project and account. Download access only exposes the version template and permitted personal values.
        Official drafts require the actual original owner or an administrator. The Server never executes
        project code. A temporary role fallback changes the response view while preserving the account's
        saved selection; access recovery reuses it. Saving fallback values preserves that selection,
        while an explicit select action updates it.
      operationId: getProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/TargetQuery"
        - name: entryId
          in: query
          required: true
          schema: *a2
      responses:
        "200":
          description: Current fields, profiles, selection and revision. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Admin Projects
      summary: Manage or export account-scoped project configurations
      description: Mutations require the queried revision. Imports and path permission checks are atomic. Exports
        contain all readable effective values, including sensitive fields. The last personal profile cannot be
        deleted. publication.save manages an online author draft using its own revision, and
        publication.preview filters an optional draft without saving. Both require the original owner or an
        administrator. Client role fields never grant ownership.
      operationId: manageProjectConfigurations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  default: draft
                call:
                  $ref: "#/components/schemas/ProjectConfigurationAction"
                entryId: *a2
              required:
                - call
                - entryId
      responses:
        "200":
          description: Committed state, or portable export for the export action. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigurationResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: Revision conflict; data.code is CONFIGURATION_CONFLICT and no mutation was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/projects/{projectId}/draft/files:
    put:
      tags:
        - Admin Projects
      summary: Save server draft file
      operationId: saveDraftFiles
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/SourceFileInput"
                removePaths:
                  type: array
                  items:
                    type: string
              required:
                - files
      responses:
        "200":
          description: Static file save result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveDraftFilesResultResponse"
  /api/projects/{projectId}/clone:
    post:
      tags:
        - Admin Projects
      summary: Clone a project
      description: Source download access includes published versions only. Cloning draft additionally requires
        management access to the original project. Owning the copy never grants configuration publication
        access to the original. The Server assigns a fresh target UUID; targetProjectName and projectId are
        rejected.
      operationId: cloneProject
