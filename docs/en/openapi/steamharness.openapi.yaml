          type: string
      required:
        - editable
    ProjectConfigurationField:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_.-]{0,199}$
        type:
          type: string
          enum:
            - string
            - number
            - boolean
            - json
            - file
        label:
          type: string
        description:
          type: string
        defaultValue:
          description: Native JSON default. Never store real secrets in source declarations.
        required:
          type: boolean
        secret:
          type: boolean
        multiple:
          type: boolean
          description: String arrays for string fields; up to 32 server file references for file fields.
        control:
          type: string
          enum:
            - text
            - textarea
            - select
            - radio
            - checkboxes
            - ai-models
            - agent-model
          description: ai-models is reserved for the STEAMHARNESS_AGENT_MODELS JSON field. Entries contain id, name,
            model and source. System entries use credentialId; third-party entries use apiKind, baseUrl and
            apiKey. Values are private unless explicitly included in publication.
            agent-model is a non-secret, single string selector without static options. Empty follows the main
            model; otherwise the value is one stable ID from STEAMHARNESS_AGENT_MODELS.
        allowThirdParty:
          type: boolean
          description: Only valid for ai-models. Set false in configuration.json to allow only system AI. Saves and
            imports cannot add third-party entries or relax the project's declared policy. Omitted or true
            allows both sources.
        accept:
          type: array
          description: File fields only. Accepted MIME types or extensions. Files upload through POST
            /api/projects/{projectId}/configurations/files and values contain server metadata, never file
            bytes.
          items:
            type: string
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
            required:
              - value
        sharing:
          $ref: "#/components/schemas/ConfigurationSharingRule"
        paths:
          type: object
          description: JSON Pointer rules, inherited from the parent with more specific rules taking precedence.
            Excluding the whole field excludes every descendant.
          additionalProperties:
            $ref: "#/components/schemas/ConfigurationSharingRule"
        omittedPaths:
          description: Generated opaque deny hashes for omitted JSON paths, without private path names.
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
      required:
        - name
        - type
