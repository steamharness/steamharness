        requestId:
          type: string
          minLength: 1
        operation:
          type: string
          enum:
            - runtime.getLocale
            - files.createFile
            - files.readFile
            - files.deleteFile
            - kv.getValue
            - kv.setValue
            - knowledge.listDocuments
            - knowledge.getDocument
            - knowledge.createDocument
            - knowledge.editDocument
            - knowledge.deleteDocument
            - knowledge.searchDocuments
            - knowledge.readDocumentLines
            - database.revision
        input:
          type: object
          additionalProperties: true
      required:
        - requestId
        - operation
        - input
