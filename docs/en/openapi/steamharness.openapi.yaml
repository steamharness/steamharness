              schema:
                $ref: "#/components/schemas/ProjectInfoUpdateResultResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/info:
    patch:
      tags:
        - Admin Workflows
      summary: Update workflow display information
      operationId: updateWorkflowInfo
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  example: latest
                displayName:
                  type: string
                  example: Smoke Workflow
              required:
                - displayName
      responses:
        "200":
          description: Update the results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateWorkflowInfoResultResponse"
  /api/projects/{projectId}:
    delete:
      tags:
        - Admin Workflows
      summary: Delete workflow
      operationId: deleteWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: Delete the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteWorkflowResultResponse"
  /api/projects/{projectId}/publish:
    post:
      tags:
        - Admin Workflows
      summary: Publish workflow version
      description: Publish the draft package version as an immutable source snapshot
        and update latest. Duplicate versions return 409. Project code is never
        installed, built or loaded.
      operationId: publishWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseLog:
                  type: string
                  example: Initial Release
                expectedVersion:
                  type: string
                  description: Optional expected draft version. A mismatch returns 409 to prevent
                    publishing a replaced draft.
                  pattern: '^\d+\.\d+\.\d+$'
                expectedSourceHash:
                  type: string
                  description: Optional sourceHash from upload preparation. Changed source returns
                    409 without creating a version.
                  pattern: '^[a-f0-9]{64}$'
      responses:
        "200":
          description: Publish the results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResultResponse"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/members:
    get:
      tags:
        - Admin Workflows
      summary: List Project Members
      operationId: listWorkflowProjectMembers
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: The owner/manager/writer/viewer member list of the current project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/members/{userId}:
    put:
      tags:
        - Admin Workflows
      summary: Set up project member roles
      description: |
        owner and manager can grant manager/writer/viewer; this interface does not support transferring owners.
        manager also cannot promote other members to owner.
      operationId: setWorkflowProjectMember
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/ProjectRole"
              required:
                - role
            example:
              role: writer
      responses:
        "200":
          description: The updated member record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
    delete:
      tags:
        - Admin Workflows
      summary: Delete Project Members
      operationId: deleteWorkflowProjectMember
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Delete the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/invitations:
    get:
      tags:
        - Admin Workflows
      summary: List project invitations
      operationId: listWorkflowProjectInvitations
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: All invitation records under the project, including pending /
            accepted / revoked/expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationListResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
    post:
      tags:
        - Admin Workflows
      summary: Generate Project Invitation Link
      description: |
        The owner / manager can generate a single valid invitation token that expires in 7 days. The owner role cannot be granted by invitation.
        API returns token only; the inviter needs to splice `${origin}/invite/${token}` and send the link to a colleague.
      operationId: createWorkflowProjectInvitation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/InvitationRole"
              required:
                - role
            example:
              role: viewer
      responses:
        "201":
          description: The creation is successful. The data contains the invitation record
            and the token issued by the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationCreateResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/invitations/{invitationId}:
    delete:
      tags:
        - Admin Workflows
      summary: Withdrawal of unaccepted invitations
      operationId: revokeWorkflowProjectInvitation
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Undo the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedResponse"
        "403":
          $ref: "#/components/responses/HarnessError"
        "409":
          description: The invitation has been accepted or withdrawn and cannot be
            withdrawn again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/invitations/{token}:
    get:
      tags:
        - Admin Workflows
      summary: View Invitation Details
      description: |
        before accepting the invitation, you must call this operation to check whether the token is still valid. The token itself is the bear credential, and the interface can be accessed without logging in;
        Users who are not logged in can see the joining information through the returned `project.name` and `invitation.role`, and then be directed to the login.
      operationId: lookupWorkflowProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation and project summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationLookupResponse"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/invitations/{token}/accept:
    post:
      tags:
        - Admin Workflows
      summary: Accept project invitation
      description: |
        The caller must be a logged in user. After successful acceptance, the user is added to the project member table, and the corresponding role is determined by the invitation.
        Each token can only be accepted once; a second request after acceptance returns a 409.
      operationId: acceptWorkflowProjectInvitation
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted successfully, including invitation record and written
            member record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvitationAcceptResponse"
        "401":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
        "409":
          $ref: "#/components/responses/HarnessError"
        "410":
          description: The invitation has expired or been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailure"
  /api/projects/{projectId}/visibility:
    patch:
      tags:
        - Admin Workflows
      summary: Update project visibility
      operationId: updateWorkflowProjectVisibility
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  $ref: "#/components/schemas/Visibility"
              required:
                - visibility
            example:
              visibility: public
      responses:
        "200":
          description: The updated workflow summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/versions:
    get:
      tags:
        - Admin Workflows
      summary: List workflow versions
      operationId: listWorkflowVersions
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: List of versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionSummaryResponse"
  /api/projects/{projectId}/data-summary:
    get:
      tags:
        - Admin Workflows
      summary: Summarize project KV and knowledge data
      description: Requires authentication, project read access, and a storage
        declaration that permits server data access. Aggregates the complete
        project data without returning entry values, document content, or
        previews.
      operationId: getWorkflowProjectDataSummary
      parameters:
        - $ref: "#/components/parameters/ProjectName"
      responses:
        "200":
          description: Complete project KV and knowledge statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDataSummaryResponse"
  /api/projects/{projectId}/kv:
    get:
      tags:
        - Admin Workflows
      summary: List Items KV
      operationId: listWorkflowKVEntries
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          schema:
            type: string
        - name: scope
          in: query
          description: The project detail supports only project / conversation and queries
            the KV storage domain only.
          schema:
            type: string
            enum:
              - all
              - project
              - conversation
            default: all
        - name: q
          in: query
          description: Search by key, conversation, or last run.
          schema:
            type: string
        - name: valueType
          in: query
          schema:
            $ref: "#/components/schemas/KVEntryValueType"
        - name: conversationId
          in: query
          schema:
            type: string
        - name: runId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Current-project project / conversation KV pagination. The list
            returns value previews, types, and sizes rather than complete
            values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryPageResponse"
  /api/projects/{projectId}/kv/entry:
    get:
      tags:
        - Admin Workflows
      summary: Read single item KV
      operationId: getWorkflowKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope is required.
          schema:
            type: string
      responses:
        "200":
          description: Single item KV details, including full `value`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntryDetailResponse"
        "404":
          description: KV does not exist.
    delete:
      tags:
        - Admin Workflows
      summary: Delete single item KV
      description: |
        Deletes one existing KV entry, addressed exactly by `scope` + `key` (conversation scope
        also needs `conversationId`). The deletion is permanent and cannot be restored; there is no
        recycle bin for this step. It advances the project storage revision, which is how
        subscribers such as Desktop drop their mirrored entry. Requires project manage access and
        `kv.manage`; a missing entry returns 404.
      operationId: deleteWorkflowKVEntry
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - project
              - conversation
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: conversationId
          in: query
          description: conversation scope is required.
          schema:
            type: string
      responses:
        "200":
          description: Identity of the deleted entry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - scope
                          - key
                        properties:
                          scope:
                            type: string
                            enum:
                              - project
                              - conversation
                          key:
                            type: string
                          conversationId:
                            type: string
        "404":
          description: KV does not exist.
  /api/projects/{projectId}/knowledge-documents:
    get:
      tags:
        - Admin Workflows
      summary: List project knowledge base documents
      operationId: listKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: pageSize
          in: query
          description: The number of document summaries per page. The default value is 20.
            The maximum value is 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
          example: 20
        - name: cursor
          in: query
          description: The nextCursor returned on the previous page; This is an opaque
            token and can only be returned as is.
          schema:
            type: string
      responses:
        "200":
          description: A paginated summary list of knowledge base documents markdown
            within the current workflow project, with no body markdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentPageResponse"
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
    post:
      tags:
        - Admin Workflows
      summary: New Project Knowledge Base Document
      operationId: createKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: response
          in: query
          description: Returns complete documents or lightweight summaries. It is
            recommended to use summary for writing large documents on the
            management side to avoid returning complete markdown after saving.
          schema:
            type: string
            enum:
              - document
              - summary
            default: document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeDocumentInput"
      responses:
        "201":
          description: A new markdown document has been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentWriteResponse"
        "400":
          description: Invalid document id, title, or markdown input.
        "409":
          description: The document id already exists.
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
  /api/projects/{projectId}/knowledge-documents/search:
    get:
      tags:
        - Admin Workflows
      summary: Find project knowledge base documentation
      operationId: searchKnowledgeDocuments
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: q
          in: query
          required: true
          description: Non-empty search keyword, case-insensitive match by markdown line.
          schema:
            type: string
        - name: documentId
          in: query
          description: After passing in, only a single document is found; when omitted,
            all documents are found.
          schema:
            type: string
        - name: beforeLines
          in: query
          description: How many rows of context are returned up for each match, ranging
            from 0 to 50.
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: afterLines
          in: query
          description: How many rows of context are returned down each match, ranging from
            0 to 50.
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 0
        - name: maxMatches
          in: query
          description: This page size parameter is compatible with the old client. It
            takes effect when no pageSize is passed. The default value is 200
            and the maximum value is 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: pageSize
          in: query
          description: The maximum number of matches returned on this page; default 200,
            maximum 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
        - name: cursor
          in: query
          description: The nextCursor returned from the previous page; when omitted, the
            first page is read.
          schema:
            type: string
      responses:
        "200":
          description: Match results by row, including row number and context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResultResponse"
        "400":
          description: The search keyword or the number of context lines is invalid.
        "404":
          description: The specified documentId does not exist.
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
  /api/projects/{projectId}/knowledge-documents/{documentId}/lines:
    get:
      tags:
        - Admin Workflows
      summary: Read the specified line range of the project knowledge base document
      operationId: readKnowledgeDocumentLines
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: startLine
          in: query
          required: true
          description: Starting line number, 1-based inclusive.
          schema:
            type: integer
            minimum: 1
        - name: endLine
          in: query
          required: true
          description: End line number, 1-based inclusive. Read up to 1000 rows at a time.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Specifies the line range of the document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentLinesResponse"
        "400":
          description: The line number parameter is invalid or exceeds the single range
            limit.
        "404":
          description: The specified documentId does not exist.
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
  /api/projects/{projectId}/knowledge-documents/{documentId}:
    get:
      tags:
        - Admin Workflows
      summary: Read project knowledge base documentation
      operationId: getKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Single markdown document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
        "404":
          description: The document does not exist.
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
    put:
      tags:
        - Admin Workflows
      summary: Edit Project Knowledge Base Document
      operationId: editKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
        - name: response
          in: query
          description: Return complete documents or lightweight summaries; It is
            recommended to use summary for saving large documents on the
            management side to avoid returning complete markdown after saving.
          schema:
            type: string
            enum:
              - document
              - summary
            default: document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditKnowledgeDocumentInput"
      responses:
        "200":
          description: Saved document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentWriteResponse"
        "400":
          description: Invalid title or markdown input, or no editable field was passed in.
        "404":
          description: The document does not exist.
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
    delete:
      tags:
        - Admin Workflows
      summary: Delete project knowledge base document
      operationId: deleteKnowledgeDocument
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed from the Repository Index and wrote tombstone tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteKnowledgeDocumentResultResponse"
        "501":
          description: PostgreSQL is not enabled for the current storage, and the project
            repository is not available.
  /api/projects/{projectId}/token-usage:
    get:
      tags:
        - Admin Workflows
      summary: Read project token usage
      operationId: getWorkflowTokenUsage
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: conversationId
          in: query
          schema:
            type: string
          description: The conversation aggregate is returned after being passed in.
        - name: includeEntries
          in: query
          schema:
            type: boolean
          description: Used with conversationId to return `tokenUsage.entry.*` details.
      responses:
        "200":
          description: Project token usage details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenUsageDetailResponse"
        "501":
          description: The current storage does not support the PostgreSQL KV inspection.
  /api/projects/{projectId}/source-share:
    get:
      tags:
        - Admin Workflows
      summary: Read static metadata for a shared version
      description: Requires sign-in and separate source download permission, including
        project-level source grants. Reads an exact published version without
        loading project code or counting a download. Web share links use
        /share/projects/{projectId}/{version} and contain no credentials or
        additional grants.
      operationId: getProjectSourceShare
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          required: true
          description: An exact published version; latest and draft are rejected.
          schema:
            type: string
            pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: Authorized version metadata with Cache-Control set to no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceShareResponse"
        "400":
          $ref: "#/components/responses/HarnessError"
        "401":
          $ref: "#/components/responses/HarnessError"
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
  /api/projects/{projectId}/source-archive:
    get:
      tags:
        - Admin Workflows
      summary: Download an immutable source archive
      description: A successfully sent GET response adds one download to the exact
        returned version. latest counts toward the resolved version. HEAD,
        failed and interrupted responses are not counted.
      operationId: downloadProjectSourceArchive
      parameters:
        - $ref: "#/components/parameters/ProjectName"
        - name: target
          in: query
          description: Exact published version or latest. Draft is rejected.
          schema:
            type: string
            default: latest
      responses:
        "200":
          description: Published source tar.gz archive.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/HarnessError"
        "404":
          $ref: "#/components/responses/HarnessError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Use `STEAMHARNESS_SERVER_ADMIN_KEY` or the created account API Key.
    SessionCookie:
      type: apiKey
      in: cookie
      name: steamharness_auth_session
      description: A httpOnly browser session established by password login or
        administrator key login.
  parameters:
    ProjectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
      example: smoke
    TargetQuery:
      name: target
      in: query
      required: false
      schema:
        type: string
        default: draft
      example: latest
    KanbanConfigurationId:
      name: configurationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelatedProjectAlias:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,63}$
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
      example: api-key-001
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      example: builtin_viewer
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      example: user-001
  responses:
    HarnessError:
      description: steamharness standard error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
  schemas:
    ApiSuccessBase:
      type: object
      properties:
        errCode:
          type: integer
          const: 0
        errMessage:
          type: string
          const: ""
      required:
        - errCode
        - errMessage
    ApiFailure:
      type: object
      properties:
        errCode:
          type: integer
        errMessage:
          type: string
        data: {}
      required:
        - errCode
        - errMessage
    PermissionKey:
      type: string
      enum:
        - system.admin
        - users.read
        - users.manage
        - roles.read
        - roles.manage
        - api_keys.manage_self
        - api_keys.manage_all
        - projects.create
        - projects.read_public
        - projects.read_all
        - projects.manage_own
        - projects.manage_all
        - projects.delete
        - projects.upload
        - projects.publish
        - projects.download_source
        - storage.write
        - kv.read
        - kv.manage
        - knowledge.manage
        - audit.read
        - audit.export
    AuthPrincipalKind:
      type: string
      enum:
        - admin_key
        - admin_session
        - user_session
        - api_key
    UserProfileStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
    AuthPrincipal:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/AuthPrincipalKind"
        userId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        apiKeyId:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: The current API Key expiration. A successfully authenticated
            Desktop Key uses sliding renewal.
        roleNames:
          type: array
          items:
            type: string
      required:
        - kind
    UserProfile:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        roleIds:
          type: array
          items:
            type: string
        roleNames:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
      required:
        - userId
        - email
        - displayName
        - status
        - createdAt
        - updatedAt
        - roleIds
        - roleNames
        - permissions
    ApiKeyRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        prefix:
          type: string
        source:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        lastUsedIp:
          type: string
        userAgent:
          type: string
      required:
        - id
        - userId
        - name
        - prefix
        - source
        - scopes
        - createdAt
    DeviceCodeResult:
      type: object
      properties:
        id:
          type: string
        userCode:
          type: string
        clientName:
          type: string
        source:
          type: string
        requestedScopes:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - pending
            - approved
            - denied
            - expired
            - consumed
        requestedByIp:
          type: string
        userAgent:
          type: string
        expiresAt:
          type: string
          format: date-time
        intervalSeconds:
          type: integer
        approvedAt:
          type: string
          format: date-time
        approvedByUserId:
          type: string
        deniedAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
        result:
          type: object
          properties:
            apiKeyId:
              type: string
            user:
              $ref: "#/components/schemas/AuthUserInfo"
            expiresAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userCode
        - clientName
        - source
        - requestedScopes
        - state
        - expiresAt
        - intervalSeconds
        - createdAt
        - updatedAt
    PermissionDefinition:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/PermissionKey"
        label:
          type: string
        description:
          type: string
        group:
          type: string
      required:
        - key
        - label
        - description
        - group
    PermissionGroup:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDefinition"
      required:
        - id
        - label
        - permissions
    RoleRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
        protected:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - builtin
        - protected
        - permissions
        - createdAt
        - updatedAt
    AdminUserSummary:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/UserProfileStatus"
        lastSignInAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
      required:
        - userId
        - email
        - displayName
        - status
        - roles
        - permissions
    AuthUserInfo:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
      required:
        - userId
        - email
        - displayName
    AuthSessionState:
      type: object
      properties:
        authenticated:
          type: boolean
        principal:
          $ref: "#/components/schemas/AuthPrincipal"
        accessToken:
          type: string
          description: The API Key plaintext returned when a non-Web client requests
            `source=desktop` or `source=cli`; it is returned only once.
        apiKey:
          $ref: "#/components/schemas/ApiKeyRecord"
        user:
          $ref: "#/components/schemas/AuthUserInfo"
        expiresAt:
          type: string
          format: date-time
      required:
        - authenticated
    AuthSessionStateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthSessionState"
          required:
            - data
    AdminKeyConfiguredResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                configured:
                  type: boolean
              required:
                - configured
          required:
            - data
    LogoutResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                loggedOut:
                  type: boolean
              required:
                - loggedOut
          required:
            - data
    MeResult:
      type: object
      properties:
        principal:
          $ref: "#/components/schemas/AuthPrincipal"
        profile:
          anyOf:
            - $ref: "#/components/schemas/UserProfile"
            - type: "null"
      required:
        - profile
    MeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MeResult"
          required:
            - data
    UserProfileResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                profile:
                  $ref: "#/components/schemas/UserProfile"
              required:
                - profile
          required:
            - data
    ApiKeyListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/ApiKeyRecord"
              required:
                - items
          required:
            - data
    ApiKeyCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                apiKey:
                  $ref: "#/components/schemas/ApiKeyRecord"
                token:
                  type: string
              required:
                - apiKey
                - token
          required:
            - data
    ApiKeyRevokeResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                revoked:
                  type: boolean
                id:
                  type: string
              required:
                - revoked
                - id
          required:
            - data
    PermissionGroupListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                groups:
                  type: array
                  items:
                    $ref: "#/components/schemas/PermissionGroup"
              required:
                - groups
          required:
            - data
    RoleListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoleRecord"
              required:
                - items
          required:
            - data
    RoleResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
