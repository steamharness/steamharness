events {}
http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  include /etc/nginx/mime.types;
  client_max_body_size 100m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_buffering off;
  upstream steamharness_stable { server 127.0.0.1:7130; }
  upstream steamharness_alpha { server 127.0.0.1:7140; }
  upstream steamharness_docs { server 127.0.0.1:7132; }
  # The hosted Desktop web build: the same renderer as the app, served from the
  # origin root and talking to this Server's API.
  upstream steamharness_web_alpha { server 127.0.0.1:7152; }
  server { listen 80 default_server; server_name _; return 444; }
  server { listen 80; server_name steamharness.yuhe.space api.steamharness.yuhe.space hooks.steamharness.yuhe.space alpha.steamharness.yuhe.space docs.steamharness.yuhe.space alpha-web.steamharness.yuhe.space; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { return 301 https://$host$request_uri; } }
  server { listen 443 ssl; http2 on; server_name steamharness.yuhe.space api.steamharness.yuhe.space hooks.steamharness.yuhe.space; ssl_certificate /etc/nginx/certs/live/steamharness.yuhe.space/fullchain.pem; ssl_certificate_key /etc/nginx/certs/live/steamharness.yuhe.space/privkey.pem; location / { proxy_pass http://steamharness_stable; } }
  server { listen 443 ssl; http2 on; server_name alpha.steamharness.yuhe.space; ssl_certificate /etc/nginx/certs/live/steamharness.yuhe.space/fullchain.pem; ssl_certificate_key /etc/nginx/certs/live/steamharness.yuhe.space/privkey.pem; location / { proxy_pass http://steamharness_alpha; } }
  server { listen 443 ssl; http2 on; server_name docs.steamharness.yuhe.space; ssl_certificate /etc/nginx/certs/live/steamharness.yuhe.space/fullchain.pem; ssl_certificate_key /etc/nginx/certs/live/steamharness.yuhe.space/privkey.pem; location / { proxy_pass http://steamharness_docs; } }
  # The hosted Desktop web build. Everything it does is the Server's API, so
  # the host is two locations and no page of its own on the Server side.
  server {
    listen 443 ssl; http2 on;
    server_name alpha-web.steamharness.yuhe.space;
    ssl_certificate /etc/nginx/certs/live/steamharness.yuhe.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/steamharness.yuhe.space/privkey.pem;
    # Same origin on purpose: the page's API calls are first-party, so the
    # session cookie is sent without CORS and without a cross-site policy.
    location /api/ { proxy_pass http://steamharness_alpha; }
    location / { proxy_pass http://steamharness_web_alpha; }
  }
}
