events {}
http {
  include /etc/nginx/mime.types;
  client_max_body_size 100m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  upstream steamharness_stable { server 127.0.0.1:7130; }
  upstream steamharness_alpha { server 127.0.0.1:7140; }
  upstream steamharness_docs { server 127.0.0.1:7132; }
  server { listen 80 default_server; server_name _; return 444; }
  server { listen 80; server_name steamharness.yuhe.space api.steamharness.yuhe.space hooks.steamharness.yuhe.space; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { proxy_pass http://steamharness_stable; include /etc/nginx/proxy_params; } }
  # The hosted web build serves the ACME challenge only. It must NOT fall into
  # the stable block above: until the certificate covers it — a cold bootstrap,
  # or the window right after this file is installed — that would silently
  # serve the Server's admin SPA on alpha-web.steamharness.yuhe.space.
  #
  # This block is also why the plaintext host is refused rather than forwarded
  # once the certificate exists: the page answers with a login form and a
  # session cookie, so there is no version of it that should ever be reachable
  # over HTTP. 444 is the same refusal the default server uses; the HTTPS vhost
  # is the only way in.
  server { listen 80; server_name alpha-web.steamharness.yuhe.space; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { return 444; } }
  server { listen 80; server_name alpha.steamharness.yuhe.space; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { proxy_pass http://steamharness_alpha; include /etc/nginx/proxy_params; } }
  server { listen 80; server_name docs.steamharness.yuhe.space; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { proxy_pass http://steamharness_docs; include /etc/nginx/proxy_params; } }
}
